<figcaption class="ltx_caption ltx_centering"><span class="ltx_tag ltx_tag_figure"><span class="ltx_text" id="S4.F8.3" style="font-size:90%;">Figure 8</span>: </span><span class="ltx_text" id="S4.F8.4" style="font-size:90%;">Performance of draft models with varying inputs. The target LLM is Vicuna 7B, and the test dataset is MT-bench. Speed refers to the walltime speedup ratio, <math alttext="\tau" class="ltx_Math" display="inline" id="S4.F8.m5" intent=":literal"><semantics><mi>τ</mi><annotation encoding="application/x-tex">\tau</annotation></semantics></math> denotes the average acceptance length, <math alttext="0\text{-}\alpha" class="ltx_Math" display="inline" id="S4.F8.m6" intent=":literal"><semantics><mrow><mn>0</mn><mo lspace="0em" rspace="0em">​</mo><mtext>-</mtext><mo lspace="0em" rspace="0em">​</mo><mi>α</mi></mrow><annotation encoding="application/x-tex">0\text{-}\alpha</annotation></semantics></math> represents the acceptance rate with entirely precise inputs, <math alttext="1\text{-}\alpha" class="ltx_Math" display="inline" id="S4.F8.m7" intent=":literal"><semantics><mrow><mn>1</mn><mo lspace="0em" rspace="0em">​</mo><mtext>-</mtext><mo lspace="0em" rspace="0em">​</mo><mi>α</mi></mrow><annotation encoding="application/x-tex">1\text{-}\alpha</annotation></semantics></math> indicates the acceptance rate when the input includes one imprecise feature, and <math alttext="T" class="ltx_Math" display="inline" id="S4.F8.m8" intent=":literal"><semantics><mi>T</mi><annotation encoding="application/x-tex">T</annotation></semantics></math> refers to the temperature.</span></figcaption>
