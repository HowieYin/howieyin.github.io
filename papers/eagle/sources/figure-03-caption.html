<figcaption class="ltx_caption ltx_centering"><span class="ltx_tag ltx_tag_figure"><span class="ltx_text" id="S1.F3.3" style="font-size:90%;">Figure 3</span>: </span><span class="ltx_text" id="S1.F3.4" style="font-size:90%;">Uncertainty in feature sequences. The next feature following <math alttext="f_{I}" class="ltx_Math" display="inline" id="S1.F3.m3" intent=":literal"><semantics><msub><mi>f</mi><mi>I</mi></msub><annotation encoding="application/x-tex">f_{I}</annotation></semantics></math> is contingent on the sampling outcome and cannot be determined solely based on <math alttext="f_{I}" class="ltx_Math" display="inline" id="S1.F3.m4" intent=":literal"><semantics><msub><mi>f</mi><mi>I</mi></msub><annotation encoding="application/x-tex">f_{I}</annotation></semantics></math>, where both “always” and “am” are possible to follow the token “I” and lead to two branches.</span></figcaption>
