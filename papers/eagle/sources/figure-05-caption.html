<figcaption class="ltx_caption ltx_centering"><span class="ltx_tag ltx_tag_figure"><span class="ltx_text" id="S3.F5.7" style="font-size:90%;">Figure 5</span>: </span><span class="ltx_text" id="S3.F5.8" style="font-size:90%;">A comparison of the methods for drafting the fourth and fifth tokens, <math alttext="t_{4}" class="ltx_Math" display="inline" id="S3.F5.m7" intent=":literal"><semantics><msub><mi>t</mi><mn>4</mn></msub><annotation encoding="application/x-tex">t_{4}</annotation></semantics></math> and <math alttext="t_{5}" class="ltx_Math" display="inline" id="S3.F5.m8" intent=":literal"><semantics><msub><mi>t</mi><mn>5</mn></msub><annotation encoding="application/x-tex">t_{5}</annotation></semantics></math>. <math alttext="t" class="ltx_Math" display="inline" id="S3.F5.m9" intent=":literal"><semantics><mi>t</mi><annotation encoding="application/x-tex">t</annotation></semantics></math> (represented by <span class="ltx_text" id="S3.F5.8.1" style="--ltx-fg-color:#0000FF;">blue</span> blocks) denotes tokens, and <math alttext="f" class="ltx_Math" display="inline" id="S3.F5.m10" intent=":literal"><semantics><mi>f</mi><annotation encoding="application/x-tex">f</annotation></semantics></math> (<span class="ltx_text" id="S3.F5.8.2" style="--ltx-fg-color:#FF8000;">orange</span> blocks) signifies the features, with subscripts indicating their positions in the sequence. The <span class="ltx_text" id="S3.F5.8.3" style="--ltx-fg-color:#FF0000;">red</span> border indicates the predictions of the draft model. For simplicity, the <math alttext="n" class="ltx_Math" display="inline" id="S3.F5.m11" intent=":literal"><semantics><mi>n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math> in the <math alttext="n" class="ltx_Math" display="inline" id="S3.F5.m12" intent=":literal"><semantics><mi>n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math>-gram for Lookahead, as shown in the figure, has been set to 2.</span></figcaption>
