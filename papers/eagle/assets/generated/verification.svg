<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 468" role="img" aria-label="验证、提交与下一轮反馈"><title>验证、提交与下一轮反馈</title><rect width="720" height="468" rx="8" fill="#101823"/><text x="24" y="30" fill="#dbe6f4" font-size="16">验证、提交与下一轮反馈</text><path d="M40 97v58m-5 -5l5 5 5 -5" stroke="#779dcc" fill="none"/><circle cx="40" cy="80" r="15" fill="#274664"/><text x="40" y="85" fill="#e8f2ff" text-anchor="middle" font-size="14">1</text><text x="70" y="67" fill="#e3bd80" font-size="12">起点</text><text x="70" y="93" fill="#dbe6f4" font-size="16">committed prefix + sampled anchor</text><text x="70" y="121" fill="#a8bdd6" font-size="13">draft token tree + conditional q</text><line x1="70" x2="695" y1="139" y2="139" stroke="#293a50"/><path d="M40 199v58m-5 -5l5 5 5 -5" stroke="#779dcc" fill="none"/><circle cx="40" cy="182" r="15" fill="#274664"/><text x="40" y="187" fill="#e8f2ff" text-anchor="middle" font-size="14">2</text><text x="70" y="169" fill="#e3bd80" font-size="12">真实分布</text><text x="70" y="195" fill="#dbe6f4" font-size="16">target ancestor mask + depth positions</text><text x="70" y="223" fill="#a8bdd6" font-size="13">一次 forward 得各候选 p</text><line x1="70" x2="695" y1="241" y2="241" stroke="#293a50"/><path d="M40 301v58m-5 -5l5 5 5 -5" stroke="#779dcc" fill="none"/><circle cx="40" cy="284" r="15" fill="#274664"/><text x="40" y="289" fill="#e8f2ff" text-anchor="middle" font-size="14">3</text><text x="70" y="271" fill="#e3bd80" font-size="12">概率校正</text><text x="70" y="297" fill="#dbe6f4" font-size="16">accept min(1,p/q)；reject [p−q]+</text><text x="70" y="325" fill="#a8bdd6" font-size="13">只保留接受分支的真实 features / KV</text><line x1="70" x2="695" y1="343" y2="343" stroke="#293a50"/><circle cx="40" cy="386" r="15" fill="#274664"/><text x="40" y="391" fill="#e8f2ff" text-anchor="middle" font-size="14">4</text><text x="70" y="373" fill="#e3bd80" font-size="12">下一轮</text><text x="70" y="399" fill="#dbe6f4" font-size="16">fallback token 作为 anchor</text><text x="70" y="427" fill="#a8bdd6" font-size="13">处理后补齐 feature；siblings 不提交</text><line x1="70" x2="695" y1="445" y2="445" stroke="#293a50"/></svg>