<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" role="img" aria-label="EAGLE-2 继承的 feature draft"><style>text{font-family:system-ui,sans-serif;fill:#dce7f6;font-size:16px}.small{fill:#a2b4ce;font-size:13px}rect{fill:#18273b;stroke:#718aaa}path{fill:none;stroke:#98b6dd;stroke-width:1.5}</style><rect x="80" y="15" width="600" height="72" rx="6"/><text x="104" y="43">Target feature [B,S,d] + shifted token [B,S]</text><text class="small" x="104" y="68">token embedding → [B,S,d]；target 冻结</text><path d="M380 87V112m-5 -7l5 7 5 -7"/><rect x="80" y="115" width="600" height="72" rx="6"/><text x="104" y="143">Concat [B,S,2d] → FC [B,S,d]</text><text class="small" x="104" y="168">token 与 feature 对齐；下一 token 消除 feature 预测歧义</text><path d="M380 187V212m-5 -7l5 7 5 -7"/><rect x="80" y="215" width="600" height="72" rx="6"/><text x="104" y="243">One draft decoder layer → predicted feature [B,S,d]</text><text class="small" x="104" y="268">EAGLE-2 无新训练；使用已有 EAGLE draft</text><path d="M380 287V312m-5 -7l5 7 5 -7"/><rect x="80" y="315" width="600" height="72" rx="6"/><text x="104" y="343">Shared target LM head → logits [B,S,V]</text><text class="small" x="104" y="368">softmax / log-softmax → candidate confidence</text><text class="small" x="30" y="470">结构依据 EAGLE 前作与 cnets1 legacy route；不适用于 EAGLE-3 cnets。</text></svg>