<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 590" role="img" aria-label="一轮 speculative cycle 的状态提交"><style>text{font-family:system-ui,sans-serif;fill:#dce7f6;font-size:16px}.small{fill:#a2b4ce;font-size:13px}rect{fill:#18273b;stroke:#718aaa}path{fill:none;stroke:#98b6dd;stroke-width:1.5}</style><rect x="80" y="15" width="600" height="72" rx="6"/><text x="104" y="43">已验证 prefix + target root</text><text class="small" x="104" y="68">prefix KV 已提交；draft 使用对齐 feature/token</text><path d="M380 87V112m-5 -7l5 7 5 -7"/><rect x="80" y="115" width="600" height="72" rx="6"/><text x="104" y="143">Expansion → candidate pool → global rerank</text><text class="small" x="104" y="168">log value；选择祖先闭包；展平 + depth position + mask</text><path d="M380 187V212m-5 -7l5 7 5 -7"/><rect x="80" y="215" width="600" height="72" rx="6"/><text x="104" y="243">Target parallel verification</text><text class="small" x="104" y="268">临时 KV 包含候选分支；每条路径隔离兄弟 token</text><path d="M380 287V312m-5 -7l5 7 5 -7"/><rect x="80" y="315" width="600" height="72" rx="6"/><text x="104" y="343">Corrected acceptance → one accepted path + next root</text><text class="small" x="104" y="368">greedy 连续匹配或正确 proposal residual correction</text><path d="M380 387V412m-5 -7l5 7 5 -7"/><rect x="80" y="415" width="600" height="72" rx="6"/><text x="104" y="443">Gather accepted KV → compact prefix → next cycle</text><text class="small" x="104" y="468">落选分支丢弃；token / feature / cache length 同步</text><text class="small" x="30" y="570">树构建提高效率；分布正确性依赖 verifier、attention、positions 和 KV。</text></svg>