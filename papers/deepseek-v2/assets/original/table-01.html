<figcaption class="ltx_caption ltx_centering"><span class="ltx_tag ltx_tag_table">Table 1: </span>
Comparison of the KV cache per token among different attention mechanisms.
<math alttext="n_{h}" class="ltx_Math" display="inline" id="S2.T1.m15" intent=":literal"><semantics><msub><mi>n</mi><mi>h</mi></msub><annotation encoding="application/x-tex">n_{h}</annotation></semantics></math> denotes the number of attention heads,
<math alttext="d_{h}" class="ltx_Math" display="inline" id="S2.T1.m16" intent=":literal"><semantics><msub><mi>d</mi><mi>h</mi></msub><annotation encoding="application/x-tex">d_{h}</annotation></semantics></math> denotes the dimension per attention head,
<math alttext="l" class="ltx_Math" display="inline" id="S2.T1.m17" intent=":literal"><semantics><mi>l</mi><annotation encoding="application/x-tex">l</annotation></semantics></math> denotes the number of layers,
<math alttext="n_{g}" class="ltx_Math" display="inline" id="S2.T1.m18" intent=":literal"><semantics><msub><mi>n</mi><mi>g</mi></msub><annotation encoding="application/x-tex">n_{g}</annotation></semantics></math> denotes the number of groups in GQA,
and <math alttext="d_{c}" class="ltx_Math" display="inline" id="S2.T1.m19" intent=":literal"><semantics><msub><mi>d</mi><mi>c</mi></msub><annotation encoding="application/x-tex">d_{c}</annotation></semantics></math> and <math alttext="d_{h}^{R}" class="ltx_Math" display="inline" id="S2.T1.m20" intent=":literal"><semantics><msubsup><mi>d</mi><mi>h</mi><mi>R</mi></msubsup><annotation encoding="application/x-tex">d_{h}^{R}</annotation></semantics></math> denote the KV compression dimension and the per-head dimension of the decoupled queries and key in MLA, respectively.
The amount of KV cache is measured by the number of elements, regardless of the storage precision.
For DeepSeek-V2, <math alttext="d_{c}" class="ltx_Math" display="inline" id="S2.T1.m21" intent=":literal"><semantics><msub><mi>d</mi><mi>c</mi></msub><annotation encoding="application/x-tex">d_{c}</annotation></semantics></math> is set to <math alttext="4d_{h}" class="ltx_Math" display="inline" id="S2.T1.m22" intent=":literal"><semantics><mrow><mn>4</mn><mo lspace="0em" rspace="0em">​</mo><msub><mi>d</mi><mi>h</mi></msub></mrow><annotation encoding="application/x-tex">4d_{h}</annotation></semantics></math> and <math alttext="d_{h}^{R}" class="ltx_Math" display="inline" id="S2.T1.m23" intent=":literal"><semantics><msubsup><mi>d</mi><mi>h</mi><mi>R</mi></msubsup><annotation encoding="application/x-tex">d_{h}^{R}</annotation></semantics></math> is set to <math alttext="\frac{d_{h}}{2}" class="ltx_Math" display="inline" id="S2.T1.m24" intent=":literal"><semantics><mfrac><msub><mi>d</mi><mi>h</mi></msub><mn>2</mn></mfrac><annotation encoding="application/x-tex">\frac{d_{h}}{2}</annotation></semantics></math>.
So, its KV cache is equal to GQA with only 2.25 groups, but its performance is stronger than MHA.
</figcaption>
