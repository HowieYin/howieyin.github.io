<tr class="ltx_tr" id="A7.T18.2.2">
<td class="ltx_td ltx_align_left ltx_align_top" id="A7.T18.2.2.1">
<span class="ltx_inline-block ltx_align_top" id="A7.T18.2.2.1.1">
<span class="ltx_p" id="A7.T18.2.2.1.1.1"><span class="ltx_text" id="A7.T18.2.2.1.1.1.1">Q: 某小学在“献爱心–为汶川地震区捐款”活动中，六年级五个班共捐款8000元，其中一班捐款1500元，二班比一班多捐款200元，三班捐款1600元，四班与五班捐款数之比是3：5．四班捐款多少元？</span></span>
</span></td></tr>
<tr class="ltx_tr" id="A7.T18.2.3">
<td class="ltx_td ltx_align_left ltx_align_top" id="A7.T18.2.3.1">
<span class="ltx_inline-block ltx_align_top" id="A7.T18.2.3.1.1">
<span class="ltx_p" id="A7.T18.2.3.1.1.1"><span class="ltx_text" id="A7.T18.2.3.1.1.1.1">A: 一班捐款1500元，而二班比一班多捐200元，所以二班捐款1500+200=1700元，又知道六年级五个班一共捐款8000元，所以四班和五班捐款之和 = 一共捐款 - 一班和二班和三班捐款之和，即8000-1500-1700-1600=3200元，而题目说四班与五班捐款数之比是3：5，则四班捐款了3200/(3+5)*3=1200元。所以答案是：1200。</span></span>
</span></td></tr>
<tr class="ltx_tr" id="A7.T18.2.4">
<td class="ltx_td ltx_align_left ltx_align_top" id="A7.T18.2.4.1"></td></tr>
<tr class="ltx_tr" id="A7.T18.2.5">
<td class="ltx_td ltx_align_left ltx_align_top" id="A7.T18.2.5.1">
<span class="ltx_inline-block ltx_align_top" id="A7.T18.2.5.1.1">
<span class="ltx_p" id="A7.T18.2.5.1.1.1"><span class="ltx_text" id="A7.T18.2.5.1.1.1.1">Q: 小俊在东西大道上跑步，若规定向东为正。他先向东跑了800米，然后又跑了一段之后，他位于出发点西边100米处，小俊第二段跑了多少米？</span></span>
</span></td></tr>
<tr class="ltx_tr" id="A7.T18.2.6">
<td class="ltx_td ltx_align_left ltx_align_top" id="A7.T18.2.6.1">
<span class="ltx_inline-block ltx_align_top" id="A7.T18.2.6.1.1">
<span class="ltx_p" id="A7.T18.2.6.1.1.1"><span class="ltx_text" id="A7.T18.2.6.1.1.1.1">A: 小俊第二段跑完后位于出发点西边，所以第二段应该是向西跑，第二段跑的长度-第一段跑的长度=100，第二段跑了100+800=900米。所以答案是：900。</span></span>
</span></td></tr>
<tr class="ltx_tr" id="A7.T18.2.7">
<td class="ltx_td ltx_align_left ltx_align_top" id="A7.T18.2.7.1"></td></tr>
<tr class="ltx_tr" id="A7.T18.2.8">
<td class="ltx_td ltx_align_left ltx_align_top" id="A7.T18.2.8.1">
<span class="ltx_inline-block ltx_align_top" id="A7.T18.2.8.1.1">
<span class="ltx_p" id="A7.T18.2.8.1.1.1"><span class="ltx_text" id="A7.T18.2.8.1.1.1.1">Q: A车和B车同时从甲、乙两地相向开出，经过5小时相遇．然后，它们又各自按原速原方向继续行驶3小时，这时A车离乙地还有135千米，B车离甲地还有165千米．甲、乙两地相距多少千米？</span></span>
</span></td></tr>
<tr class="ltx_tr" id="A7.T18.2.9">
<td class="ltx_td ltx_align_left ltx_align_top" id="A7.T18.2.9.1">
<span class="ltx_inline-block ltx_align_top" id="A7.T18.2.9.1.1">
<span class="ltx_p" id="A7.T18.2.9.1.1.1"><span class="ltx_text" id="A7.T18.2.9.1.1.1.1">A: 假设A车的速度为x千米每小时，B车的速度为y千米每小时，根据而A、B相遇时A车行驶了5小时，A车行驶3小时后离乙地还有135千米，B车行驶3小时后距离甲地还有165千米，可以得到甲乙两地相距=5x+5y=135+8x=165+8y，变换得到：10(x+y)=300+8(x+y)，于是x+y=150，甲乙两地相距5(x+y)=750千米。所以答案是：750。</span></span>
</span></td></tr>
