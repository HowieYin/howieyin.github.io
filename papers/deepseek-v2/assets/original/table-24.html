<tr class="ltx_tr" id="A7.T24.2.1">
<td class="ltx_td ltx_align_left ltx_align_top ltx_border_tt" id="A7.T24.2.1.1">
<span class="ltx_inline-block ltx_align_top" id="A7.T24.2.1.1.1">
<span class="ltx_p" id="A7.T24.2.1.1.1.1"><span class="ltx_text ltx_font_bold" id="A7.T24.2.1.1.1.1.1">PROMPT</span></span>
</span></td></tr>
<tr class="ltx_tr" id="A7.T24.2.2">
<td class="ltx_td ltx_align_left ltx_align_top" id="A7.T24.2.2.1">
<span class="ltx_inline-block ltx_align_top" id="A7.T24.2.2.1.1">
<span class="ltx_p" id="A7.T24.2.2.1.1.1"><span class="ltx_text" id="A7.T24.2.2.1.1.1.1">Q: Max can mow the lawn in 40 minutes. If it takes him twice that long to fertilize the lawn, how long will it take him to both mow and fertilize the lawn?</span></span>
</span></td></tr>
<tr class="ltx_tr" id="A7.T24.2.3">
<td class="ltx_td ltx_align_left ltx_align_top" id="A7.T24.2.3.1">
<span class="ltx_inline-block ltx_align_top" id="A7.T24.2.3.1.1">
<span class="ltx_p" id="A7.T24.2.3.1.1.1"><span class="ltx_text" id="A7.T24.2.3.1.1.1.1">A: Let’s think step by step. It takes Max 2 * 40 minutes = 80 minutes to fertilize the lawn. In total, Max takes 80 minutes + 40 minutes = 120 minutes to both mow and fertilize the lawn. The answer is 120.</span></span>
</span></td></tr>
<tr class="ltx_tr" id="A7.T24.2.4">
<td class="ltx_td ltx_align_left ltx_align_top" id="A7.T24.2.4.1"></td></tr>
<tr class="ltx_tr" id="A7.T24.2.5">
<td class="ltx_td ltx_align_left ltx_align_top" id="A7.T24.2.5.1">
<span class="ltx_inline-block ltx_align_top" id="A7.T24.2.5.1.1">
<span class="ltx_p" id="A7.T24.2.5.1.1.1"><span class="ltx_text" id="A7.T24.2.5.1.1.1.1">Q: The bagels cost $2.25 each, or a dozen for $24. How much is saved, per bagel, in cents, by buying a dozen at a time?</span></span>
</span></td></tr>
<tr class="ltx_tr" id="A7.T24.2.6">
<td class="ltx_td ltx_align_left ltx_align_top" id="A7.T24.2.6.1">
<span class="ltx_inline-block ltx_align_top" id="A7.T24.2.6.1.1">
<span class="ltx_p" id="A7.T24.2.6.1.1.1"><span class="ltx_text" id="A7.T24.2.6.1.1.1.1">A: Let’s think step by step. They cost 2.25*100=225 cents each. At the bulk rate, they are 24/12=2 dollar each. They cost 2*100=200 cents each. 225-200=25 cents are saved per bagel. The answer is 25.</span></span>
</span></td></tr>
<tr class="ltx_tr" id="A7.T24.2.7">
<td class="ltx_td ltx_align_left ltx_align_top" id="A7.T24.2.7.1"></td></tr>
<tr class="ltx_tr" id="A7.T24.2.8">
<td class="ltx_td ltx_align_left ltx_align_top" id="A7.T24.2.8.1">
<span class="ltx_inline-block ltx_align_top" id="A7.T24.2.8.1.1">
<span class="ltx_p" id="A7.T24.2.8.1.1.1"><span class="ltx_text" id="A7.T24.2.8.1.1.1.1">Q: Tim is 5 years old. His cousin, Rommel, is thrice as old as he is. His other cousin, Jenny, is 2 years older than Rommel. How many years younger is Tim than Jenny?</span></span>
</span></td></tr>
<tr class="ltx_tr" id="A7.T24.2.9">
<td class="ltx_td ltx_align_left ltx_align_top" id="A7.T24.2.9.1">
<span class="ltx_inline-block ltx_align_top" id="A7.T24.2.9.1.1">
<span class="ltx_p" id="A7.T24.2.9.1.1.1"><span class="ltx_text" id="A7.T24.2.9.1.1.1.1">A: Let’s think step by step. Rommel is 5 x 3 = 15 years old. Jenny is 15 + 2 = 17 years old. So, Tim is 17 - 5 = 12 years younger than Jenny. The answer is 12.</span></span>
</span></td></tr>
<tr class="ltx_tr" id="A7.T24.2.10">
<td class="ltx_td ltx_align_left ltx_align_top" id="A7.T24.2.10.1"></td></tr>
<tr class="ltx_tr" id="A7.T24.2.11">
<td class="ltx_td ltx_align_left ltx_align_top" id="A7.T24.2.11.1">
<span class="ltx_inline-block ltx_align_top" id="A7.T24.2.11.1.1">
<span class="ltx_p" id="A7.T24.2.11.1.1.1"><span class="ltx_text" id="A7.T24.2.11.1.1.1.1">Q: The school has 14 boys and 10 girls. If 4 boys and 3 girls drop out, how many boys and girls are left?</span></span>
</span></td></tr>
<tr class="ltx_tr" id="A7.T24.2.12">
<td class="ltx_td ltx_align_left ltx_align_top" id="A7.T24.2.12.1">
<span class="ltx_inline-block ltx_align_top" id="A7.T24.2.12.1.1">
<span class="ltx_p" id="A7.T24.2.12.1.1.1"><span class="ltx_text" id="A7.T24.2.12.1.1.1.1">A: Let’s think step by step. There are 14 boys - 4 boys = 10 boys left. There are 10 girls - 3 girls = 7 girls left. In total there are 10 boys + 7 girls = 17 boys and girls left. The answer is 17.</span></span>
</span></td></tr>
<tr class="ltx_tr" id="A7.T24.2.13">
<td class="ltx_td ltx_align_left ltx_align_top" id="A7.T24.2.13.1"></td></tr>
<tr class="ltx_tr" id="A7.T24.2.14">
<td class="ltx_td ltx_align_left ltx_align_top" id="A7.T24.2.14.1">
<span class="ltx_inline-block ltx_align_top" id="A7.T24.2.14.1.1">
<span class="ltx_p" id="A7.T24.2.14.1.1.1"><span class="ltx_text" id="A7.T24.2.14.1.1.1.1">Q: Building one birdhouse requires 7 planks and 20 nails. If 1 nail costs 0.05, and one plank costs 3, what is the cost, in dollars, to build 4 birdhouses?</span></span>
</span></td></tr>
<tr class="ltx_tr" id="A7.T24.2.15">
<td class="ltx_td ltx_align_left ltx_align_top" id="A7.T24.2.15.1">
<span class="ltx_inline-block ltx_align_top" id="A7.T24.2.15.1.1">
<span class="ltx_p" id="A7.T24.2.15.1.1.1"><span class="ltx_text" id="A7.T24.2.15.1.1.1.1">A: Let’s think step by step. The cost of the planks for one birdhouse is 7 * 3 = 21. And the nails are a cost of 20 * 0.05 = 1 for each birdhouse. So to build one birdhouse one will need 21 + 1 = 22. So the cost of building 4 birdhouses is at 4 * 22 = 88. The answer is 88.</span></span>
</span></td></tr>
<tr class="ltx_tr" id="A7.T24.2.16">
<td class="ltx_td ltx_align_left ltx_align_top" id="A7.T24.2.16.1"></td></tr>
<tr class="ltx_tr" id="A7.T24.2.17">
<td class="ltx_td ltx_align_left ltx_align_top" id="A7.T24.2.17.1">
<span class="ltx_inline-block ltx_align_top" id="A7.T24.2.17.1.1">
<span class="ltx_p" id="A7.T24.2.17.1.1.1"><span class="ltx_text" id="A7.T24.2.17.1.1.1.1">Q: Danny brings 3 watermelons to his family picnic. He cuts each watermelon into 10 slices. His sister brings 1 watermelon to the family picnic, and she cuts the watermelon into 15 slices. How many watermelon slices are there in total at the picnic?</span></span>
</span></td></tr>
<tr class="ltx_tr" id="A7.T24.2.18">
<td class="ltx_td ltx_align_left ltx_align_top" id="A7.T24.2.18.1">
<span class="ltx_inline-block ltx_align_top" id="A7.T24.2.18.1.1">
<span class="ltx_p" id="A7.T24.2.18.1.1.1"><span class="ltx_text" id="A7.T24.2.18.1.1.1.1">A: Let’s think step by step. From Danny, there are 3 * 10 = 30 watermelon slices. From his sister, there are 1 * 15 = 15 watermelon slices. There are a total of 30 + 15 = 45 watermelon slices. The answer is 45.</span></span>
</span></td></tr>
<tr class="ltx_tr" id="A7.T24.2.19">
<td class="ltx_td ltx_align_left ltx_align_top" id="A7.T24.2.19.1"></td></tr>
<tr class="ltx_tr" id="A7.T24.2.20">
<td class="ltx_td ltx_align_left ltx_align_top" id="A7.T24.2.20.1">
<span class="ltx_inline-block ltx_align_top" id="A7.T24.2.20.1.1">
<span class="ltx_p" id="A7.T24.2.20.1.1.1"><span class="ltx_text" id="A7.T24.2.20.1.1.1.1">Q: Angela is a bike messenger in New York. She needs to deliver 8 times as many packages as meals. If she needs to deliver 27 meals and packages combined, how many meals does she deliver?</span></span>
</span></td></tr>
<tr class="ltx_tr" id="A7.T24.2.21">
<td class="ltx_td ltx_align_left ltx_align_top" id="A7.T24.2.21.1">
<span class="ltx_inline-block ltx_align_top" id="A7.T24.2.21.1.1">
<span class="ltx_p" id="A7.T24.2.21.1.1.1"><span class="ltx_text" id="A7.T24.2.21.1.1.1.1">A: Let’s think step by step. Let p be the number of packages Angela delivers and m be the number of meals. We know that p + m = 27 and p = 8m. Substituting the second equation into the first equation, we get 8m + m = 27. Combining like terms, we get 9m = 27. Dividing both sides by 9, we get m = 3. The answer is 3.</span></span>
</span></td></tr>
<tr class="ltx_tr" id="A7.T24.2.22">
<td class="ltx_td ltx_align_left ltx_align_top" id="A7.T24.2.22.1"></td></tr>
<tr class="ltx_tr" id="A7.T24.2.23">
<td class="ltx_td ltx_align_left ltx_align_top" id="A7.T24.2.23.1">
<span class="ltx_inline-block ltx_align_top" id="A7.T24.2.23.1.1">
<span class="ltx_p" id="A7.T24.2.23.1.1.1"><span class="ltx_text" id="A7.T24.2.23.1.1.1.1">Q: Cori is 3 years old today. In 5 years, she will be one-third the age of her aunt. How old is her aunt today?</span></span>
</span></td></tr>
<tr class="ltx_tr" id="A7.T24.2.24">
<td class="ltx_td ltx_align_left ltx_align_top" id="A7.T24.2.24.1">
<span class="ltx_inline-block ltx_align_top" id="A7.T24.2.24.1.1">
<span class="ltx_p" id="A7.T24.2.24.1.1.1"><span class="ltx_text" id="A7.T24.2.24.1.1.1.1">A: Let’s think step by step. In 5 years, Cori will be 3 + 5 = 8 years old. In 5 years, Cori’s aunt will be 8 x 3 = 24 years old. Today, her aunt is 24 - 5 = 19 years old. The answer is 19.</span></span>
</span></td></tr>
<tr class="ltx_tr" id="A7.T24.2.25">
<td class="ltx_td ltx_align_left ltx_align_top" id="A7.T24.2.25.1"></td></tr>

<span class="ltx_p" id="A7.T24.2.26.1.1.1"><span class="ltx_text" id="A7.T24.2.26.1.1.1.1">Q: Indras has 6 letters in her name. Her sister’s name has 4 more letters than half of the letters in Indras’ name. How many letters are in Indras and her sister’s names?</span></span>
</span></td></tr>
