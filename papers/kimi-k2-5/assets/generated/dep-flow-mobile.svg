<svg xmlns="http://www.w3.org/2000/svg" width="336" height="588" viewBox="0 0 336 588" role="img" aria-labelledby="title desc"><title id="title">Decoupled Encoder Process · three stages</title><desc id="desc">Balance the global visual batch, run replicated ViT forward and keep only final outputs. Gather outputs to PP stage zero and train the backbone with text PP and EP. Return visual-output gradients, recompute the encoder forward, run backward and synchronize ViT gradients. Saving intermediate activation memory requires extra recomputation and communication.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#93afc7"/></marker></defs><rect width="336" height="588" fill="#101824"/><g font-family="Arial, sans-serif"><text x="168" y="23" fill="#dbe8f4" font-size="16" font-weight="700" text-anchor="middle"><tspan x="168" dy="0">Global visual batch</tspan></text><text x="168" y="45" fill="#93afc7" font-size="15" font-weight="400" text-anchor="middle"><tspan x="168" dy="0">Balance image / patch workload</tspan></text><path d="M168 55 V72" fill="none" stroke="#93afc7" stroke-width="2" marker-end="url(#arrow)"/><rect x="12" y="72" width="312" height="115" rx="7" fill="#172a3d" stroke="#6c8ba6"/><text x="168" y="146" fill="#dbe8f4" font-size="16" font-weight="400" text-anchor="middle"></text><text x="168" y="97" fill="#a8c9e8" font-size="14.5" font-weight="700" text-anchor="middle"><tspan x="168" dy="0">01  BALANCED VISION FORWARD</tspan></text><text x="168" y="123" fill="#dbe8f4" font-size="15" font-weight="400" text-anchor="middle"><tspan x="168" dy="0">Replicate ViT on GPUs</tspan><tspan x="168" dy="23">Keep final outputs; discard activations</tspan><tspan x="168" dy="23">Gather outputs → PP Stage-0</tspan></text><path d="M168 187 V209" fill="none" stroke="#93afc7" stroke-width="2" marker-end="url(#arrow)"/><rect x="12" y="209" width="312" height="115" rx="7" fill="#172a3d" stroke="#6c8ba6"/><text x="168" y="283" fill="#dbe8f4" font-size="16" font-weight="400" text-anchor="middle"></text><text x="168" y="234" fill="#a8c9e8" font-size="14.5" font-weight="700" text-anchor="middle"><tspan x="168" dy="0">02  BACKBONE TRAINING</tspan></text><text x="168" y="260" fill="#dbe8f4" font-size="15" font-weight="400" text-anchor="middle"><tspan x="168" dy="0">Forward + backward with text PP / EP</tspan><tspan x="168" dy="23">Gradients at visual encoder output</tspan><tspan x="168" dy="23">Return these gradients to ViT</tspan></text><path d="M168 324 V346" fill="none" stroke="#93afc7" stroke-width="2" marker-end="url(#arrow)"/><rect x="12" y="346" width="312" height="115" rx="7" fill="#172a3d" stroke="#6c8ba6"/><text x="168" y="420" fill="#dbe8f4" font-size="16" font-weight="400" text-anchor="middle"></text><text x="168" y="371" fill="#a8c9e8" font-size="14" font-weight="700" text-anchor="middle"><tspan x="168" dy="0">03  VISION RECOMPUTE + BACKWARD</tspan></text><text x="168" y="397" fill="#dbe8f4" font-size="15" font-weight="400" text-anchor="middle"><tspan x="168" dy="0">Recompute forward; run backward</tspan><tspan x="168" dy="23">Update ViT</tspan><tspan x="168" dy="23">Synchronize visual gradients</tspan></text><rect x="12" y="485" width="312" height="88" rx="7" fill="#1a2230" stroke="#6c8ba6"/><text x="168" y="545.5" fill="#dbe8f4" font-size="16" font-weight="400" text-anchor="middle"></text><text x="168" y="509" fill="#dbe8f4" font-size="15" font-weight="700" text-anchor="middle"><tspan x="168" dy="0">Less intermediate activation memory</tspan></text><text x="168" y="535" fill="#dbe8f4" font-size="15" font-weight="400" text-anchor="middle"><tspan x="168" dy="0">Cost: extra compute, output gather</tspan><tspan x="168" dy="23">and gradient synchronization</tspan></text></g></svg>