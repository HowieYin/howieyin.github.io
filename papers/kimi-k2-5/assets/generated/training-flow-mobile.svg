<svg xmlns="http://www.w3.org/2000/svg" width="336" height="606" viewBox="0 0 336 606" role="img" aria-labelledby="title desc"><title id="title">Shared training, then two learning branches</title><desc id="desc">K2 and the aligned MoonViT encoder enter joint pre-training, text-only SFT, and joint RL. Successful visual trajectories undergo rejection fine-tuning. PARL trains the orchestrator with frozen subagents to learn decomposition and aggregation. Both branches support the visual tool-using model.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#93afc7"/></marker></defs><rect width="336" height="606" fill="#101824"/><g font-family="Arial, sans-serif"><text x="12" y="23" fill="#93afc7" font-size="13" font-weight="700" text-anchor="start"><tspan x="12" dy="0">TRAINING FLOW</tspan></text><rect x="12" y="38" width="148" height="52" rx="7" fill="#172a3d" stroke="#6c8ba6"/><text x="86" y="58.5" fill="#dbe8f4" font-size="15.5" font-weight="400" text-anchor="middle"><tspan x="86" dy="0">K2 near-end</tspan><tspan x="86" dy="21">checkpoint</tspan></text><rect x="176" y="38" width="148" height="52" rx="7" fill="#172a3d" stroke="#6c8ba6"/><text x="250" y="58.5" fill="#dbe8f4" font-size="14" font-weight="400" text-anchor="middle"><tspan x="250" dy="0">Aligned MoonViT-3D</tspan><tspan x="250" dy="21">SigLIP / CE / projector</tspan></text><path d="M86 90 V101 H168 V114" fill="none" stroke="#93afc7" stroke-width="2" marker-end="url(#arrow)"/><path d="M250 90 V101 H168 V114" fill="none" stroke="#93afc7" stroke-width="2" marker-end="url(#arrow)"/><rect x="12" y="114" width="312" height="46" rx="7" fill="#172a3d" stroke="#6c8ba6"/><text x="168" y="142" fill="#dbe8f4" font-size="16" font-weight="400" text-anchor="middle"><tspan x="168" dy="0">Joint vision-text pre-training</tspan></text><path d="M168 160 V180" fill="none" stroke="#93afc7" stroke-width="2" marker-end="url(#arrow)"/><rect x="12" y="180" width="312" height="46" rx="7" fill="#172a3d" stroke="#6c8ba6"/><text x="168" y="208" fill="#dbe8f4" font-size="16" font-weight="400" text-anchor="middle"><tspan x="168" dy="0">Text-only SFT · reasoning + tools</tspan></text><path d="M168 226 V246" fill="none" stroke="#93afc7" stroke-width="2" marker-end="url(#arrow)"/><rect x="12" y="246" width="312" height="46" rx="7" fill="#172a3d" stroke="#6c8ba6"/><text x="168" y="274" fill="#dbe8f4" font-size="16" font-weight="400" text-anchor="middle"><tspan x="168" dy="0">Joint RL + GRM · text + vision</tspan></text><path d="M168 292 V330 H86 V346" fill="none" stroke="#93afc7" stroke-width="2" marker-end="url(#arrow)"/><path d="M168 330 H250 V346" fill="none" stroke="#93afc7" stroke-width="2" marker-end="url(#arrow)"/><rect x="12" y="346" width="148" height="66" rx="7" fill="#172a3d" stroke="#6c8ba6"/><text x="86" y="364" fill="#dbe8f4" font-size="15" font-weight="400" text-anchor="middle"><tspan x="86" dy="0">Successful visual</tspan><tspan x="86" dy="20">trajectories →</tspan><tspan x="86" dy="20">rejection fine-tuning</tspan></text><rect x="176" y="346" width="148" height="66" rx="7" fill="#172a3d" stroke="#6c8ba6"/><text x="250" y="372.5" fill="#dbe8f4" font-size="16" font-weight="400" text-anchor="middle"><tspan x="250" dy="0">PARL</tspan><tspan x="250" dy="23">Update orchestrator</tspan></text><rect x="12" y="439" width="148" height="66" rx="7" fill="#1a2230" stroke="#6c8ba6"/><text x="86" y="457" fill="#dbe8f4" font-size="15" font-weight="400" text-anchor="middle"><tspan x="86" dy="0">Frozen subagent</tspan><tspan x="86" dy="20">checkpoint</tspan><tspan x="86" dy="20">Weights fixed</tspan></text><rect x="176" y="439" width="148" height="66" rx="7" fill="#172a3d" stroke="#6c8ba6"/><text x="250" y="457" fill="#dbe8f4" font-size="15" font-weight="400" text-anchor="middle"><tspan x="250" dy="0">Learned division</tspan><tspan x="250" dy="20">Separate contexts</tspan><tspan x="250" dy="20">+ aggregation</tspan></text><path d="M250 412 V439" fill="none" stroke="#93afc7" stroke-width="2" marker-end="url(#arrow)"/><path d="M160 472 H168 V379 H176" fill="none" stroke="#93afc7" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/><rect x="12" y="545" width="312" height="44" rx="7" fill="#172a3d" stroke="#6c8ba6"/><text x="168" y="572" fill="#dbe8f4" font-size="16" font-weight="400" text-anchor="middle"><tspan x="168" dy="0">Visual tool-using model</tspan></text><path d="M86 412 V427 H4 V567 H12" fill="none" stroke="#93afc7" stroke-width="2" marker-end="url(#arrow)"/><path d="M250 505 V527 H168 V545" fill="none" stroke="#93afc7" stroke-width="2" marker-end="url(#arrow)"/></g></svg>