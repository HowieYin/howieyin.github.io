<svg xmlns="http://www.w3.org/2000/svg" width="800" height="530" viewBox="0 0 800 530" role="img" aria-labelledby="title desc"><title id="title">Shared training, then two learning branches</title><desc id="desc">K2 and the aligned MoonViT encoder enter joint pre-training, text-only SFT, and joint RL. Successful visual trajectories undergo rejection fine-tuning. PARL trains the orchestrator with frozen subagents to learn decomposition and aggregation. Both branches support the visual tool-using model.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#93afc7"/></marker></defs><rect width="800" height="530" fill="#101824"/><g font-family="Arial, sans-serif"><text x="16" y="27" fill="#93afc7" font-size="14" font-weight="700" text-anchor="start"><tspan x="16" dy="0">01  SHARED TRAINING</tspan></text><rect x="16" y="54" width="165" height="47" rx="7" fill="#172a3d" stroke="#6c8ba6"/><text x="98.5" y="72.5" fill="#dbe8f4" font-size="16" font-weight="400" text-anchor="middle"><tspan x="98.5" dy="0">K2 near-end</tspan><tspan x="98.5" dy="20">checkpoint</tspan></text><rect x="16" y="114" width="165" height="69" rx="7" fill="#172a3d" stroke="#6c8ba6"/><text x="98.5" y="133.5" fill="#dbe8f4" font-size="14" font-weight="400" text-anchor="middle"><tspan x="98.5" dy="0">SigLIP → MoonViT-3D</tspan><tspan x="98.5" dy="20">Caption CE +</tspan><tspan x="98.5" dy="20">projector alignment</tspan></text><rect x="220" y="86" width="160" height="70" rx="7" fill="#172a3d" stroke="#6c8ba6"/><text x="300" y="114.5" fill="#dbe8f4" font-size="16" font-weight="400" text-anchor="middle"><tspan x="300" dy="0">Joint vision-text</tspan><tspan x="300" dy="23">pre-training</tspan></text><rect x="420" y="86" width="160" height="70" rx="7" fill="#172a3d" stroke="#6c8ba6"/><text x="500" y="114.5" fill="#dbe8f4" font-size="16" font-weight="400" text-anchor="middle"><tspan x="500" dy="0">Text-only SFT</tspan><tspan x="500" dy="23">Reasoning + tools</tspan></text><rect x="620" y="86" width="164" height="70" rx="7" fill="#172a3d" stroke="#6c8ba6"/><text x="702" y="114.5" fill="#dbe8f4" font-size="16" font-weight="400" text-anchor="middle"><tspan x="702" dy="0">Joint outcome RL</tspan><tspan x="702" dy="23">Text + vision / GRM</tspan></text><path d="M181 78 H199 V121 H220" fill="none" stroke="#93afc7" stroke-width="2" marker-end="url(#arrow)"/><path d="M181 148 H199 V121 H220" fill="none" stroke="#93afc7" stroke-width="2" marker-end="url(#arrow)"/><path d="M380 121 H420" fill="none" stroke="#93afc7" stroke-width="2" marker-end="url(#arrow)"/><path d="M580 121 H620" fill="none" stroke="#93afc7" stroke-width="2" marker-end="url(#arrow)"/><text x="16" y="224" fill="#93afc7" font-size="14" font-weight="700" text-anchor="start"><tspan x="16" dy="0">02  LEARNING BRANCHES</tspan></text><path d="M702 156 V203 H255 V251" fill="none" stroke="#93afc7" stroke-width="2" marker-end="url(#arrow)"/><path d="M702 203 V251" fill="none" stroke="#93afc7" stroke-width="2" marker-end="url(#arrow)"/><rect x="100" y="251" width="310" height="74" rx="7" fill="#172a3d" stroke="#6c8ba6"/><text x="255" y="281.5" fill="#dbe8f4" font-size="16" font-weight="400" text-anchor="middle"><tspan x="255" dy="0">Successful visual trajectories</tspan><tspan x="255" dy="23">Rejection fine-tuning</tspan></text><rect x="460" y="251" width="310" height="74" rx="7" fill="#172a3d" stroke="#6c8ba6"/><text x="615" y="281.5" fill="#dbe8f4" font-size="16" font-weight="400" text-anchor="middle"><tspan x="615" dy="0">PARL</tspan><tspan x="615" dy="23">Update orchestrator</tspan></text><rect x="100" y="355" width="310" height="63" rx="7" fill="#1a2230" stroke="#6c8ba6"/><text x="255" y="380" fill="#dbe8f4" font-size="16" font-weight="400" text-anchor="middle"><tspan x="255" dy="0">Frozen subagent checkpoint</tspan><tspan x="255" dy="23">No subagent weight update</tspan></text><rect x="460" y="355" width="310" height="63" rx="7" fill="#172a3d" stroke="#6c8ba6"/><text x="615" y="380" fill="#dbe8f4" font-size="16" font-weight="400" text-anchor="middle"><tspan x="615" dy="0">Learned task decomposition</tspan><tspan x="615" dy="23">Independent contexts + aggregation</tspan></text><path d="M615 325 V355" fill="none" stroke="#93afc7" stroke-width="2" marker-end="url(#arrow)"/><path d="M410 386 H435 V288 H460" fill="none" stroke="#93afc7" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/><rect x="290" y="459" width="250" height="53" rx="7" fill="#172a3d" stroke="#6c8ba6"/><text x="415" y="490.5" fill="#dbe8f4" font-size="16" font-weight="400" text-anchor="middle"><tspan x="415" dy="0">Visual tool-using model</tspan></text><path d="M255 325 V340 H70 V485 H290" fill="none" stroke="#93afc7" stroke-width="2" marker-end="url(#arrow)"/><path d="M615 418 V485 H540" fill="none" stroke="#93afc7" stroke-width="2" marker-end="url(#arrow)"/><text x="16" y="526" fill="#93afc7" font-size="13" font-weight="400" text-anchor="start"><tspan x="16" dy="0">Dashed arrow: frozen checkpoint used by PARL</tspan></text></g></svg>