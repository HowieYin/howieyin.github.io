<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470" role="img" aria-labelledby="title desc"><title id="title">Decoupled Encoder Process · three stages</title><desc id="desc">Balance the global visual batch, run replicated ViT forward and keep only final outputs. Gather outputs to PP stage zero and train the backbone with text PP and EP. Return visual-output gradients, recompute the encoder forward, run backward and synchronize ViT gradients. Saving intermediate activation memory requires extra recomputation and communication.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#93afc7"/></marker></defs><rect width="800" height="470" fill="#101824"/><g font-family="Arial, sans-serif"><text x="400" y="29" fill="#dbe8f4" font-size="17" font-weight="700" text-anchor="middle"><tspan x="400" dy="0">Global visual batch · balance image / patch workload</tspan></text><path d="M136 39 V73" fill="none" stroke="#93afc7" stroke-width="2" marker-end="url(#arrow)"/><rect x="16" y="73" width="232" height="249" rx="7" fill="#172a3d" stroke="#6c8ba6"/><text x="132" y="214" fill="#dbe8f4" font-size="16" font-weight="400" text-anchor="middle"></text><text x="132" y="105" fill="#a8c9e8" font-size="15" font-weight="700" text-anchor="middle"><tspan x="132" dy="0">01  VISION FORWARD</tspan></text><text x="132" y="144" fill="#dbe8f4" font-size="16" font-weight="400" text-anchor="middle"><tspan x="132" dy="0">Replicate ViT on GPUs</tspan><tspan x="132" dy="23">Balanced forward</tspan></text><text x="132" y="206" fill="#dbe8f4" font-size="16" font-weight="400" text-anchor="middle"><tspan x="132" dy="0">Keep final outputs</tspan><tspan x="132" dy="23">Discard intermediate</tspan><tspan x="132" dy="23">activations</tspan></text><text x="132" y="292" fill="#a8c9e8" font-size="15" font-weight="400" text-anchor="middle"><tspan x="132" dy="0">Gather outputs → PP Stage-0</tspan></text><rect x="284" y="73" width="232" height="249" rx="7" fill="#172a3d" stroke="#6c8ba6"/><text x="400" y="214" fill="#dbe8f4" font-size="16" font-weight="400" text-anchor="middle"></text><text x="400" y="105" fill="#a8c9e8" font-size="15" font-weight="700" text-anchor="middle"><tspan x="400" dy="0">02  BACKBONE</tspan></text><text x="400" y="158" fill="#dbe8f4" font-size="16" font-weight="400" text-anchor="middle"><tspan x="400" dy="0">Forward + backward</tspan><tspan x="400" dy="23">Text pipeline parallelism</tspan><tspan x="400" dy="23">and expert parallelism</tspan></text><text x="400" y="267" fill="#a8c9e8" font-size="16" font-weight="400" text-anchor="middle"><tspan x="400" dy="0">Visual-output gradients</tspan><tspan x="400" dy="23">Return to ViT</tspan></text><rect x="552" y="73" width="232" height="249" rx="7" fill="#172a3d" stroke="#6c8ba6"/><text x="668" y="214" fill="#dbe8f4" font-size="16" font-weight="400" text-anchor="middle"></text><text x="668" y="105" fill="#a8c9e8" font-size="15" font-weight="700" text-anchor="middle"><tspan x="668" dy="0">03  VISION BACKWARD</tspan></text><text x="668" y="155" fill="#dbe8f4" font-size="16" font-weight="400" text-anchor="middle"><tspan x="668" dy="0">Recompute forward</tspan><tspan x="668" dy="23">Encoder backward</tspan><tspan x="668" dy="23">Update ViT</tspan></text><text x="668" y="268" fill="#a8c9e8" font-size="16" font-weight="400" text-anchor="middle"><tspan x="668" dy="0">Synchronize</tspan><tspan x="668" dy="23">visual gradients</tspan></text><path d="M248 197 H284" fill="none" stroke="#93afc7" stroke-width="2" marker-end="url(#arrow)"/><path d="M516 197 H552" fill="none" stroke="#93afc7" stroke-width="2" marker-end="url(#arrow)"/><text x="16" y="366" fill="#93afc7" font-size="14" font-weight="700" text-anchor="start"><tspan x="16" dy="0">MEMORY / COMPUTE TRADE-OFF</tspan></text><rect x="16" y="384" width="768" height="69" rx="7" fill="#1a2230" stroke="#6c8ba6"/><text x="400" y="412" fill="#dbe8f4" font-size="16" font-weight="400" text-anchor="middle"><tspan x="400" dy="0">Less intermediate activation memory</tspan><tspan x="400" dy="23">Extra forward compute + output gather + gradient synchronization</tspan></text></g></svg>