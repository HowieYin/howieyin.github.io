<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-label="去噪训练与逐 token 推理的链路重建"><style>text{font:14px sans-serif;fill:#d5e1f3}.small{font-size:12px;fill:#9fb1c9}.box{fill:#182335;stroke:#49617f}.gate{stroke:#90b8f4}.up{stroke:#d9b779}.line{fill:none;stroke:#8eafdf;stroke-width:1.5}</style><rect class="box " x="40" y="15" width="700" height="65" rx="6"/><text x="56" y="41">Corrupt C4 spans → encoder</text><text class="small" x="56" y="64">Input [B,512] → encoder states [B,512,D]</text><path class="line" d="M390 80v30m-5 -6l5 6 5 -6"/><rect class="box " x="40" y="110" width="700" height="65" rx="6"/><text x="56" y="136">Teacher forcing → causal decoder</text><text class="small" x="56" y="159">Target [B,114] + cross-attention → FFN gated projections</text><path class="line" d="M390 175v30m-5 -6l5 6 5 -6"/><rect class="box " x="40" y="205" width="700" height="65" rx="6"/><text x="56" y="231">Vocabulary logits → cross-entropy</text><text class="small" x="56" y="254">Predict missing spans; backpropagate through both branches</text><path class="line" d="M390 270v30m-5 -6l5 6 5 -6"/><rect class="box " x="40" y="300" width="700" height="65" rx="6"/><text x="56" y="326">Inference: encoder once, decoder per token</text><text class="small" x="56" y="349">FFN recomputes current token; attention KV reused</text></svg>