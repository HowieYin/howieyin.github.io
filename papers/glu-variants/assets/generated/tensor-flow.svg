<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 465" role="img" aria-label="门控 FFN 的两路投影、相乘和输出 shape"><style>text{font:14px sans-serif;fill:#d5e1f3}.small{font-size:12px;fill:#9fb1c9}.box{fill:#182335;stroke:#49617f}.gate{stroke:#90b8f4}.up{stroke:#d9b779}.line{fill:none;stroke:#8eafdf;stroke-width:1.5}</style><rect class="box " x="230" y="10" width="320" height="65" rx="6"/><text x="246" y="36">X: M × D</text><text class="small" x="246" y="59">M=BS; same input for both branches</text><path class="line" d="M390 75V95H195V115M390 95H585V115"/><rect class="box gate" x="45" y="115" width="300" height="65" rx="6"/><text x="61" y="141">Gate: A=XW → f(A)</text><text class="small" x="61" y="164">W: D × H; A/f(A): M × H</text><rect class="box up" x="435" y="115" width="300" height="65" rx="6"/><text x="451" y="141">Up: U=XV</text><text class="small" x="451" y="164">V: D × H; U: M × H</text><path class="line" d="M195 180V215H390V235M585 180V215H390"/><circle class="box" cx="390" cy="253" r="18"/><text x="384" y="258">×</text><path class="line" d="M390 271V290"/><rect class="box " x="230" y="290" width="320" height="65" rx="6"/><text x="246" y="316">Z=f(A) ⊙ U: M × H</text><text class="small" x="246" y="339">Elementwise; no token-to-token pairing</text><path class="line" d="M390 355V380"/><rect class="box " x="230" y="380" width="320" height="65" rx="6"/><text x="246" y="406">Y=ZW₂: M × D</text><text class="small" x="246" y="429">W₂: H × D; reconnect residual stream</text></svg>