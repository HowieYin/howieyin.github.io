<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" role="img" aria-label="路由打分、分发、专家计算、合并与主干输出"><style>text{font-family:system-ui,sans-serif;fill:#dbe6f5;font-size:14px}.small{font-size:12px;fill:#9fb1c9}.box{fill:#182335;stroke:#4b617e;stroke-width:1.3}.wire{fill:none;stroke:#8dadd9;stroke-width:1.6}.chosen{fill:#243c5b;stroke:#a9c9f3}</style><rect x="230" y="12" width="300" height="62" rx="6" class="box"/><text x="242" y="36">输入 X：N×d</text><text x="242" y="58" class="small">LSTM 已产生的 token 表示</text><path class="wire" d="M380 74V87.0H380V100m-4 -6l4 6 4 -6"/><rect x="165" y="100" width="430" height="62" rx="6" class="box"/><text x="177" y="124">Router：clean + noise → Top-K → softmax</text><text x="177" y="146" class="small">N×n 候选 → N×k 索引 / 非零权重</text><path class="wire" d="M380 162V176.0H380V190m-4 -6l4 6 4 -6"/><rect x="165" y="190" width="430" height="62" rx="6" class="box"/><text x="177" y="214">Pack / dispatch：按专家聚合</text><text x="177" y="236" class="small">保留原 token 索引与 gate；跨设备输入</text><path class="wire" d="M380 252V271.0H135V290m-4 -6l4 6 4 -6"/><rect x="35" y="290" width="200" height="70" rx="6" class="box"/><text x="47" y="314">Expert 0：Nᵢ×d</text><text x="47" y="336" class="small">GEMM → ReLU → GEMM</text><path class="wire" d="M380 252V271.0H380V290m-4 -6l4 6 4 -6"/><rect x="280" y="290" width="200" height="70" rx="6" class="box"/><text x="292" y="314">Expert 1：Nᵢ×d</text><text x="292" y="336" class="small">GEMM → ReLU → GEMM</text><path class="wire" d="M380 252V271.0H625V290m-4 -6l4 6 4 -6"/><rect x="525" y="290" width="200" height="70" rx="6" class="box"/><text x="537" y="314">Expert 2：Nᵢ×d</text><text x="537" y="336" class="small">GEMM → ReLU → GEMM</text><text x="48" y="398" class="small">Nᵢ 不均 → 最热专家 / 通信尾部决定等待</text><path class="wire" d="M135 360V386.0H380V412m-4 -6l4 6 4 -6"/><path class="wire" d="M380 360V386.0H380V412m-4 -6l4 6 4 -6"/><path class="wire" d="M625 360V386.0H380V412m-4 -6l4 6 4 -6"/><rect x="165" y="412" width="430" height="62" rx="6" class="box"/><text x="177" y="436">Combine：返回 → 加权 scatter-add</text><text x="177" y="458" class="small">恢复 N×d_out；权重对应原 route</text><path class="wire" d="M380 474V489.5H380V505m-4 -6l4 6 4 -6"/><rect x="165" y="505" width="430" height="62" rx="6" class="box"/><text x="177" y="529">sigmoid / residual → 上层 LSTM / loss</text><text x="177" y="551" class="small">Backward 反向通过数据移动与专家参数</text></svg>