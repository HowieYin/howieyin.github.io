<figcaption class="ltx_caption ltx_centering"><span class="ltx_tag ltx_tag_table">Table 15: </span>
<strong class="ltx_text ltx_font_bold">Carbon footprint of training different models in the same data center.</strong>
We follow <cite class="ltx_cite ltx_citemacro_citet">Wu et al. (2022)</cite> to compute carbon emission of training OPT, BLOOM and our models in the same data center. For the power consumption of a A100-80GB, we take the thermal design power for NVLink systems, that is 400W. We take a PUE of 1.1 and a carbon intensity factor set at the national US average of 0.385 kg CO<sub class="ltx_sub">2</sub>e per KWh.
