</table></div><figcaption><span class="ltx_tag ltx_tag_table"><span class="ltx_text">Table 21</span>: </span><span class="ltx_text"> <span class="ltx_text ltx_font_bold">Long-context benchmarks.</span> For ZeroSCROLLS <cite class="ltx_cite ltx_citemacro_citep">(<a class="ltx_ref" href="https://arxiv.org/html/2407.21783v3#bib.bib199" title="">Shaham et al., 2023</a>)</cite>, we report numbers on the validation set. For QuALITY we report exact match, for Qasper - f1 and for SQuALITY - rougeL. We report f1 for InfiniteBench <cite class="ltx_cite ltx_citemacro_citep">(<a class="ltx_ref" href="https://arxiv.org/html/2407.21783v3#bib.bib265" title="">Zhang et al., 2024</a>)</cite> En.QA metric and accuracy for En.MC. For Multi-needle  <cite class="ltx_cite ltx_citemacro_citep">(<a class="ltx_ref" href="https://arxiv.org/html/2407.21783v3#bib.bib90" title="">Kamradt, 2023</a>)</cite> we insert 4 needles in the context and test if a model can retrieve 2 needles at different context lengths, we compute average recall across 10 sequence lengths up till 128k.</span></figcaption></figure>
