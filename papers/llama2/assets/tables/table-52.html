Limitations</span> (Section <a class="ltx_ref" href="https://arxiv.org/html/2307.09288v2#S5.SS2" title="5.2 Limitations and Ethical Considerations ‣ 5 Discussion ‣ Llama 2: Open Foundation and Fine-Tuned Chat Models"><span class="ltx_text ltx_ref_tag">5.2</span></a>)</td></tr>
<tr class="ltx_tr" id="A1.T52.2.1.23">
<td class="ltx_td ltx_align_left ltx_align_top ltx_border_b ltx_border_t" colspan="2" id="A1.T52.2.1.23.1" style="padding-top:1.75pt;padding-bottom:1.75pt;">
<span class="ltx_inline-block ltx_align_top" id="A1.T52.2.1.23.1.1" style="width:426.8pt;">
<span class="ltx_p" id="A1.T52.2.1.23.1.1.1"><span class="ltx_text ltx_font_smallcaps" id="A1.T52.2.1.23.1.1.1.1">Llama 2</span> is a new technology that carries risks with use. Testing conducted to date has been in English, and has not covered, nor could it cover all scenarios. For these reasons, as with all LLMs, <span class="ltx_text ltx_font_smallcaps" id="A1.T52.2.1.23.1.1.1.2">Llama 2</span>’s potential outputs cannot be predicted in advance, and the model may in some instances produce inaccurate or objectionable responses to user prompts. Therefore, before deploying any applications of <span class="ltx_text ltx_font_smallcaps" id="A1.T52.2.1.23.1.1.1.3">Llama 2</span>, developers should perform safety testing and tuning tailored to their specific applications of the model.
Please see the Responsible Use Guide available available at <a class="ltx_ref ltx_url ltx_font_typewriter" href="https://ai.meta.com/llama/responsible-user-guide" title="">https://ai.meta.com/llama/responsible-user-guide</a></span>
</span></td></tr>
