<figcaption class="ltx_caption ltx_centering"><span class="ltx_tag ltx_tag_table">Table 6: </span><span class="ltx_text ltx_font_bold" id="S3.T6.4">Statistics of human preference data for reward modeling.</span> We list both the open-source and internally collected human preference data used for reward modeling. Note that a binary human preference comparison contains 2 responses (chosen and rejected) sharing the same prompt (and previous dialogue). Each example consists of a prompt (including previous dialogue if available) and a response, which is the input of the reward model. We report the number of comparisons, the average number of turns per dialogue, the average number of tokens per example, per prompt and per response. More details on Meta helpfulness and safety data per batch can be found in Appendix <a class="ltx_ref" href="https://arxiv.org/html/2307.09288v2#A1.SS3.SSS1" title="A.3.1 Detailed Statistics of Meta Human Preference Data ‣ A.3 Additional Details for Fine-tuning ‣ Appendix A Appendix ‣ Llama 2: Open Foundation and Fine-Tuned Chat Models"><span class="ltx_text ltx_ref_tag">A.3.1</span></a>.
