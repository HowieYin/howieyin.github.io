<svg xmlns="http://www.w3.org/2000/svg" width="724" height="416" viewBox="0 0 724 416" role="img" aria-labelledby="feedback-title feedback-desc"><title id="feedback-title">Llama 2 training feedback loop</title><desc id="feedback-desc">Public-source pretraining and SFT initialize policies. Fresh preference pairs train separate reward models, followed by best-of-K, distillation and later PPO. Policy candidates and preferences are refreshed.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#9cb7d0"/></marker><marker id="context" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#94b8a8"/></marker></defs><rect width="724" height="416" fill="#101824"/><path d="M228 72H260" fill="none" stroke="#9cb7d0" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M464 72H496" fill="none" stroke="#9cb7d0" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M598 110V142H126V170" fill="none" stroke="#9cb7d0" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M228 208H260" fill="none" stroke="#9cb7d0" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M464 208H496" fill="none" stroke="#9cb7d0" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M598 246V306" fill="none" stroke="#9cb7d0" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M496 344H464" fill="none" stroke="#9cb7d0" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M260 344H228" fill="none" stroke="#9cb7d0" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M24 344H10V208H24" fill="none" stroke="#9cb7d0" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M362 246V280H126V246" fill="none" stroke="#94b8a8" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#context)"/><g data-node="A"><rect x="24" y="34" width="204" height="76" rx="5" fill="#192b3e" stroke="#6d8ca9"/><text x="126" y="62" text-anchor="middle" dominant-baseline="middle" fill="#e0eaf4" font-family="Arial,sans-serif" font-size="14"><tspan x="126" y="62">Public-source corpus</tspan><tspan x="126" y="82">2T training tokens</tspan></text></g><g data-node="B"><rect x="260" y="34" width="204" height="76" rx="5" fill="#192b3e" stroke="#6d8ca9"/><text x="362" y="62" text-anchor="middle" dominant-baseline="middle" fill="#e0eaf4" font-family="Arial,sans-serif" font-size="14"><tspan x="362" y="62">Dense base checkpoints</tspan><tspan x="362" y="82">7B · 13B · 34B · 70B</tspan></text></g><g data-node="C"><rect x="496" y="34" width="204" height="76" rx="5" fill="#192b3e" stroke="#6d8ca9"/><text x="598" y="62" text-anchor="middle" dominant-baseline="middle" fill="#e0eaf4" font-family="Arial,sans-serif" font-size="14"><tspan x="598" y="62">High-quality SFT</tspan><tspan x="598" y="82">27,540 examples</tspan></text></g><g data-node="D"><rect x="24" y="170" width="204" height="76" rx="5" fill="#192b3e" stroke="#6d8ca9"/><text x="126" y="198" text-anchor="middle" dominant-baseline="middle" fill="#e0eaf4" font-family="Arial,sans-serif" font-size="14"><tspan x="126" y="198">Current policy candidates</tspan><tspan x="126" y="218">Generate varied answers</tspan></text></g><g data-node="E"><rect x="260" y="170" width="204" height="76" rx="5" fill="#192b3e" stroke="#6d8ca9"/><text x="362" y="198" text-anchor="middle" dominant-baseline="middle" fill="#e0eaf4" font-family="Arial,sans-serif" font-size="14"><tspan x="362" y="198">Fresh human preferences</tspan><tspan x="362" y="218">Over 1M comparison pairs</tspan></text></g><g data-node="F"><rect x="496" y="170" width="204" height="76" rx="5" fill="#192b3e" stroke="#6d8ca9"/><text x="598" y="198" text-anchor="middle" dominant-baseline="middle" fill="#e0eaf4" font-family="Arial,sans-serif" font-size="14"><tspan x="598" y="198">Helpful RM + Safety RM</tspan><tspan x="598" y="218">Separate reward models</tspan></text></g><g data-node="I"><rect x="24" y="306" width="204" height="76" rx="5" fill="#192b3e" stroke="#6d8ca9"/><text x="126" y="334" text-anchor="middle" dominant-baseline="middle" fill="#e0eaf4" font-family="Arial,sans-serif" font-size="14"><tspan x="126" y="334">Later-stage PPO</tspan><tspan x="126" y="354">KL to reference policy</tspan></text></g><g data-node="H"><rect x="260" y="306" width="204" height="76" rx="5" fill="#192b3e" stroke="#6d8ca9"/><text x="362" y="334" text-anchor="middle" dominant-baseline="middle" fill="#e0eaf4" font-family="Arial,sans-serif" font-size="14"><tspan x="362" y="334">Selected-answer distillation</tspan><tspan x="362" y="354">Train base / chat policies</tspan></text></g><g data-node="G"><rect x="496" y="306" width="204" height="76" rx="5" fill="#192b3e" stroke="#6d8ca9"/><text x="598" y="334" text-anchor="middle" dominant-baseline="middle" fill="#e0eaf4" font-family="Arial,sans-serif" font-size="14"><tspan x="598" y="334">70B best-of-K selection</tspan><tspan x="598" y="354">RM selects a candidate</tspan></text></g><text x="362" y="133" text-anchor="middle" fill="#acbed1" font-family="Arial,sans-serif" font-size="12">Initialize policy, then iterate feedback</text><text x="244" y="271" text-anchor="middle" fill="#94b8a8" font-family="Arial,sans-serif" font-size="11">Refresh candidate distribution</text></svg>
