<svg xmlns="http://www.w3.org/2000/svg" width="724" height="424" viewBox="0 0 724 424" role="img" aria-labelledby="gatt-title gatt-desc"><title id="gatt-title">Ghost Attention training masks</title><desc id="gatt-desc">Teacher repeats instructions. Student keeps instructions only at the first turn. Earlier user and assistant messages stay visible in causal attention with loss mask zero; only the final assistant answer has loss mask one.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#9cb7d0"/></marker><marker id="context" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#94b8a8"/></marker></defs><rect width="724" height="424" fill="#101824"/><path d="M228 70H260" fill="none" stroke="#9cb7d0" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M464 70H496" fill="none" stroke="#9cb7d0" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M598 108V148H224V188" fill="none" stroke="#9cb7d0" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M598 148H500V188" fill="none" stroke="#9cb7d0" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M326 226H398" fill="none" stroke="#94b8a8" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#context)"/><path d="M500 264V326" fill="none" stroke="#9cb7d0" stroke-width="1.8" marker-end="url(#arrow)"/><g data-node="T"><rect x="24" y="32" width="204" height="76" rx="5" fill="#192b3e" stroke="#6d8ca9"/><text x="126" y="60" text-anchor="middle" dominant-baseline="middle" fill="#e0eaf4" font-family="Arial,sans-serif" font-size="14"><tspan x="126" y="60">Teacher generation</tspan><tspan x="126" y="80">Instruction at every turn</tspan></text></g><g data-node="G"><rect x="260" y="32" width="204" height="76" rx="5" fill="#192b3e" stroke="#6d8ca9"/><text x="362" y="60" text-anchor="middle" dominant-baseline="middle" fill="#e0eaf4" font-family="Arial,sans-serif" font-size="14"><tspan x="362" y="60">Consistent answers</tspan><tspan x="362" y="80">Generated conversation</tspan></text></g><g data-node="S"><rect x="496" y="32" width="204" height="76" rx="5" fill="#192b3e" stroke="#6d8ca9"/><text x="598" y="60" text-anchor="middle" dominant-baseline="middle" fill="#e0eaf4" font-family="Arial,sans-serif" font-size="14"><tspan x="598" y="60">Student input</tspan><tspan x="598" y="80">Instruction only at turn 1</tspan></text></g><g data-node="P"><rect x="122" y="188" width="204" height="76" rx="5" fill="#192b3e" stroke="#6d8ca9"/><text x="224" y="206" text-anchor="middle" dominant-baseline="middle" fill="#e0eaf4" font-family="Arial,sans-serif" font-size="14"><tspan x="224" y="206">Earlier user + assistant</tspan><tspan x="224" y="226">Loss mask = 0</tspan><tspan x="224" y="246">Still in causal context</tspan></text></g><g data-node="A"><rect x="398" y="188" width="204" height="76" rx="5" fill="#1d3733" stroke="#6d8ca9"/><text x="500" y="206" text-anchor="middle" dominant-baseline="middle" fill="#e0eaf4" font-family="Arial,sans-serif" font-size="14"><tspan x="500" y="206">Final assistant answer</tspan><tspan x="500" y="226">Loss mask = 1</tspan><tspan x="500" y="246">Prediction target</tspan></text></g><g data-node="W"><rect x="398" y="326" width="204" height="76" rx="5" fill="#1d3733" stroke="#6d8ca9"/><text x="500" y="354" text-anchor="middle" dominant-baseline="middle" fill="#e0eaf4" font-family="Arial,sans-serif" font-size="14"><tspan x="500" y="354">Train weights to retain</tspan><tspan x="500" y="374">First-turn attributes</tspan></text></g><text x="362" y="214" text-anchor="middle" fill="#94b8a8" font-family="Arial,sans-serif" font-size="11">context</text><text x="224" y="352" text-anchor="middle" fill="#acbed1" font-family="Arial,sans-serif" font-size="13"><tspan x="224">Loss mask does not</tspan><tspan x="224" dy="20">remove history attention.</tspan></text></svg>
