<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 473" role="img" aria-label="单层运行时的数据与成本"><title>单层运行时的数据与成本</title><rect width="780" height="473" fill="#101823" rx="8"/><text x="28" y="30" fill="#d5e1f3" font-size="15" font-family="sans-serif">单层运行时的数据与成本</text><circle cx="40" cy="85" r="14" fill="#244262" stroke="#85aad8"/><text x="40" y="90" text-anchor="middle" fill="#d4e6ff" font-size="13">1</text><path d="M40 100v57m-5 -6l5 6 5 -6" fill="none" stroke="#85aad8"/><text x="68" y="70" fill="#e2bc7c" font-size="12">从内存读</text><text x="68" y="95" fill="#d5e1f3" font-size="15">packed INT4 tile</text><text x="68" y="119" fill="#a6b8d0" font-size="13">scale / scaled zero metadata</text><line x1="68" y1="138" x2="752" y2="138" stroke="#2a3a50"/><circle cx="40" cy="187" r="14" fill="#244262" stroke="#85aad8"/><text x="40" y="192" text-anchor="middle" fill="#d4e6ff" font-size="13">2</text><path d="M40 202v57m-5 -6l5 6 5 -6" fill="none" stroke="#85aad8"/><text x="68" y="172" fill="#e2bc7c" font-size="12">寄存器中还原</text><text x="68" y="197" fill="#d5e1f3" font-size="15">AND / SHIFT → convert</text><text x="68" y="221" fill="#a6b8d0" font-size="13">scale / zero；不写完整 FP16 W 回 DRAM</text><line x1="68" y1="240" x2="752" y2="240" stroke="#2a3a50"/><circle cx="40" cy="289" r="14" fill="#244262" stroke="#85aad8"/><text x="40" y="294" text-anchor="middle" fill="#d4e6ff" font-size="13">3</text><path d="M40 304v57m-5 -6l5 6 5 -6" fill="none" stroke="#85aad8"/><text x="68" y="274" fill="#e2bc7c" font-size="12">计算与输出</text><text x="68" y="299" fill="#d5e1f3" font-size="15">FP16/BF16 activation</text><text x="68" y="323" fill="#a6b8d0" font-size="13">FMA/MMA → output；累加精度另定</text><line x1="68" y1="342" x2="752" y2="342" stroke="#2a3a50"/><circle cx="40" cy="391" r="14" fill="#244262" stroke="#85aad8"/><text x="40" y="396" text-anchor="middle" fill="#d4e6ff" font-size="13">4</text><text x="68" y="376" fill="#e2bc7c" font-size="12">系统路径</text><text x="68" y="401" fill="#d5e1f3" font-size="15">Norm / QKV / position fusion</text><text x="68" y="425" fill="#a6b8d0" font-size="13">attention + KV update → next layer</text><line x1="68" y1="444" x2="752" y2="444" stroke="#2a3a50"/></svg>