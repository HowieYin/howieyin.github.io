<figcaption class="ltx_caption ltx_centering"><span class="ltx_tag ltx_tag_figure">Figure 1: </span>We introduce <span class="ltx_text ltx_font_bold" id="S1.F1.6">AWQ</span>, a versatile weight quantization method for LLM. To implement AWQ, we developed <span class="ltx_text ltx_font_bold" id="S1.F1.7">TinyChat</span> to deploy 4-bit quantized LLMs into various edge platforms, achieving a <span class="ltx_text ltx_font_bold" id="S1.F1.8">3-4<math alttext="\times" class="ltx_Math" display="inline" id="S1.F1.m2" intent=":literal"><semantics><mo>×</mo><annotation encoding="application/x-tex">\times</annotation></semantics></math></span> performance boost compared to FP16. Notably, we’ve also manufactured a <span class="ltx_text ltx_font_bold" id="S1.F1.9">TinyChat computer</span>, powered by TinyChat, which contains an NVIDIA Jetson Orin Nano with only 8GB of memory and 15W power consumption. Demo: <a class="ltx_ref ltx_url ltx_font_typewriter" href="https://youtu.be/z91a8DrfgEw" title="">https://youtu.be/z91a8DrfgEw</a>.</figcaption>
