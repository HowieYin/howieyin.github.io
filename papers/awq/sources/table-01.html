<figcaption class="ltx_caption ltx_centering"><span class="ltx_tag ltx_tag_table">Table 1: </span>Keeping a small fraction of weights (0.1%-1%) in FP16 significantly improves the performance of the quantized models over round-to-nearest (RTN). It is only effective when we select the important weights in FP16 by looking at <em class="ltx_emph ltx_font_italic" id="S3.T1.6">activation</em> distribution instead of <em class="ltx_emph ltx_font_italic" id="S3.T1.7">weight</em> distribution. We highlight results with a decent perplexity in <span class="ltx_text" id="S3.T1.8" style="--ltx-fg-color:#009900;">green</span>.
We used INT3 quantization with a group size of 128 and measured the WikiText perplexity (<math alttext="\downarrow" class="ltx_Math" display="inline" id="S3.T1.m3" intent=":literal"><semantics><mo stretchy="false">↓</mo><annotation encoding="application/x-tex">\downarrow</annotation></semantics></math>).
</figcaption>
