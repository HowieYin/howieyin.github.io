<figcaption class="ltx_caption ltx_centering"><span class="ltx_tag ltx_tag_figure">Figure 10: </span>TinyChat offers <span class="ltx_text ltx_font_bold" id="S5.F10.4">1.2-3.0<math alttext="\times" class="ltx_Math" display="inline" id="S5.F10.m3" intent=":literal"><semantics><mo>×</mo><annotation encoding="application/x-tex">\times</annotation></semantics></math></span> speedup over existing systems when running 4-bit quantized Llama models on NVIDIA Jetson Orin. It also supports a diverse range of general-purpose and coding-specific LLMs with at least <span class="ltx_text ltx_font_bold" id="S5.F10.5">2.6<math alttext="\times" class="ltx_Math" display="inline" id="S5.F10.m4" intent=":literal"><semantics><mo>×</mo><annotation encoding="application/x-tex">\times</annotation></semantics></math></span> speedup over AutoGPTQ, which also supports all these workloads. Moreover, TinyChat seamlessly operates on Raspberry Pi and enables the deployment of LLMs with up to 7 billion parameters on extremely resource-constrained IoT devices.</figcaption>
