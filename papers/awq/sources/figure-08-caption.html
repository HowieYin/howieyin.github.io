<figcaption class="ltx_caption ltx_centering"><span class="ltx_tag ltx_tag_figure">Figure 8: </span><span class="ltx_text ltx_font_bold" id="S5.F8.4">Left:</span> AWQ needs a much smaller calibration set to reach a good quantized performance. It can achieve better perplexity using 10<math alttext="\times" class="ltx_Math" display="inline" id="S5.F8.m2" intent=":literal"><semantics><mo>×</mo><annotation encoding="application/x-tex">\times</annotation></semantics></math> smaller calibration set compared to GPTQ. <span class="ltx_text ltx_font_bold" id="S5.F8.5">Right:</span> Our method is more robust to the calibration set distribution. Overall, using the same calibration and evaluation distribution works the best (PubMed-PubMed, Enron-Enron). But when using a different calibration distribution (PubMed-Enron, Enron-PubMed), AWQ only increases the perplexity by 0.5-0.6, while GPTQ has 2.3-4.9 worse perplexity. All experiments are done with the OPT-6.7B model under INT3-g128 quantization.</figcaption>
