<figcaption class="ltx_caption ltx_centering"><span class="ltx_tag ltx_tag_figure">Figure 9: </span>TinyChat provides a turn-key solution to transform the theoretical memory footprint reduction into a quantifiable speedup. As a result, TinyChat is up to <span class="ltx_text ltx_font_bold" id="S5.F9.4">3.9<math alttext="\times" class="ltx_Math" display="inline" id="S5.F9.m3" intent=":literal"><semantics><mo>×</mo><annotation encoding="application/x-tex">\times</annotation></semantics></math></span> and <span class="ltx_text ltx_font_bold" id="S5.F9.5">3.5<math alttext="\times" class="ltx_Math" display="inline" id="S5.F9.m4" intent=":literal"><semantics><mo>×</mo><annotation encoding="application/x-tex">\times</annotation></semantics></math></span> faster than the FP16 implementation from Huggingface on 4090 (desktop GPU) and Orin (mobile GPU), respectively. AWQ also democratizes Llama-2-13B deployment on laptop GPUs (4070) with merely 8GB memory.</figcaption>
