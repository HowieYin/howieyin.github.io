<figcaption class="ltx_caption ltx_centering"><span class="ltx_tag ltx_tag_table">Table 2: </span>Statistics when multiplying the 1% salient channels by <math alttext="s&gt;1" class="ltx_Math" display="inline" id="S3.T2.m14" intent=":literal"><semantics><mrow><mi>s</mi><mo>&gt;</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">s&gt;1</annotation></semantics></math>. Scaling up the salient channels significantly improves the perplexity (23.54 to 11.92). As <math alttext="s" class="ltx_Math" display="inline" id="S3.T2.m15" intent=":literal"><semantics><mi>s</mi><annotation encoding="application/x-tex">s</annotation></semantics></math> goes larger, the percentage of changed <math alttext="\Delta" class="ltx_Math" display="inline" id="S3.T2.m16" intent=":literal"><semantics><mi mathvariant="normal">Δ</mi><annotation encoding="application/x-tex">\Delta</annotation></semantics></math> increases, and the error reduction rate for salient channels also increases. However, the best perplexity is achieved at <math alttext="s=2" class="ltx_Math" display="inline" id="S3.T2.m17" intent=":literal"><semantics><mrow><mi>s</mi><mo>=</mo><mn>2</mn></mrow><annotation encoding="application/x-tex">s=2</annotation></semantics></math>, since further increasing <math alttext="s" class="ltx_Math" display="inline" id="S3.T2.m18" intent=":literal"><semantics><mi>s</mi><annotation encoding="application/x-tex">s</annotation></semantics></math> will increase the quantization error for <em class="ltx_emph ltx_font_italic" id="S3.T2.4">non-salient</em> channels.
</figcaption>
