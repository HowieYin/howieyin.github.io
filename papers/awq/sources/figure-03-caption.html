<figcaption class="ltx_caption ltx_centering"><span class="ltx_tag ltx_tag_figure">Figure 3: </span>Bottleneck analysis for Llama-2-7B on NVIDIA RTX 4090. <span class="ltx_text ltx_font_bold" id="S3.F3.5">Left</span>: In on-device LLM applications, generation stage is much slower than the context stage. <span class="ltx_text ltx_font_bold" id="S3.F3.6">Middle</span>: The generation stage is memory bound and has low arithmetic intensity. W4A16 quantization can effectively improve the arithmetic intensity by 4<math alttext="\times" class="ltx_Math" display="inline" id="S3.F3.m2" intent=":literal"><semantics><mo>×</mo><annotation encoding="application/x-tex">\times</annotation></semantics></math>. <span class="ltx_text ltx_font_bold" id="S3.F3.7">Right</span>: The amount of weight access is orders of magnitude larger than the amount of activation access. Thus, weight-only quantization is more effective for on-device LLMs.</figcaption>
