<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-label="pipeline：模型训练统计流程、成本或技术演进"><rect x="25" y="12" width="750" height="72" rx="6" fill="#182335" stroke="#49617f"/><circle cx="47" cy="39" r="4" fill="#8fc7b7"/><text x="62" y="43" fill="#d5e1f3" font-family="sans-serif" font-size="16">模型与资源输入</text><text x="62" y="67" fill="#9fb1c9" font-family="sans-serif" font-size="13">shape / unique D / optimizer / batch / schedule</text><path d="M400 84v28m-5 -6l5 6 5 -6" fill="none" stroke="#8eafdf"/><rect x="25" y="112" width="750" height="72" rx="6" fill="#182335" stroke="#49617f"/><circle cx="47" cy="139" r="4" fill="#8fc7b7"/><text x="62" y="143" fill="#d5e1f3" font-family="sans-serif" font-size="16">自回归训练与checkpoint</text><text x="62" y="167" fill="#9fb1c9" font-family="sans-serif" font-size="13">IDs [b,t] → hidden [b,t,d] → logits [b,t,V] → scalar loss</text><path d="M400 184v28m-5 -6l5 6 5 -6" fill="none" stroke="#8eafdf"/><rect x="25" y="212" width="750" height="72" rx="6" fill="#182335" stroke="#49617f"/><circle cx="47" cy="239" r="4" fill="#8fc7b7"/><text x="62" y="243" fill="#d5e1f3" font-family="sans-serif" font-size="16">run统计与预算截面</text><text x="62" y="267" fill="#9fb1c9" font-family="sans-serif" font-size="13">保留 N、D、E、C、B、S；同计算比较不同模型</text><path d="M400 284v28m-5 -6l5 6 5 -6" fill="none" stroke="#8eafdf"/><rect x="25" y="312" width="750" height="72" rx="6" fill="#182335" stroke="#49617f"/><circle cx="47" cy="339" r="4" fill="#8fc7b7"/><text x="62" y="343" fill="#d5e1f3" font-family="sans-serif" font-size="16">拟合 + 外推验证</text><text x="62" y="367" fill="#9fb1c9" font-family="sans-serif" font-size="13">单轴 → 联合函数 → batch校正 → compute frontier</text></svg>