<figcaption class="ltx_caption ltx_centering"><span class="ltx_tag ltx_tag_figure">Figure 15: </span>Far beyond the model sizes we study empirically, we find a contradiction between our equations for <math alttext="L(C_{\rm min})" class="ltx_Math" display="inline" id="S6.F15.m1" intent=":literal"><semantics><mrow><mi>L</mi><mo>⁡</mo><mrow><mo stretchy="false">(</mo><msub><mi>C</mi><mi>min</mi></msub><mo stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">L(C_{\rm min})</annotation></semantics></math> and <math alttext="L(D)" class="ltx_Math" display="inline" id="S6.F15.m2" intent=":literal"><semantics><mrow><mi>L</mi><mo>⁡</mo><mrow><mo stretchy="false">(</mo><mi>D</mi><mo stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">L(D)</annotation></semantics></math> due to the slow growth of data needed for compute-efficient training. The intersection marks the point before which we expect our predictions to break down. The location of this point is highly sensitive to the precise exponents from our power-law fits. </figcaption>
