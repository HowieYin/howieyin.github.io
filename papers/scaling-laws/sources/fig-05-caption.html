<figcaption class="ltx_caption ltx_centering"><span class="ltx_tag ltx_tag_figure">Figure 5: </span>Performance depends very mildly on model shape when the total number of non-embedding parameters <math alttext="N" class="ltx_Math" display="inline" id="S3.F5.m1" intent=":literal"><semantics><mi>N</mi><annotation encoding="application/x-tex">N</annotation></semantics></math> is held fixed. The loss varies only a few percent over a wide range of shapes. Small differences in parameter counts are compensated for by using the fit to <math alttext="L(N)" class="ltx_Math" display="inline" id="S3.F5.m2" intent=":literal"><semantics><mrow><mi>L</mi><mo>⁡</mo><mrow><mo stretchy="false">(</mo><mi>N</mi><mo stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">L(N)</annotation></semantics></math> as a baseline. Aspect ratio in particular can vary by a factor of 40 while only slightly impacting performance; an <math alttext="(n_{\mathrm{layer}},d_{\mathrm{model}})=(6,4288)" class="ltx_Math" display="inline" id="S3.F5.m3" intent=":literal"><semantics><mrow><mrow><mo stretchy="false">(</mo><msub><mi>n</mi><mi>layer</mi></msub><mo>,</mo><msub><mi>d</mi><mi>model</mi></msub><mo stretchy="false">)</mo></mrow><mo>=</mo><mrow><mo stretchy="false">(</mo><mn>6</mn><mo>,</mo><mn>4288</mn><mo stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">(n_{\mathrm{layer}},d_{\mathrm{model}})=(6,4288)</annotation></semantics></math> reaches a loss within 3% of the <math alttext="(48,1600)" class="ltx_Math" display="inline" id="S3.F5.m4" intent=":literal"><semantics><mrow><mo stretchy="false">(</mo><mn>48</mn><mo>,</mo><mn>1600</mn><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(48,1600)</annotation></semantics></math> model used in <cite class="ltx_cite ltx_citemacro_cite">[<a class="ltx_ref" href="#bib.bibx34" title="">RWC+19</a>]</cite>. </figcaption>
