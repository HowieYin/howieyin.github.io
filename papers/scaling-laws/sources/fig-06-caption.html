<figcaption class="ltx_caption ltx_centering"><span class="ltx_tag ltx_tag_figure">Figure 6: </span>
<span class="ltx_text ltx_font_bold" id="S3.F6.2">Left:</span> When we include embedding parameters, performance appears to depend strongly on the number of layers in addition to the number of parameters.
<span class="ltx_text ltx_font_bold" id="S3.F6.3">Right:</span> When we exclude embedding parameters, the performance of models with different depths converge to a single trend. Only models with fewer than 2 layers or with extreme depth-to-width ratios deviate significantly from the trend. </figcaption>
