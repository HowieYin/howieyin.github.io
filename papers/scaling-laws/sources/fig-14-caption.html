<figcaption class="ltx_caption ltx_centering"><span class="ltx_tag ltx_tag_figure">Figure 14: </span>
<span class="ltx_text ltx_font_bold" id="S6.F14.2">Left:</span> Each value of the compute budget <math alttext="C_{\rm min}" class="ltx_Math" display="inline" id="S6.F14.m1" intent=":literal"><semantics><msub><mi>C</mi><mi>min</mi></msub><annotation encoding="application/x-tex">C_{\rm min}</annotation></semantics></math> has an associated optimal model size <math alttext="N" class="ltx_Math" display="inline" id="S6.F14.m2" intent=":literal"><semantics><mi>N</mi><annotation encoding="application/x-tex">N</annotation></semantics></math>. Optimal model size grows very rapidly with <math alttext="C_{\rm min}" class="ltx_Math" display="inline" id="S6.F14.m3" intent=":literal"><semantics><msub><mi>C</mi><mi>min</mi></msub><annotation encoding="application/x-tex">C_{\rm min}</annotation></semantics></math>, increasing by 5x for each 10x increase in compute. The number of data examples processed makes up the remainder of the increase, growing relatively modestly by only 2x.
<span class="ltx_text ltx_font_bold" id="S6.F14.3">Right:</span> The batch-adjusted number of optimization steps also grows very slowly, if at all, meaning that most of the growth in data examples processed can be used for increased batch sizes.
</figcaption>
