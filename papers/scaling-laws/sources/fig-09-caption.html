<figcaption class="ltx_caption ltx_centering"><span class="ltx_tag ltx_tag_figure">Figure 9: </span>
The early-stopped test loss <math alttext="L(N,D)" class="ltx_Math" display="inline" id="S4.F9.m1" intent=":literal"><semantics><mrow><mi>L</mi><mo>⁡</mo><mrow><mo stretchy="false">(</mo><mi>N</mi><mo>,</mo><mi>D</mi><mo stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">L(N,D)</annotation></semantics></math> depends predictably on the dataset size <math alttext="D" class="ltx_Math" display="inline" id="S4.F9.m2" intent=":literal"><semantics><mi>D</mi><annotation encoding="application/x-tex">D</annotation></semantics></math> and model size <math alttext="N" class="ltx_Math" display="inline" id="S4.F9.m3" intent=":literal"><semantics><mi>N</mi><annotation encoding="application/x-tex">N</annotation></semantics></math> according to Equation (<a class="ltx_ref" href="#S1.E5" title="In 1.2 Summary of Scaling Laws ‣ 1 Introduction ‣ Scaling Laws for Neural Language Models"><span class="ltx_text ltx_ref_tag">1.5</span></a>).
<span class="ltx_text ltx_font_bold" id="S4.F9.2">Left</span>:
For large <math alttext="D" class="ltx_Math" display="inline" id="S4.F9.m4" intent=":literal"><semantics><mi>D</mi><annotation encoding="application/x-tex">D</annotation></semantics></math>, performance is a straight power law in <math alttext="N" class="ltx_Math" display="inline" id="S4.F9.m5" intent=":literal"><semantics><mi>N</mi><annotation encoding="application/x-tex">N</annotation></semantics></math>. For a smaller fixed <math alttext="D" class="ltx_Math" display="inline" id="S4.F9.m6" intent=":literal"><semantics><mi>D</mi><annotation encoding="application/x-tex">D</annotation></semantics></math>, performance stops improving as <math alttext="N" class="ltx_Math" display="inline" id="S4.F9.m7" intent=":literal"><semantics><mi>N</mi><annotation encoding="application/x-tex">N</annotation></semantics></math> increases and the model begins to overfit. (The reverse is also true, see Figure <a class="ltx_ref" href="#S1.F4" title="Figure 4 ‣ 1.2 Summary of Scaling Laws ‣ 1 Introduction ‣ Scaling Laws for Neural Language Models"><span class="ltx_text ltx_ref_tag">4</span></a>.)
<span class="ltx_text ltx_font_bold" id="S4.F9.3">Right</span>: The extent of overfitting depends predominantly on the ratio <math alttext="N^{\frac{\alpha_{N}}{\alpha_{D}}}/D" class="ltx_Math" display="inline" id="S4.F9.m8" intent=":literal"><semantics><mrow><msup><mi>N</mi><mfrac><msub><mi>α</mi><mi>N</mi></msub><msub><mi>α</mi><mi>D</mi></msub></mfrac></msup><mo>/</mo><mi>D</mi></mrow><annotation encoding="application/x-tex">N^{\frac{\alpha_{N}}{\alpha_{D}}}/D</annotation></semantics></math>, as predicted in equation (<a class="ltx_ref" href="#S4.E3" title="In 4.2 Results ‣ 4 Charting the Infinite Data Limit and Overfitting ‣ Scaling Laws for Neural Language Models"><span class="ltx_text ltx_ref_tag">4.3</span></a>). The line is our fit to that equation.
