<figcaption class="ltx_caption ltx_centering"><span class="ltx_tag ltx_tag_figure">Figure 16: </span> <span class="ltx_text ltx_font_bold" id="A4.F16.2">Left:</span> We characterize the step on which early stopping occurs, as a function of the extent of overfitting. The red line indicates a lower bound for early stopping that is derived in Section <a class="ltx_ref" href="#S5.SS3" title="5.3 Lower Bound on Early Stopping Step ‣ 5 Scaling Laws with Model Size and Training Time ‣ Scaling Laws for Neural Language Models"><span class="ltx_text ltx_ref_tag">5.3</span></a>. <span class="ltx_text ltx_font_bold" id="A4.F16.3">Right:</span> We display train and test loss for a series of 300M parameter models trained on different sized dataset sub-samples. The test loss typically follows that of a run done with unrestricted data until diverging. Note that the degree of overfitting (as compared to the infinite data limit) is significantly overestimated by <math alttext="L_{\rm test}-L_{\rm train}" class="ltx_Math" display="inline" id="A4.F16.m1" intent=":literal"><semantics><mrow><msub><mi>L</mi><mi>test</mi></msub><mo>−</mo><msub><mi>L</mi><mi>train</mi></msub></mrow><annotation encoding="application/x-tex">L_{\rm test}-L_{\rm train}</annotation></semantics></math> (denoted by a black bar for each run). </figcaption>
