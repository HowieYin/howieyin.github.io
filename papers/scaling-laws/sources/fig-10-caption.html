<figcaption class="ltx_caption ltx_centering"><span class="ltx_tag ltx_tag_figure">Figure 10: </span>The critical batch size <math alttext="B_{\rm crit}" class="ltx_Math" display="inline" id="S5.F10.m1" intent=":literal"><semantics><msub><mi>B</mi><mi>crit</mi></msub><annotation encoding="application/x-tex">B_{\rm crit}</annotation></semantics></math> follows a power law in the loss as performance increase, and does not depend directly on the model size. We find that the critical batch size approximately doubles for every <math alttext="13\%" class="ltx_Math" display="inline" id="S5.F10.m2" intent=":literal"><semantics><mrow><mn>13</mn><mo>%</mo></mrow><annotation encoding="application/x-tex">13\%</annotation></semantics></math> decrease in loss. <math alttext="B_{\rm crit}" class="ltx_Math" display="inline" id="S5.F10.m3" intent=":literal"><semantics><msub><mi>B</mi><mi>crit</mi></msub><annotation encoding="application/x-tex">B_{\rm crit}</annotation></semantics></math> is measured empirically from the data shown in Figure <a class="ltx_ref" href="#A4.F18" title="Figure 18 ‣ D.3 Batch Size ‣ Appendix D Supplemental Figures ‣ Scaling Laws for Neural Language Models"><span class="ltx_text ltx_ref_tag">18</span></a>, but it is also roughly predicted by the gradient noise scale, as in <cite class="ltx_cite ltx_citemacro_cite">[<a class="ltx_ref" href="#bib.bibx28" title="">MKAT18</a>]</cite>. </figcaption>
