<svg id="evolution-diagram" width="1206" xmlns="http://www.w3.org/2000/svg" class="flowchart" height="454" viewBox="0 0 1206 454" role="graphics-document document" aria-roledescription="flowchart-v2"><style>#evolution-diagram{font-family:Arial,sans-serif;font-size:16px;fill:#ccc;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#evolution-diagram .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#evolution-diagram .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#evolution-diagram .error-icon{fill:#a44141;}#evolution-diagram .error-text{fill:#ddd;stroke:#ddd;}#evolution-diagram .edge-thickness-normal{stroke-width:1px;}#evolution-diagram .edge-thickness-thick{stroke-width:3.5px;}#evolution-diagram .edge-pattern-solid{stroke-dasharray:0;}#evolution-diagram .edge-thickness-invisible{stroke-width:0;fill:none;}#evolution-diagram .edge-pattern-dashed{stroke-dasharray:3;}#evolution-diagram .edge-pattern-dotted{stroke-dasharray:2;}#evolution-diagram .marker{fill:#91aacd;stroke:#91aacd;}#evolution-diagram .marker.cross{stroke:#91aacd;}#evolution-diagram svg{font-family:Arial,sans-serif;font-size:16px;}#evolution-diagram p{margin:0;}#evolution-diagram .label{font-family:Arial,sans-serif;color:#ccc;}#evolution-diagram .cluster-label text{fill:#F9FFFE;}#evolution-diagram .cluster-label span{color:#F9FFFE;}#evolution-diagram .cluster-label span p{background-color:transparent;}#evolution-diagram .label text,#evolution-diagram span{fill:#ccc;color:#ccc;}#evolution-diagram .node rect,#evolution-diagram .node circle,#evolution-diagram .node ellipse,#evolution-diagram .node polygon,#evolution-diagram .node path{fill:#1f2020;stroke:#ccc;stroke-width:1px;}#evolution-diagram .rough-node .label text,#evolution-diagram .node .label text,#evolution-diagram .image-shape .label,#ev