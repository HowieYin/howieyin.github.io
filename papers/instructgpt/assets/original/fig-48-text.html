<span class="ltx_p"><span class="ltx_text" style="font-size:90%;">Justice Ruth Bader Ginsburg, Champion Of Gender Equality, Dies At 87</span></span>
</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left ltx_align_top">
<span class="ltx_inline-block ltx_align_top" style="width:327.8pt;">
<span class="ltx_p"><span class="ltx_text" style="font-size:90%;">By Nina Totenberg</span></span>
</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left ltx_align_top"></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left ltx_align_top">
<span class="ltx_inline-block ltx_align_top" style="width:327.8pt;">
<span class="ltx_p"><span class="ltx_text" style="font-size:90%;">Justice Ruth Bader Ginsburg, the demure firebrand who in her 80s became a legal, cultural and feminist icon, died Friday. The Supreme Court announced her death, saying the cause was complications from metastatic cancer of the pancreas.</span></span>
</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left ltx_align_top"></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left ltx_align_top">
<span class="ltx_inline-block ltx_align_top" style="width:327.8pt;">
<span class="ltx_p"><span class="ltx_text" style="font-size:90%;">The court, in a statement, said Ginsburg died at her home in Washington, D.C., surrounded by family. She was 87.</span></span>
</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left ltx_align_top"></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left ltx_align_top">
<span class="ltx_inline-block ltx_align_top" style="width:327.8pt;">
<span class="ltx_p"><span class="ltx_text" style="font-size:90%;">"Our nation has lost a justice of historic stature," Chief Justice John Roberts said. "We at the Supreme Court have lost a cherished colleague. Today we mourn but with confidence that future generations will remember Ruth Bader Ginsburg as we knew her, a tireless and resolute champion of justice."</span></span>
</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left ltx_align_top"></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left ltx_align_top">
<span class="ltx_inline-block ltx_align_top" style="width:327.8pt;">
<span class="ltx_p"><span class="ltx_text" style="font-size:90%;">Architect of the legal fight for women’s rights in the 1970s, Ginsburg subsequently served 27 years on the nation’s highest court, becoming its most prominent member. Her death will inevitably set in motion what promises to be a nasty and tumultuous political battle over who will succeed her, and it thrusts the Supreme Court vacancy into the spotlight of the presidential campaign.</span></span>
</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left ltx_align_top"></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left ltx_align_top">
<span class="ltx_inline-block ltx_align_top" style="width:327.8pt;">
<span class="ltx_p"><span class="ltx_text" style="font-size:90%;">Just days before her death, as her strength waned, Ginsburg dictated this statement to her granddaughter Clara Spera: "My most fervent wish is that I will not be replaced until a new president is installed."</span></span>
</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left ltx_align_top"></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left ltx_align_top">
<span class="ltx_inline-block ltx_align_top" style="width:327.8pt;">
<span class="ltx_p"><span class="ltx_text" style="font-size:90%;">She knew what was to come. Ginsburg’s death will have profound consequences for the court and the country. Inside the court, not only is the leader of the liberal wing gone, but with the court about to open a new term, the chief justice no longer holds the controlling vote in closely contested cases.</span></span>
</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left ltx_align_top"></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left ltx_align_top">
<span class="ltx_inline-block ltx_align_top" style="width:327.8pt;">
<span class="ltx_p"><span class="ltx_text" style="font-size:90%;">Though Roberts has a consistently conservative record in most cases, he has split from fellow conservatives in a few important ones this year, casting his vote with liberals, for instance, to protect at least temporarily the so-called DREAMers from deportation by the Trump administration, to uphold a major abortion precedent and to uphold bans on large church gatherings during the coronavirus pandemic. But with Ginsburg gone, there is no clear court majority for those outcomes.</span></span>
</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left ltx_align_top"></td></tr>
<tr class="ltx_tr">

<span class="ltx_p"><span class="ltx_text" style="font-size:90%;">1. Who announced Ginsburg’s death?</span></span>
</span></td></tr>
<tr class="ltx_tr">

<span class="ltx_inline-block ltx_align_top" style="width:327.8pt;">
<span class="ltx_p"><span class="ltx_text" style="font-size:90%;">2. What was Ginsburg’s statement to her granddaughter?</span></span>
</span></td></tr>

</span></td></tr>
