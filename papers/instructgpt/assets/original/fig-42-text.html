<span class="ltx_p"><span class="ltx_text" style="font-size:90%;">Écrivez une histoire au sujet d’un enfant qui voudrait tout savoir sur les jeux des dieux et qui se retrouve dans l’une de leurs histoires.</span></span>
<span class="ltx_p"><span class="ltx_text" style="font-size:90%;">Écrivez une histoire sur un jeune homme qui a une aventure dans une époque lointaine avec une fille de l’époque.</span></span>
<span class="ltx_p"><span class="ltx_text" style="font-size:90%;">Écrivez une histoire sur un enfant qui est envoyé à l’école et qui a un ami imaginaire qui lui permet de voyager dans le temps.</span></span>
</span></td>
<td class="ltx_td ltx_align_left ltx_align_top ltx_border_bb">

<span class="ltx_p"><span class="ltx_text" style="font-size:90%;">La grenouille était perdue et épuisée. Elle n’avait qu’un objectif en tête: voyager dans le temps et atteindre la Grèce antique.</span></span>
<span class="ltx_p"><span class="ltx_text" style="font-size:90%;">Premier problème, trouver un moyen de transport. Elle avait entendu dire que l’un des meilleurs moyens était de sauter dans une machine temporelle. Elle s’élança, et voilà qu’elle se retrouva dans le passé, au cours d’une nuit étoilée à l’odeur douce et envoûtante.</span></span>
<span class="ltx_p"><span class="ltx_text" style="font-size:90%;">La grenouille avance alors d’un pas rapide et aventureux dans les rues en pente et les petites auberges de la ville antique. Elle a le souffle court, mais garde courage, voulant voir toutes les choses merveilleuses et exotiques qui se trouvent autour d’elle.</span></span>
<span class="ltx_p"><span class="ltx_text" style="font-size:90%;">Elle traverse le forum romain, contemple des temples antiques et des statues magnifiques, et s’émerveille de la beauté et de la magie de cette époque envoûtante. Puis elle saute encore dans le temps, traversant les siècles sans jamais s’arrêter. Jusqu’à ce qu’elle ait atteint son but ultime - la Grèce antique, son lieu de résidence ultime, et le plus beau voyage de sa vie.</span></span>
