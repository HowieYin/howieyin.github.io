<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 295" role="img" aria-label="归一化的融合与物化 IO 分析模型"><rect x="20" y="14" width="640" height="62" rx="6" fill="#182638" stroke="#506885"/><text x="40" y="38" fill="#d5e4f7" font-size="14">输入主激活：N = B × T × D 个元素</text><text x="40" y="60" fill="#a4b6cd" font-size="12">Row-fused：读入一行 → fp32 mean / variance</text><path d="M340 76v22m-5 -6l5 6 5 -6" fill="none" stroke="#9bbdec"/><rect x="20" y="103" width="640" height="62" rx="6" fill="#182638" stroke="#506885"/><text x="40" y="127" fill="#d5e4f7" font-size="14">标准化与 affine 就地计算</text><text x="40" y="149" fill="#a4b6cd" font-size="12">保持局部临时值，写回输出 → 主激活 read + write ≈ 2Ns</text><path d="M340 165v22m-5 -6l5 6 5 -6" fill="none" stroke="#9bbdec"/><rect x="20" y="192" width="640" height="62" rx="6" fill="#182638" stroke="#506885"/><text x="40" y="216" fill="#d5e4f7" font-size="14">五 kernel 物化链：mean / center / square / variance / affine</text><text x="40" y="238" fill="#a4b6cd" font-size="12">主激活约 (1+2+2+1+2)Ns = 8Ns；参数与小统计另计</text></svg>