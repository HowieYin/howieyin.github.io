<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 384" role="img" aria-label="LN-LSTM：统计域与状态保存"><rect x="20" y="14" width="640" height="62" rx="6" fill="#182638" stroke="#506885"/><text x="40" y="38" fill="#d5e4f7" font-size="14">当前输入 xₜ 与循环状态 hₜ₋₁</text><text x="40" y="60" fill="#a4b6cd" font-size="12">Wₓ xₜ → 4H；Wₕ hₜ₋₁ → 4H</text><path d="M340 76v22m-5 -6l5 6 5 -6" fill="none" stroke="#9bbdec"/><rect x="20" y="103" width="640" height="62" rx="6" fill="#182638" stroke="#506885"/><text x="40" y="127" fill="#d5e4f7" font-size="14">两条投影分别做 4H LN，然后相加+b</text><text x="40" y="149" fill="#a4b6cd" font-size="12">LN → concat gates → split f/i/o/g → sigmoid / tanh</text><path d="M340 165v22m-5 -6l5 6 5 -6" fill="none" stroke="#9bbdec"/><rect x="20" y="192" width="640" height="62" rx="6" fill="#182638" stroke="#506885"/><text x="40" y="216" fill="#d5e4f7" font-size="14">更新 H 维 cell cₜ</text><text x="40" y="238" fill="#a4b6cd" font-size="12">forget gate × old cell + input gate × candidate</text><path d="M340 254v22m-5 -6l5 6 5 -6" fill="none" stroke="#9bbdec"/><rect x="20" y="281" width="640" height="62" rx="6" fill="#182638" stroke="#506885"/><text x="40" y="305" fill="#d5e4f7" font-size="14">第三处 H 维 LN 只用于读取 cell</text><text x="40" y="327" fill="#a4b6cd" font-size="12">hₜ = sigmoid(oₜ) × tanh(LN(cₜ))；不是重写保存的 cₜ</text></svg>