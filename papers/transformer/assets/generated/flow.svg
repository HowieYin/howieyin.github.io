 y="186" text-anchor="middle" fill="#dce7f7" font-family="sans-serif" font-size="14">Causal self-attention</text><text x="525.0" y="209" text-anchor="middle" fill="#dce7f7" font-family="sans-serif" font-size="14">Target history only</text><path d="M525 106 L525 156" stroke="#97b9e7" stroke-width="1.6" fill="none" marker-end="url(#arrow-flow)"/><rect x="375" y="290" width="300" height="76" rx="7" fill="#1b304a" stroke="#627992"/><text x="525.0" y="316" text-anchor="middle" fill="#dce7f7" font-family="sans-serif" font-size="14">Cross-attention → FFN</text><text x="525.0" y="339" text-anchor="middle" fill="#dce7f7" font-family="sans-serif" font-size="14">Q: target · K/V: source</text><path d="M525 236 L525 286" stroke="#97b9e7" stroke-width="1.6" fill="none" marker-end="url(#arrow-flow)"/><path d="M285 328 L371 328" stroke="#97b9e7" stroke-width="1.6" fill="none" marker-end="url(#arrow-flow)"/><rect x="375" y="420" width="300" height="76" rx="7" fill="#152133" stroke="#627992"/><text x="525.0" y="446" text-anchor="middle" fill="#dce7f7" font-family="sans-serif" font-size="14">Repeat decoder layer × 6</text><text x="525.0" y="469" text-anchor="middle" fill="#dce7f7" font-family="sans-serif" font-size="14">Logits [B,n_t,Vocab]</text><path d="M525 366 L525 416" stroke="#97b9e7" stroke-width="1.6" fill="none" marker-end="url(#arrow-flow)"/></svg>