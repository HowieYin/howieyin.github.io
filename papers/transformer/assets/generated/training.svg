<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 335" role="img" aria-labelledby="svg-training-title"><title id="svg-training-title">Known targets enable parallel training</title><defs><marker id="arrow-training" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#97b9e7"/></marker></defs><rect x="25" y="30" width="310" height="76" rx="7" fill="#152133" stroke="#627992"/><text x="180.0" y="56" text-anchor="middle" fill="#dce7f7" font-family="sans-serif" font-size="14">Gold labels</text><text x="180.0" y="79" text-anchor="middle" fill="#dce7f7" font-family="sans-serif" font-size="14">y₁   y₂   y₃   EOS</text><rect x="365" y="30" width="310" height="76" rx="7" fill="#1b304a" stroke="#627992"/><text x="520.0" y="56" text-anchor="middle" fill="#dce7f7" font-family="sans-serif" font-size="14">Shift right</text><text x="520.0" y="79" text-anchor="middle" fill="#dce7f7" font-family="sans-serif" font-size="14">BOS   y₁   y₂   y₃</text><path d="M335 67 L361 67" stroke="#97b9e7" stroke-width="1.6" fill="none" marker-end="url(#arrow-training)"/><rect x="365" y="155" width="310" height="145" rx="7" fill="#152133" stroke="#627992"/><text x="520.0" y="181" text-anchor="middle" fill="#dce7f7" font-family="sans-serif" font-size="14">Causal input support</text><text x="520.0" y="204" text-anchor="middle" fill="#dce7f7" font-family="sans-serif" font-size="14">q₀: BOS</text><text x="520.0" y="227" text-anchor="middle" fill="#dce7f7" font-family="sans-serif" font-size="14">q₁: BOS + y₁</text><text x="520.0" y="250" text-anchor="middle" fill="#dce7f7" font-family="sans-serif" font-size="14">q₂: BOS + y₁ + y₂</text><text x="520.0" y="273" text-anchor="middle" fill="#dce7f7" font-family="sans-serif" font-size="14">q₃: BOS + y₁ + y₂ + y₃</text><path d="M520 106 L520 151" stroke="#97b9e7" stroke-width="1.6" fill="none" marker-end="url(#arrow-training)"/><rect x="25" y="200" width="280" height="99" rx="7" fill="#1b304a" stroke="#627992"/><text x="165.0" y="226" text-anchor="middle" fill="#dce7f7" font-family="sans-serif" font-size="14">All rows in one forward</text><text x="165.0" y="249" text-anchor="middle" fill="#dce7f7" font-family="sans-serif" font-size="14">Predict y₁ y₂ y₃ EOS</text><text x="165.0" y="272" text-anchor="middle" fill="#dce7f7" font-family="sans-serif" font-size="14">Each row lacks its answer</text><path d="M365 242 L309 242" stroke="#97b9e7" stroke-width="1.6" fill="none" marker-end="url(#arrow-training)"/></svg>