<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" role="img" aria-labelledby="svg-cache-title"><title id="svg-cache-title">One new token, two cache lifetimes</title><defs><marker id="arrow-cache" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#97b9e7"/></marker></defs><rect x="25" y="25" width="205" height="76" rx="7" fill="#1b304a" stroke="#627992"/><text x="127.5" y="51" text-anchor="middle" fill="#dce7f7" font-family="sans-serif" font-size="14">New target token</text><text x="127.5" y="74" text-anchor="middle" fill="#dce7f7" font-family="sans-serif" font-size="14">Q_t, K_t, V_t</text><rect x="265" y="25" width="405" height="99" rx="7" fill="#1b304a" stroke="#627992"/><text x="467.5" y="51" text-anchor="middle" fill="#dce7f7" font-family="sans-serif" font-size="14">Self attention + layer cache</text><text x="467.5" y="74" text-anchor="middle" fill="#dce7f7" font-family="sans-serif" font-size="14">K₁…K_t · V₁…V_t</text><text x="467.5" y="97" text-anchor="middle" fill="#dce7f7" font-family="sans-serif" font-size="14">Append and read once per step</text><path d="M230 63 L261 63" stroke="#97b9e7" stroke-width="1.6" fill="none" marker-end="url(#arrow-cache)"/><rect x="265" y="185" width="405" height="99" rx="7" fill="#152133" stroke="#627992"/><text x="467.5" y="211" text-anchor="middle" fill="#dce7f7" font-family="sans-serif" font-size="14">Cross-attention: updated target Q</text><text x="467.5" y="234" text-anchor="middle" fill="#dce7f7" font-family="sans-serif" font-size="14">Projected source K / V cache</text><text x="467.5" y="257" text-anchor="middle" fill="#dce7f7" font-family="sans-serif" font-size="14">Source K/V fixed across target steps</text><path d="M468 122 L468 181" stroke="#97b9e7" stroke-width="1.6" fill="none" marker-end="url(#arrow-cache)"/><rect x="25" y="185" width="205" height="76" rx="7" fill="#152133" stroke="#627992"/><text x="127.5" y="211" text-anchor="middle" fill="#dce7f7" font-family="sans-serif" font-size="14">Source encoder</text><text x="127.5" y="234" text-anchor="middle" fill="#dce7f7" font-family="sans-serif" font-size="14">Computed once</text><path d="M230 223 L261 223" stroke="#97b9e7" stroke-width="1.6" fill="none" marker-end="url(#arrow-cache)"/><rect x="265" y="345" width="405" height="76" rx="7" fill="#152133" stroke="#627992"/><text x="467.5" y="371" text-anchor="middle" fill="#dce7f7" font-family="sans-serif" font-size="14">FFN → next layer → vocabulary</text><text x="467.5" y="394" text-anchor="middle" fill="#dce7f7" font-family="sans-serif" font-size="14">Choose token → next step</text><path d="M468 282 L468 341" stroke="#97b9e7" stroke-width="1.6" fill="none" marker-end="url(#arrow-cache)"/></svg>