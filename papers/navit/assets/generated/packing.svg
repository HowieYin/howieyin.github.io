<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 580" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#9fc2e1"/></marker></defs><rect width="620" height="580" fill="#101824"/><rect x="40" y="12" width="540" height="60" rx="4" fill="#19293b" stroke="#6082a0"/><text x="310" y="39" text-anchor="middle" fill="#e5edf5" font-family="sans-serif" font-size="25">不同形状 · 不同面积的图片</text><text x="310" y="61" text-anchor="middle" fill="#adc4da" font-family="monospace" font-size="16">Hᵢ × Wᵢ</text><path d="M310 73V89" stroke="#9fc2e1" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="91" width="540" height="60" rx="4" fill="#19293b" stroke="#6082a0"/><text x="310" y="118" text-anchor="middle" fill="#e5edf5" font-family="sans-serif" font-size="25">Patchify · 保留二维身份</text><text x="310" y="140" text-anchor="middle" fill="#adc4da" font-family="monospace" font-size="16">pixels + x/y + image ID</text><path d="M310 152V168" stroke="#9fc2e1" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="170" width="540" height="60" rx="4" fill="#19293b" stroke="#6082a0"/><text x="310" y="197" text-anchor="middle" fill="#e5edf5" font-family="sans-serif" font-size="25">逐图 token dropping</text><text x="310" y="219" text-anchor="middle" fill="#adc4da" font-family="monospace" font-size="16">Nᵢ → Kᵢ ; original coordinates</text><path d="M310 231V247" stroke="#9fc2e1" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="249" width="540" height="60" rx="4" fill="#19293b" stroke="#6082a0"/><text x="310" y="276" text-anchor="middle" fill="#e5edf5" font-family="sans-serif" font-size="25">First-fit · 固定容器 S</text><text x="310" y="298" text-anchor="middle" fill="#adc4da" font-family="monospace" font-size="16">[A tokens | B tokens | pad]</text><path d="M310 310V326" stroke="#9fc2e1" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="328" width="540" height="60" rx="4" fill="#19293b" stroke="#6082a0"/><text x="310" y="355" text-anchor="middle" fill="#e5edf5" font-family="sans-serif" font-size="25">同图 masked attention</text><text x="310" y="377" text-anchor="middle" fill="#adc4da" font-family="monospace" font-size="16">Same image only ; safe pad queries</text><path d="M310 389V405" stroke="#9fc2e1" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="407" width="540" height="60" rx="4" fill="#19293b" stroke="#6082a0"/><text x="310" y="434" text-anchor="middle" fill="#e5edf5" font-family="sans-serif" font-size="25">逐图 masked pooling</text><text x="310" y="456" text-anchor="middle" fill="#adc4da" font-family="monospace" font-size="16">One representation per valid image</text><path d="M310 468V484" stroke="#9fc2e1" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="486" width="540" height="60" rx="4" fill="#19293b" stroke="#6082a0"/><text x="310" y="513" text-anchor="middle" fill="#e5edf5" font-family="sans-serif" font-size="25">有效样本 loss</text><text x="310" y="535" text-anchor="middle" fill="#adc4da" font-family="monospace" font-size="16">Ignore pad slots ; normalize by M</text></svg>