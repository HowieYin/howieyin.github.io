<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" role="img" aria-label="Save row statistics; regenerate only the tile"><style>text{fill:#d5e1f3;font:14px sans-serif}</style><defs><marker id="arrow-backward" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#8eafdf"/></marker></defs><rect x="28" y="16" width="544" height="52" rx="7" fill="#142031" stroke="#58739a"/><text x="300" y="47" text-anchor="middle">Forward: save Q/K/V + O,m,ℓ</text><path d="M300 68v23" stroke="#8eafdf" marker-end="url(#arrow-backward)"/><rect x="28" y="91" width="544" height="52" rx="7" fill="#142031" stroke="#58739a"/><text x="300" y="122" text-anchor="middle">Backward: Dᵢ = dot(dOᵢ,Oᵢ)</text><path d="M300 143v23" stroke="#8eafdf" marker-end="url(#arrow-backward)"/><rect x="28" y="166" width="544" height="52" rx="7" fill="#142031" stroke="#58739a"/><text x="300" y="197" text-anchor="middle">SRAM: recompute score tile</text><path d="M300 218v23" stroke="#8eafdf" marker-end="url(#arrow-backward)"/><rect x="28" y="241" width="544" height="52" rx="7" fill="#142031" stroke="#58739a"/><text x="300" y="272" text-anchor="middle">Restore Pᵢⱼ from global m,ℓ</text><path d="M300 293v23" stroke="#8eafdf" marker-end="url(#arrow-backward)"/><rect x="28" y="316" width="544" height="52" rx="7" fill="#142031" stroke="#58739a"/><text x="300" y="347" text-anchor="middle">dV=PᵀdO; dS=P⊙(dP−D)</text><path d="M300 368v23" stroke="#8eafdf" marker-end="url(#arrow-backward)"/><rect x="28" y="391" width="544" height="52" rx="7" fill="#142031" stroke="#58739a"/><text x="300" y="422" text-anchor="middle">Accumulate dQ,dK,dV → HBM</text></svg>