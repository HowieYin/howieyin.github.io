<figcaption class="ltx_caption ltx_centering"><span class="ltx_tag ltx_tag_figure">Figure 2.1: </span><span class="ltx_text ltx_font_bold">Zero-shot, one-shot and few-shot, contrasted with traditional fine-tuning</span>. The panels above show four methods for performing a task with a language model – fine-tuning is the traditional method, whereas zero-, one-, and few-shot, which we study in this work, require the model to perform the task with only forward passes at test time. We typically present the model with a few dozen examples in the few shot setting. Exact phrasings for all task descriptions, examples and prompts can be found in Appendix <a class="ltx_ref" href="https://arxiv.org/html/2005.14165v4#A7" title="Appendix G Details of Task Phrasing and Specifications ‣ Language Models are Few-Shot Learners"><span class="ltx_text ltx_ref_tag">G</span></a>.
