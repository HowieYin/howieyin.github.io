<figcaption class="ltx_caption ltx_centering"><span class="ltx_tag ltx_tag_figure">Figure 4.2: </span><span class="ltx_text ltx_font_bold">Benchmark contamination analysis</span>    We constructed cleaned versions of each of our benchmarks to check for potential contamination in our training set. The x-axis is a conservative lower bound for how much of the dataset is known with high confidence to be clean, and the y-axis shows the difference in performance when evaluating only on the verified clean subset. Performance on most benchmarks changed negligibly, but some were flagged for further review. On inspection we find some evidence for contamination of the PIQA and Winograd results, and we mark the corresponding results in Section <a class="ltx_ref" href="https://arxiv.org/html/2005.14165v4#S3" title="3 Results ‣ Language Models are Few-Shot Learners"><span class="ltx_text ltx_ref_tag">3</span></a> with an asterisk. We find no evidence that other benchmarks are affected.<p class="source-note">Original Paper · Figure 4.2 · arXiv v4. Click image to zoom.</p></figcaption>
</figure>
