<span class="ltx_p"><span class="ltx_text ltx_font_typewriter">A "whatpu" is a small, furry animal native to Tanzania. An example of a sentence that uses the word whatpu is: 
<br class="ltx_break"/>We were traveling in Africa and we saw these very cute whatpus.
<br class="ltx_break"/><span class="ltx_rule"> </span></span></span>
<span class="ltx_p"><span class="ltx_text ltx_font_typewriter">To do a "farduddle" means to jump up and down really fast. An example of a sentence that uses the word farduddle is:
<br class="ltx_break"/></span><span class="ltx_text ltx_font_bold">One day when I was playing tag with my little sister, she got really excited and she started doing these crazy farduddles.
<br class="ltx_break"/></span><span class="ltx_text ltx_font_typewriter">A "yalubalu" is a type of vegetable that looks like a big pumpkin. An example of a sentence that uses the word yalubalu is:
<br class="ltx_break"/></span><span class="ltx_text ltx_font_bold">I was on a trip to Africa and I tried this yalubalu vegetable that was grown in a garden there. It was delicious.
<br class="ltx_break"/><span class="ltx_rule"> </span></span></span>
<span class="ltx_p"><span class="ltx_text ltx_font_typewriter">A "Burringo" is a car with very fast acceleration. An example of a sentence that uses the word Burringo is:
<br class="ltx_break"/></span><span class="ltx_text ltx_font_bold">In our garage we have a Burringo that my father drives to work every day.
<br class="ltx_break"/><span class="ltx_rule"> </span></span></span>
<span class="ltx_p"><span class="ltx_text ltx_font_typewriter">A "Gigamuru" is a type of Japanese musical instrument. An example of a sentence that uses the word Gigamuru is:
<br class="ltx_break"/></span><span class="ltx_text ltx_font_bold">I have a Gigamuru that my uncle gave me as a gift. I love to play it at home.
<br class="ltx_break"/><span class="ltx_rule"> </span></span></span>
<span class="ltx_p"><span class="ltx_text ltx_font_typewriter">To "screeg" something is to swing a sword at it. An example of a sentence that uses the word screeg is:
