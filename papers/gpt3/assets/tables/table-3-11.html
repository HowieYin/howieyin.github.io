<figcaption class="ltx_caption ltx_centering"><span class="ltx_tag ltx_tag_table">Table 3.11: </span><span class="ltx_text ltx_font_bold">Human accuracy in identifying whether short (<math alttext="\sim" class="ltx_Math" display="inline" intent=":literal"><semantics><mo>∼</mo></semantics></math>200 word) news articles are model generated</span>. We find that human accuracy (measured by the ratio of correct assignments to non-neutral assignments) ranges from 86% on the control model to 52% on GPT-3 175B. This table compares mean accuracy between five different models, and shows the results of a two-sample T-Test for the difference in mean accuracy between each model and the control model (an unconditional GPT-3 Small model with increased output randomness).<p class="source-note">Original Paper · Table 3.11 · arXiv v4. Original text / formatting retained.</p></figcaption>
