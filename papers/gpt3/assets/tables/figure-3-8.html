Performance on SuperGLUE increases with model size and number of examples in context.</span> A value of <math alttext="K=32" class="ltx_Math" display="inline" intent=":literal"><semantics><mrow><mi>K</mi><mo>=</mo><mn>32</mn></mrow></semantics></math> means that our model was shown 32 examples per task, for 256 examples total divided across the 8 tasks in SuperGLUE. We report GPT-3 values on the dev set, so our numbers are not directly comparable to the dotted reference lines (our test set results are in Table <a class="ltx_ref" href="https://arxiv.org/html/2005.14165v4#S3.T8" title="Table 3.8 ‣ 3.6 Reading Comprehension ‣ 3 Results ‣ Language Models are Few-Shot Learners"><span class="ltx_text ltx_ref_tag">3.8</span></a>). The BERT-Large reference model was fine-tuned on the SuperGLUE training set (125K examples), whereas BERT++ was first fine-tuned on MultiNLI (392K examples) and SWAG (113K examples) before further fine-tuning on the SuperGLUE training set (for a total of 630K fine-tuning examples). We find the difference in performance between the BERT-Large and BERT++ to be roughly equivalent to the difference between GPT-3 with one example per context versus eight examples per context.
