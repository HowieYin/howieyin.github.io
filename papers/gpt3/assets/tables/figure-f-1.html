<td class="ltx_td ltx_align_left ltx_border_tt"><span class="ltx_text ltx_font_typewriter">The City</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td"></td>

<tr class="ltx_tr">

<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">SOME TREES</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td"></td>
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">John Ashbery</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td"></td>

<tr class="ltx_tr">
<td class="ltx_td"></td>
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">Shadows on the Way</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td"></td>
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">Wallace Stevens</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left ltx_border_t"><span class="ltx_text ltx_font_typewriter">-------- Generated Poem 1 --------</span></td>
<td class="ltx_td ltx_align_left ltx_border_t"><span class="ltx_text ltx_font_typewriter">-------- Generated Poem 3 --------</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">I must have shadows on the way</span></td>
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">The sun was all we had. Now, in the shade</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">If I am to walk I must have</span></td>
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">All is changed. The mind must dwell on those</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">Each step taken slowly and alone</span></td>
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">White fields, that to its eyes were always old;</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">To have it ready made</span></td>
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">Those ancient gleams, convoluting</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td"></td>
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">The way they lay among the huge roots,</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">And I must think in lines of grey</span></td>
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">The great dark tomes of reverie,</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">To have dim thoughts to be my guide</span></td>
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">The plumed labyrinth of the sea.</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">Must look on blue and green</span></td>
<td class="ltx_td"></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">And never let my eye forget</span></td>
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">When our own breath gonne faint and fade</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">That color is my friend</span></td>
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">Up the long stairway of the dead</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">And purple must surround me too</span></td>
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">We shall remember well</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td"></td>
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">The blindness of the light, the whiteness</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">The yellow of the sun is no more</span></td>
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">Of that white land. The footsteps, and</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">Intrusive than the bluish snow</span></td>
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">The grasses in that light, and in the shade</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">That falls on all of us. I must have</span></td>
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">The menacing life.</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">Grey thoughts and blue thoughts walk with me</span></td>
<td class="ltx_td"></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">If I am to go away at all.</span></td>
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">We played, too, once, in the warmest rooms.</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td"></td>
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">To one content, there is one content</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">-------- Generated Poem 2 --------</span></td>
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">For all mankind. The forest glades</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td"></td>
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">Are all the more for being in fable,</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">There is a way in the world.</span></td>
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">And wood and town in legend shadowed-</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">That way a man may live in a small town</span></td>
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">Once more to return. The one content</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">His lifetime and see no man come,</span></td>
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">Has in it every happiness, more brave</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">Never the stir of men about a market,</span></td>
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">For being purposeless; and so</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">Never the bobbing of covered carts,</span></td>
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">Those island gardens, deep in the mind,</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">Never the creak passed on the stair</span></td>
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">Make of remoteness familiarity</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">Closing some other life; an old man</span></td>
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">And of the unspoken name a friend.</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">Can prosper in that town, can prosper</span></td>
<td class="ltx_td"></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">When his store is seen to close, his wife</span></td>
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">-------- Generated Poem 4 --------</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">Fades in his house, and the world shouts in vain</span></td>
<td class="ltx_td"></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">That no one comes to hear him</span></td>
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">Nobody will come to this place. It is a road that leads nowhere.</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">Where his small bell tolls.</span></td>
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">The solitude is deep. The mountains are high.</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">In that small town</span></td>
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">But they are desolate, and they turn the traveler’s face</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">Everything is known.</span></td>
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">Towards the North. All the sounds of the world are far away.</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">The ways of the young men are known,</span></td>
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">When the wind rises above the trees,</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">And the ways of the young women</span></td>
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">The boughs bow to the ground.</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">As they walk to the Spring;</span></td>
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">Even the birds that inhabit the tangle of weeds</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">The rumors are all known,</span></td>
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">That is the roadside cover, are silent. One listens,</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">The quarrels, the hurt, the envy</span></td>
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">But hears no roar of the forest. One is alone.</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">Of the men and the women.</span></td>
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">One will be taken.</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">Till a day comes</span></td>
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">One will be taken.</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">That way out of the world</span></td>
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">There is no utterance, there is no conversation,</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">That leads to a wood.</span></td>
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">But one is uneasy all the same....</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">Young, the young man</span></td>
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">There is a thin blue mist,</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">Walks, a lover now,</span></td>
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">A darkness rising like smoke,</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">Knows the streets as they are and is of them.</span></td>
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">And within that darkness</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td"></td>
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">A possession of the heart.</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">Comes to the wood.</span></td>
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">One will be taken.... It was here, and it will be here again-</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td"></td>
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">Here, under this sky empty and full of light.</span></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">There, in the wood, among trees,</span></td>
<td class="ltx_td"></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">He sees shadows on the way, hears voices,</span></td>
<td class="ltx_td"></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">hears the wind and the rustling of leaves;</span></td>
<td class="ltx_td"></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">Through an open glade</span></td>
<td class="ltx_td"></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">He sees a shape and the shape hears:</span></td>
<td class="ltx_td"></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">It waits as he waits,</span></td>
<td class="ltx_td"></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">Waits as the shadows wait,</span></td>
<td class="ltx_td"></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left"><span class="ltx_text ltx_font_typewriter">As the voices wait;</span></td>
<td class="ltx_td"></td></tr>
<tr class="ltx_tr">
<td class="ltx_td ltx_align_left ltx_border_bb"><span class="ltx_text ltx_font_typewriter">Shadows on the way, voices in the wind.</span></td>
<td class="ltx_td ltx_border_bb"></td></tr>
</tbody>
</table>
