<span class="ltx_p"><span class="ltx_text ltx_font_typewriter">Title: Star’s Tux Promise Draws Megyn Kelly’s Sarcasm
</span></span>
<span class="ltx_p"><span class="ltx_text ltx_font_typewriter">Subtitle: Joaquin Phoenix pledged to not change for each awards event
</span></span>
<span class="ltx_p"><span class="ltx_text ltx_font_typewriter">Article:<span class="ltx_text">
</span></span><span class="ltx_text ltx_font_bold">A year ago, Joaquin Phoenix made headlines when he appeared on the red carpet at the Golden Globes wearing a tuxedo with a paper bag over his head that read, ”I am a shape-shifter. I can’t change the world. I can only change myself.” It was a promise to not change to fit into the Hollywood mold: ”I think that’s a really special thing, to not change yourself. I think it’s a really special thing to say, ‘This is what’s inside of me, I’m proud of it, and I’m not going to be ashamed because of the way that someone else thinks I should be.’” Now, it’s the Oscars, and Phoenix is at it again. But this time, his publicist is saying he’ll be wearing a tux no matter what.</span><span class="ltx_text ltx_font_typewriter">
</span></span>
<span class="ltx_p"><span class="ltx_text ltx_font_bold">Megyn Kelly was not impressed, and she let him have it on The Tonight Show. ”You know, I feel like, I feel like you could have worn the tux,” she says. ”But you’re saying you’re a shape-shifter. I don’t know if you can change your tux, but you can change your mind. You can change your mind. You can change your mind.” Phoenix says he did, but it didn’t stick. ”I was like, ‘Okay, I’m going to wear a tuxedo to this thing.’ And then I thought, ‘I don’t want to wear a tuxedo to this thing.’” Kelly goes on to encourage him to change his mind again, but Phoenix says it’s too late: ”I’m committed to wearing this.”
</span><span class="ltx_text ltx_font_typewriter">
