<figcaption class="ltx_caption ltx_centering"><span class="ltx_tag ltx_tag_figure">Figure 1.2: </span><span class="ltx_text ltx_font_bold">Larger models make increasingly efficient use of in-context information.</span>   We show in-context learning performance on a simple task requiring the model to remove random symbols from a word, both with and without a natural language task description (see Sec. <a class="ltx_ref" href="https://arxiv.org/html/2005.14165v4#S3.SS9.SSS2" title="3.9.2 Word Scrambling and Manipulation Tasks ‣ 3.9 Synthetic and Qualitative Tasks ‣ 3 Results ‣ Language Models are Few-Shot Learners"><span class="ltx_text ltx_ref_tag">3.9.2</span></a>). The steeper “in-context learning curves” for large models demonstrate improved ability to learn a task from contextual information. We see qualitatively similar behavior across a wide range of tasks.<p class="source-note">Original Paper · Figure 1.2 · arXiv v4. Click image to zoom.</p></figcaption>
</figure>
