<figcaption class="ltx_caption ltx_centering"><span class="ltx_tag ltx_tag_figure">Figure 2.2: </span><span class="ltx_text ltx_font_bold">Total compute used during training</span>. Based on the analysis in Scaling Laws For Neural Language Models <cite class="ltx_cite ltx_citemacro_cite">[<a class="ltx_ref" href="https://arxiv.org/html/2005.14165v4#bib.bib57" title="">57</a>]</cite> we train much larger models on many fewer tokens than is typical. As a consequence, although GPT-3 3B is almost 10x larger than RoBERTa-Large (355M params), both models took roughly 50 petaflop/s-days of compute during pre-training. Methodology for these calculations can be found in Appendix <a class="ltx_ref" href="https://arxiv.org/html/2005.14165v4#A4" title="Appendix D Total Compute Used to Train Language Models ‣ Language Models are Few-Shot Learners"><span class="ltx_text ltx_ref_tag">D</span></a>.
