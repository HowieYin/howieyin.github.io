<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" role="img" aria-labelledby="svg-0c5d0222-title svg-0c5d0222-desc">
<title id="svg-0c5d0222-title">缓存表示与统一容量账</title><desc id="svg-0c5d0222-desc">在统一教学配置下比较MHA GQA MQA与latent加RoPE的raw cache，区别于真实全模型内存。</desc>
<defs><marker id="svg-0c5d0222-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8292a8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#dce4ef} .muted{fill:#9cabc0} .year{fill:#7dc6b2;font-size:17px;font-weight:600} .label{font-size:16px} .small{font-size:14px} .line{stroke:#718299;stroke-width:2;fill:none;marker-end:url(#svg-0c5d0222-arrow)}</style>
<text x="24" y="36" font-size="22" font-weight="600">逐位置保存历史：头共享与 latent 压缩</text><rect x="24" y="91" width="204" height="157" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="103" width="3" height="133" fill="#7dc6b2"/><text x="42" y="121" class="label" font-weight="600">MHA</text><text x="42" y="147" class="small muted">32 Q → 32 KV heads</text><text x="42" y="170" class="small muted">每头独立 K / V</text><text x="42" y="193" class="small muted">全部历史位置</text><text x="40" y="287" font-size="23" font-weight="600">16 GiB</text><rect x="240" y="91" width="204" height="157" rx="8" fill="#182230" stroke="#344355"/><rect x="240" y="103" width="3" height="133" fill="#7dc6b2"/><text x="258" y="121" class="label" font-weight="600">GQA</text><text x="258" y="147" class="small muted">32 Q → 8 KV heads</text><text x="258" y="170" class="small muted">每组 query 共用 KV</text><text x="258" y="193" class="small muted">全部历史位置</text><text x="256" y="287" font-size="23" font-weight="600">4 GiB</text><rect x="456" y="91" width="204" height="157" rx="8" fill="#182230" stroke="#344355"/><rect x="456" y="103" width="3" height="133" fill="#7dc6b2"/><text x="474" y="121" class="label" font-weight="600">MQA</text><text x="474" y="147" class="small muted">32 Q → 1 KV head</text><text x="474" y="170" class="small muted">所有 query 共用 KV</text><text x="474" y="193" class="small muted">全部历史位置</text><text x="472" y="287" font-size="23" font-weight="600">0.5 GiB</text><rect x="672" y="91" width="204" height="157" rx="8" fill="#182230" stroke="#344355"/><rect x="672" y="103" width="3" height="133" fill="#a7b5ee"/><text x="690" y="121" class="label" font-weight="600">Latent + RoPE</text><text x="690" y="147" class="small muted">latent 512 + key 64</text><text x="690" y="170" class="small muted">内容与位置分开缓存</text><text x="690" y="193" class="small muted">全部历史位置</text><text x="688" y="287" font-size="23" font-weight="600">1.125 GiB</text><rect x="24" y="339" width="405" height="120" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="351" width="3" height="96" fill="#7dc6b2"/><text x="42" y="369" class="label" font-weight="600">教学统一几何</text><text x="42" y="395" class="small muted">32 层 / batch 1 / 32768 tokens</text><text x="42" y="418" class="small muted">head dim 128 / BF16 2 bytes</text><text x="42" y="441" class="small muted">不是具体 checkpoint 配置</text><rect x="470" y="339" width="406" height="120" rx="8" fill="#182230" stroke="#344355"/><rect x="470" y="351" width="3" height="96" fill="#e6bf88"/><text x="488" y="369" class="label" font-weight="600">另列实际资源</text><text x="488" y="395" class="small muted">权重 / workspace / pages / indexer</text><text x="488" y="418" class="small muted">host 历史 / 传输 / allocator</text><text x="488" y="441" class="small muted">raw cache ≠ 峰值物理内存</text><text x="24" y="506" class="small muted">共享表示不是删除 token；任意 checkpoint 改结构需适应训练与质量验证。</text></svg>