<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 532" role="img" aria-labelledby="svg-8fe62831-title svg-8fe62831-desc">
<title id="svg-8fe62831-title">分块在线softmax</title><desc id="svg-8fe62831-desc">已处理块的最大值指数和内容和与下一块统一到新最大值，最终归一化，避免存完整概率矩阵。</desc>
<defs><marker id="svg-8fe62831-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8292a8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#dce4ef} .muted{fill:#9cabc0} .year{fill:#7dc6b2;font-size:17px;font-weight:600} .label{font-size:16px} .small{font-size:14px} .line{stroke:#718299;stroke-width:2;fill:none;marker-end:url(#svg-8fe62831-arrow)}</style>
<text x="24" y="36" font-size="22" font-weight="600">Online softmax：把历史块统一到同一个尺度</text><rect x="24" y="95" width="260" height="147" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="107" width="3" height="123" fill="#7dc6b2"/><text x="42" y="125" class="label" font-weight="600">已处理的块</text><text x="42" y="151" class="small muted">m：已见最大 score</text><text x="42" y="174" class="small muted">ℓ：缩放后的指数总量</text><text x="42" y="197" class="small muted">u：缩放后的内容总量</text><rect x="318" y="95" width="260" height="147" rx="8" fill="#182230" stroke="#344355"/><rect x="318" y="107" width="3" height="123" fill="#a7b5ee"/><text x="336" y="125" class="label" font-weight="600">下一块 K / V</text><text x="336" y="151" class="small muted">计算这块 scores</text><text x="336" y="174" class="small muted">找到块内最大 score</text><text x="336" y="197" class="small muted">局部指数与内容和</text><rect x="612" y="95" width="264" height="147" rx="8" fill="#182230" stroke="#344355"/><rect x="612" y="107" width="3" height="123" fill="#7dc6b2"/><text x="630" y="125" class="label" font-weight="600">合并尺度</text><text x="630" y="151" class="small muted">m′ = 两个最大值的 max</text><text x="630" y="174" class="small muted">旧 ℓ / u 乘 exp(m−m′)</text><text x="630" y="197" class="small muted">新块按 m′ 缩放后相加</text><path d="M285 169H314" class="line"/><path d="M579 169H608" class="line"/><rect x="24" y="329" width="405" height="129" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="341" width="3" height="105" fill="#7dc6b2"/><text x="42" y="359" class="label" font-weight="600">重复扫描允许的所有块</text><text x="42" y="385" class="small muted">只保存行统计量与输出</text><text x="42" y="408" class="small muted">不把 N×N 概率写回 HBM</text><text x="42" y="431" class="small muted">反向可重算局部概率</text><rect x="470" y="329" width="406" height="129" rx="8" fill="#182230" stroke="#344355"/><rect x="470" y="341" width="3" height="105" fill="#e6bf88"/><text x="488" y="359" class="label" font-weight="600">最终输出 o = u / ℓ</text><text x="488" y="385" class="small muted">数学上仍是同一 softmax</text><text x="488" y="408" class="small muted">浮点累加顺序改变</text><text x="488" y="431" class="small muted">不承诺 bitwise 一致</text><path d="M744 244L226 325" class="line"/><path d="M430 394H466" class="line"/><text x="24" y="506" class="small muted">省的是中间量 IO；dense 数学连接与主要平方 FLOPs 仍在。空 mask 行需单独处理。</text></svg>