<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 652" role="img" aria-labelledby="svg-ac23b806-title svg-ac23b806-desc">
<title id="svg-ac23b806-title">Attention逐算子与系统成本</title><desc id="svg-ac23b806-desc">区分prefill训练decode服务的计算与调度成本，连接状态执行三路线，质量延迟容量吞吐分协议测量。</desc>
<defs><marker id="svg-ac23b806-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8292a8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#dce4ef} .muted{fill:#9cabc0} .year{fill:#7dc6b2;font-size:17px;font-weight:600} .label{font-size:16px} .small{font-size:14px} .line{stroke:#718299;stroke-width:2;fill:none;marker-end:url(#svg-ac23b806-arrow)}</style>
<text x="24" y="36" font-size="22" font-weight="600">一次读取的成本，从模型扩展到服务关键路径</text><rect x="24" y="83" width="405" height="122" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="95" width="3" height="98" fill="#7dc6b2"/><text x="42" y="113" class="label" font-weight="600">Prefill / 训练</text><text x="42" y="139" class="small muted">投影 → QK → softmax → AV → O</text><text x="42" y="162" class="small muted">FFN / backward / optimizer</text><text x="42" y="185" class="small muted">长序列：平方项与中间量 IO</text><rect x="470" y="83" width="406" height="122" rx="8" fill="#182230" stroke="#344355"/><rect x="470" y="95" width="3" height="98" fill="#a7b5ee"/><text x="488" y="113" class="label" font-weight="600">Decode / 服务</text><text x="488" y="139" class="small muted">当前 Q + 读取历史 / 更新缓存</text><text x="488" y="162" class="small muted">索引 / gather / 传输 / 通信</text><text x="488" y="185" class="small muted">排队 → admission → 首 token</text><rect x="24" y="273" width="260" height="122" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="285" width="3" height="98" fill="#7dc6b2"/><text x="42" y="303" class="label" font-weight="600">改连接</text><text x="42" y="329" class="small muted">只读选定 blocks</text><text x="42" y="352" class="small muted">多分支 / indexer 也计时</text><text x="42" y="375" class="small muted">质量需要检索反证</text><rect x="318" y="273" width="260" height="122" rx="8" fill="#182230" stroke="#344355"/><rect x="318" y="285" width="3" height="98" fill="#a7b5ee"/><text x="336" y="303" class="label" font-weight="600">改状态</text><text x="336" y="329" class="small muted">共享 / latent / finite state</text><text x="336" y="352" class="small muted">容量与表达约束分开</text><text x="336" y="375" class="small muted">位置 / indexer 不可漏算</text><rect x="612" y="273" width="264" height="122" rx="8" fill="#182230" stroke="#344355"/><rect x="612" y="285" width="3" height="98" fill="#e6bf88"/><text x="630" y="303" class="label" font-weight="600">改执行</text><text x="630" y="329" class="small muted">tiling / kernel / 重叠</text><text x="630" y="352" class="small muted">HBM → SRAM → host</text><text x="630" y="375" class="small muted">同语义仍有数值边界</text><rect x="24" y="461" width="405" height="123" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="473" width="3" height="99" fill="#7dc6b2"/><text x="42" y="491" class="label" font-weight="600">同协议质量与延迟</text><text x="42" y="517" class="small muted">固定数据 / prompt / dtype / mask</text><text x="42" y="540" class="small muted">同 batch：TTFT / TPOT / p95</text><text x="42" y="563" class="small muted">前向 / 反向 / 总 step 分列</text><rect x="470" y="461" width="406" height="123" rx="8" fill="#182230" stroke="#344355"/><rect x="470" y="473" width="3" height="99" fill="#e6bf88"/><text x="488" y="491" class="label" font-weight="600">容量与吞吐另列</text><text x="488" y="517" class="small muted">各自最大 N 不等于同 batch</text><text x="488" y="540" class="small muted">GPU / CPU / DMA 峰值分列</text><text x="488" y="563" class="small muted">重叠时测关键路径，不重复加</text><text x="24" y="628" class="small muted">较快 admission 可让 session 更快，却因并发竞争使 TPOT 变差：LeanSparse 的实测例子。</text></svg>