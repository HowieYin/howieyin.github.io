<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 495" role="img" aria-labelledby="svg-f10ccbb7-title svg-f10ccbb7-desc">
<title id="svg-f10ccbb7-title">QKV 的检索直觉与数据流</title><desc id="svg-f10ccbb7-desc">当前问题产生query，历史生成key与value，匹配归一化后聚合，mask控制可访问的位置。</desc>
<defs><marker id="svg-f10ccbb7-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8292a8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#dce4ef} .muted{fill:#9cabc0} .year{fill:#7dc6b2;font-size:17px;font-weight:600} .label{font-size:16px} .small{font-size:14px} .line{stroke:#718299;stroke-width:2;fill:none;marker-end:url(#svg-f10ccbb7-arrow)}</style>
<text x="24" y="36" font-size="22" font-weight="600">问会议在哪：相关性匹配与内容读取是两件事</text><rect x="24" y="100" width="230" height="108" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="112" width="3" height="84" fill="#7dc6b2"/><text x="42" y="130" class="label" font-weight="600">当前问题 → Query</text><text x="42" y="156" class="small muted">会议在哪个房间？</text><text x="42" y="179" class="small muted">投影成查询向量 q</text><rect x="298" y="76" width="270" height="153" rx="8" fill="#182230" stroke="#344355"/><rect x="298" y="88" width="3" height="129" fill="#a7b5ee"/><text x="316" y="106" class="label" font-weight="600">历史 → Keys</text><text x="316" y="132" class="small muted">周三开会 / 地点 A302</text><text x="316" y="155" class="small muted">先准备预算</text><text x="316" y="178" class="small muted">用目录标签与 q 匹配</text><rect x="611" y="76" width="265" height="153" rx="8" fill="#182230" stroke="#344355"/><rect x="611" y="88" width="3" height="129" fill="#7dc6b2"/><text x="629" y="106" class="label" font-weight="600">历史 → Values</text><text x="629" y="132" class="small muted">每条信息的内容向量</text><text x="629" y="155" class="small muted">与 key 对应，但角色不同</text><text x="629" y="178" class="small muted">按权重聚合，而非复制文本</text><rect x="24" y="308" width="230" height="111" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="320" width="3" height="87" fill="#7dc6b2"/><text x="42" y="338" class="label" font-weight="600">分数 + 可见 mask</text><text x="42" y="364" class="small muted">q · k / √d</text><text x="42" y="387" class="small muted">禁止位置不能参与</text><rect x="298" y="308" width="270" height="111" rx="8" fill="#182230" stroke="#344355"/><rect x="298" y="320" width="3" height="87" fill="#a7b5ee"/><text x="316" y="338" class="label" font-weight="600">逐 query 的 softmax</text><text x="316" y="364" class="small muted">一行权重和为 1</text><text x="316" y="387" class="small muted">相近内容可同时读取</text><rect x="611" y="308" width="265" height="111" rx="8" fill="#182230" stroke="#344355"/><rect x="611" y="320" width="3" height="87" fill="#7dc6b2"/><text x="629" y="338" class="label" font-weight="600">读取 → Output</text><text x="629" y="364" class="small muted">权重 × values → o</text><text x="629" y="387" class="small muted">再投影 / 残差 / FFN</text><path d="M139 210V304" class="line"/><path d="M431 231L226 304" class="line"/><path d="M255 365H294" class="line"/><path d="M569 365H607" class="line"/><path d="M744 231V304" class="line"/><text x="24" y="470" class="small muted">Self / cross 描述来源；causal 描述可见性。权重是内部读取分配，不自动成为因果解释。</text></svg>