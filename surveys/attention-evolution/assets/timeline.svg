<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#dce4ef} .muted{fill:#9cabc0} .year{fill:#7dc6b2;font-size:17px;font-weight:600} .label{font-size:16px} .small{font-size:14px} .line{stroke:#718299;stroke-width:2;fill:none;marker-end:url(#svg-31a393eb-arrow)}</style>
<text x="24" y="34" font-size="22" font-weight="600">Attention：连接、状态与执行的并行演进</text><text x="157" y="67" class="small">读取哪些位置</text><text x="402" y="67" class="small">保存什么历史</text><text x="647" y="67" class="small">怎样执行</text><text x="24" y="113" class="year">2014–18</text><rect x="142" y="84" width="230" height="96" rx="8" fill="#182230" stroke="#344355"/><rect x="142" y="96" width="3" height="72" fill="#7dc6b2"/><text x="160" y="114" class="label" font-weight="600">可学习关系</text><text x="160" y="140" class="small muted">Bahdanau / Luong</text><text x="160" y="163" class="small muted">Transformer / Non-local</text><rect x="393" y="84" width="230" height="96" rx="8" fill="#182230" stroke="#344355"/><rect x="393" y="96" width="3" height="72" fill="#a7b5ee"/><text x="411" y="114" class="label" font-weight="600">逐位置状态</text><text x="411" y="140" class="small muted">RNN annotation → Q/K/V</text><text x="411" y="163" class="small muted">通用 self / cross 接口</text><rect x="644" y="84" width="232" height="96" rx="8" fill="#182230" stroke="#344355"/><rect x="644" y="96" width="3" height="72" fill="#e6bf88"/><text x="662" y="114" class="label" font-weight="600">并行计算图</text><text x="662" y="140" class="small muted">RNN 串行 → attention 层</text><text x="662" y="163" class="small muted">生成仍按 token 依赖</text><path d="M257 182V196" class="line"/><path d="M508 182V196" class="line"/><path d="M760 182V196" class="line"/><text x="24" y="229" class="year">2020–21</text><rect x="142" y="200" width="230" height="96" rx="8" fill="#182230" stroke="#344355"/><rect x="142" y="212" width="3" height="72" fill="#7dc6b2"/><text x="160" y="230" class="label" font-weight="600">视觉与长文</text><text x="160" y="256" class="small muted">ViT patch / Longformer</text><text x="160" y="279" class="small muted">RoPE 改匹配几何</text><rect x="393" y="200" width="230" height="96" rx="8" fill="#182230" stroke="#344355"/><rect x="393" y="212" width="3" height="72" fill="#a7b5ee"/><text x="411" y="230" class="label" font-weight="600">核特征统计</text><text x="411" y="256" class="small muted">Performer 随机特征</text><text x="411" y="279" class="small muted">历史汇入有限 S / z</text><rect x="644" y="200" width="232" height="96" rx="8" fill="#182230" stroke="#344355"/><rect x="644" y="212" width="3" height="72" fill="#e6bf88"/><text x="662" y="230" class="label" font-weight="600">复杂度与数据</text><text x="662" y="256" class="small muted">局部 / 全局连接取舍</text><text x="662" y="279" class="small muted">归纳偏置与预训练规模</text><path d="M257 298V312" class="line"/><path d="M508 298V312" class="line"/><path d="M760 298V312" class="line"/><text x="24" y="345" class="year">2022–24</text><rect x="142" y="316" width="230" height="96" rx="8" fill="#182230" stroke="#344355"/><rect x="142" y="328" width="3" height="72" fill="#7dc6b2"/><text x="160" y="346" class="label" font-weight="600">仍可全连接</text><text x="160" y="372" class="small muted">Flash 不删位置关系</text><text x="160" y="395" class="small muted">GQA / MLA 保留历史</text><rect x="393" y="316" width="230" height="96" rx="8" fill="#182230" stroke="#344355"/><rect x="393" y="328" width="3" height="72" fill="#a7b5ee"/><text x="411" y="346" class="label" font-weight="600">共享与 latent</text><text x="411" y="372" class="small muted">GQA 共用 KV heads</text><text x="411" y="395" class="small muted">MLA latent + RoPE key</text><rect x="644" y="316" width="232" height="96" rx="8" fill="#182230" stroke="#344355"/><rect x="644" y="328" width="3" height="72" fill="#e6bf88"/><text x="662" y="346" class="label" font-weight="600">IO 与流水线</text><text x="662" y="372" class="small muted">Flash 1–2 分块 / 分工</text><text x="662" y="395" class="small muted">Flash 3 Hopper 异步</text><path d="M257 414V428" class="line"/><path d="M508 414V428" class="line"/><path d="M760 414V428" class="line"/><text x="24" y="461" class="year">2025</text><rect x="142" y="432" width="230" height="96" rx="8" fill="#182230" stroke="#344355"/><rect x="142" y="444" width="3" height="72" fill="#7dc6b2"/><text x="160" y="462" class=