<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 643" role="img" aria-labelledby="svg-7471fac7-title svg-7471fac7-desc">
<title id="svg-7471fac7-title">候选树和正式KV生命周期</title><desc id="svg-7471fac7-desc">公交接受车拒绝后，后缀弃置，以残差补偿站继续；兄弟路径隔离，临时KV只能提升合法路径。</desc>
<defs><marker id="svg-7471fac7-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8292a8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#dce4ef} .muted{fill:#9cabc0} .year{fill:#7dc6b2;font-size:17px;font-weight:600} .label{font-size:16px} .small{font-size:14px} .line{stroke:#718299;stroke-width:2;fill:none;marker-end:url(#svg-7471fac7-arrow)}</style>
<text x="24" y="36" font-size="22" font-weight="600">候选是一棵树，正式上下文只能沿一条已核验路径</text><rect x="24" y="195" width="170" height="100" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="207" width="3" height="76" fill="#7dc6b2"/><text x="42" y="225" class="label" font-weight="600">正式历史 h</text><text x="42" y="251" class="small muted">他坐在 …</text><text x="42" y="274" class="small muted">已有 KV</text><rect x="260" y="110" width="180" height="90" rx="8" fill="#182230" stroke="#344355"/><rect x="260" y="122" width="3" height="66" fill="#7dc6b2"/><text x="278" y="140" class="label" font-weight="600">公交 ✓</text><text x="278" y="166" class="small muted">第一位置接受</text><rect x="510" y="65" width="175" height="90" rx="8" fill="#182230" stroke="#344355"/><rect x="510" y="77" width="3" height="66" fill="#e6bf88"/><text x="528" y="95" class="label" font-weight="600">车 ✕</text><text x="528" y="121" class="small muted">拒绝后停在这里</text><rect x="730" y="65" width="146" height="90" rx="8" fill="#182230" stroke="#344355"/><rect x="730" y="77" width="3" height="66" fill="#e6bf88"/><text x="748" y="95" class="label" font-weight="600">上（弃置）</text><text x="748" y="121" class="small muted">依赖失败的车</text><rect x="510" y="215" width="175" height="90" rx="8" fill="#182230" stroke="#344355"/><rect x="510" y="227" width="3" height="66" fill="#a7b5ee"/><text x="528" y="245" class="label" font-weight="600">站（另一候选）</text><text x="528" y="271" class="small muted">只读 h + 公交</text><rect x="260" y="340" width="180" height="90" rx="8" fill="#182230" stroke="#344355"/><rect x="260" y="352" width="3" height="66" fill="#a7b5ee"/><text x="278" y="370" class="label" font-weight="600">地铁（兄弟）</text><text x="278" y="396" class="small muted">不与公交交叉读</text><path d="M195 224L256 155" class="line"/><path d="M195 266L256 385" class="line"/><path d="M441 144L506 110" class="line"/><path d="M441 171L506 260" class="line"/><path d="M686 110H726" class="line"/><rect x="24" y="488" width="405" height="124" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="500" width="3" height="100" fill="#7dc6b2"/><text x="42" y="518" class="label" font-weight="600">目标前向：拓扑 mask</text><text x="42" y="544" class="small muted">flatten 次序不等于可见历史</text><text x="42" y="567" class="small muted">每节点只读祖先；position = 深度</text><text x="42" y="590" class="small muted">兄弟节点不能互相 attention</text><rect x="470" y="488" width="406" height="124" rx="8" fill="#182230" stroke="#344355"/><rect x="470" y="500" width="3" height="100" fill="#e6bf88"/><text x="488" y="518" class="label" font-weight="600">提交：h + 公交 + 补偿站</text><text x="488" y="544" class="small muted">只提升接受路径的 KV</text><text x="488" y="567" class="small muted">清理车及其后缀，恢复逻辑长度</text><text x="488" y="590" class="small muted">补偿 token 与候选站不是同一事件</text></svg>