<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 632" role="img" aria-labelledby="svg-267abe67-title svg-267abe67-desc">
<title id="svg-267abe67-title">逐算子与系统成本账</title><desc id="svg-267abe67-desc">区分草稿目标核验采样缓存调度和多请求资源竞争，以真实循环时间计算收益。</desc>
<defs><marker id="svg-267abe67-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8292a8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#dce4ef} .muted{fill:#9cabc0} .year{fill:#7dc6b2;font-size:17px;font-weight:600} .label{font-size:16px} .small{font-size:14px} .line{stroke:#718299;stroke-width:2;fill:none;marker-end:url(#svg-267abe67-arrow)}</style>
<text x="24" y="36" font-size="22" font-weight="600">一次循环的所有成本，除以正式提交的 token</text><rect x="24" y="80" width="405" height="123" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="92" width="3" height="99" fill="#7dc6b2"/><text x="42" y="110" class="label" font-weight="600">普通 decode</text><text x="42" y="136" class="small muted">一次目标前向 → 一个 token</text><text x="42" y="159" class="small muted">attention / MLP / LM head / 通信</text><text x="42" y="182" class="small muted">单位时间 T_AR</text><rect x="470" y="80" width="406" height="123" rx="8" fill="#182230" stroke="#344355"/><rect x="470" y="92" width="3" height="99" fill="#a7b5ee"/><text x="488" y="110" class="label" font-weight="600">投机循环</text><text x="488" y="136" class="small muted">草稿 → 核验 → 采样 → KV → 调度</text><text x="488" y="159" class="small muted">只提交接受前缀 + 补偿 / bonus</text><text x="488" y="182" class="small muted">平均推进 E[A]</text><rect x="24" y="261" width="264" height="120" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="273" width="3" height="96" fill="#e6bf88"/><text x="42" y="291" class="label" font-weight="600">① 草稿</text><text x="42" y="317" class="small muted">层 / head / 串行或块</text><text x="42" y="340" class="small muted">候选也占 KV 与 buffer</text><rect x="318" y="261" width="264" height="120" rx="8" fill="#182230" stroke="#344355"/><rect x="318" y="273" width="3" height="96" fill="#e6bf88"/><text x="336" y="291" class="label" font-weight="600">② 目标核验</text><text x="336" y="317" class="small muted">多位置 attention / MLP</text><text x="336" y="340" class="small muted">TP / MoE 通信与 shape</text><rect x="612" y="261" width="264" height="120" rx="8" fill="#182230" stroke="#344355"/><rect x="612" y="273" width="3" height="96" fill="#e6bf88"/><text x="630" y="291" class="label" font-weight="600">③ 其余关键路径</text><text x="630" y="317" class="small muted">residual / gather / crop</text><text x="630" y="340" class="small muted">调度 / 同步 / graph 桶</text><rect x="24" y="439" width="405" height="122" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="451" width="3" height="98" fill="#7dc6b2"/><text x="42" y="469" class="label" font-weight="600">低并发：可能有空闲算力</text><text x="42" y="495" class="small muted">块核验摊薄权重读取与调用</text><text x="42" y="518" class="small muted">足够接受，才覆盖新增成本</text><text x="42" y="541" class="small muted">TTFT 与 decode 分别测</text><rect x="470" y="439" width="406" height="122" rx="8" fill="#182230" stroke="#344355"/><rect x="470" y="451" width="3" height="98" fill="#a7b5ee"/><text x="488" y="469" class="label" font-weight="600">高负载：竞争同一设备</text><text x="488" y="495" class="small muted">更多节点可能拉低总吞吐</text><text x="488" y="518" class="small muted">全局预算 / SLO / 尾延迟</text><text x="488" y="541" class="small muted">RSS ≠ 物理峰值 ≠ dma-buf</text><path d="M430 141H466" class="line"/><path d="M673 205L156 257" class="line"/><path d="M673 205L450 257" class="line"/><path d="M673 205L744 257" class="line"/><text x="24" y="604" class="small muted">重叠执行时测关键路径，不能重复加时间；更高接受长度不等于更快、更省内存或功耗。</text></svg>