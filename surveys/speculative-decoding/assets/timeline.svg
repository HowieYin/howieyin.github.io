<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#dce4ef} .muted{fill:#9cabc0} .year{fill:#7dc6b2;font-size:17px;font-weight:600} .label{font-size:16px} .small{font-size:14px} .line{stroke:#718299;stroke-width:2;fill:none;marker-end:url(#svg-034eb1c9-arrow)}</style>
<text x="24" y="34" font-size="22" font-weight="600">投机解码：概率正确 → 高价值草稿 → 系统收益</text><text x="158" y="65" class="small">怎样更便宜地猜</text><text x="402" y="65" class="small">怎样合法地验</text><text x="646" y="65" class="small">怎样真的更快</text><text x="24" y="112" class="year">2018</text><rect x="144" y="82" width="230" height="91" rx="8" fill="#182230" stroke="#344355"/><rect x="144" y="94" width="3" height="67" fill="#7dc6b2"/><text x="162" y="112" class="label" font-weight="600">多位置预测</text><text x="162" y="138" class="small muted">Blockwise 预测头</text><text x="162" y="161" class="small muted">减少目标串行轮数</text><rect x="394" y="82" width="230" height="91" rx="8" fill="#182230" stroke="#344355"/><rect x="394" y="94" width="3" height="67" fill="#a7b5ee"/><text x="412" y="112" class="label" font-weight="600">贪心前缀核验</text><text x="412" y="138" class="small muted">遇到首个不同就停止</text><text x="412" y="161" class="small muted">评分模型决定提交</text><rect x="644" y="82" width="232" height="91" rx="8" fill="#182230" stroke="#344355"/><rect x="644" y="94" width="3" height="67" fill="#e6bf88"/><text x="662" y="112" class="label" font-weight="600">初始成本问题</text><text x="662" y="138" class="small muted">块压缩 ≠ 墙钟速度</text><text x="662" y="161" class="small muted">训练与目标变化须分开</text><path d="M375 127H390" class="line"/><path d="M625 127H640" class="line"/><path d="M258 174V188" class="line"/><path d="M508 174V188" class="line"/><path d="M760 174V188" class="line"/><text x="24" y="222" class="year">2022–23</text><rect x="144" y="192" width="230" height="91" rx="8" fill="#182230" stroke="#344355"/><rect x="144" y="204" width="3" height="67" fill="#7dc6b2"/><text x="162" y="222" class="label" font-weight="600">便宜模型提议</text><text x="162" y="248" class="small muted">独立小模型 / 蒸馏</text><text x="162" y="271" class="small muted">只需接近目标分布</text><rect x="394" y="192" width="230" height="91" rx="8" fill="#182230" stroke="#344355"/><rect x="394" y="204" width="3" height="67" fill="#a7b5ee"/><text x="412" y="222" class="label" font-weight="600">精确随机采样</text><text x="412" y="248" class="small muted">接受 min(1,p/q)</text><text x="412" y="271" class="small muted">拒绝后正残差补偿</text><rect x="644" y="192" width="232" height="91" rx="8" fill="#182230" stroke="#344355"/><rect x="644" y="204" width="3" height="67" fill="#e6bf88"/><text x="662" y="222" class="label" font-weight="600">收益模型</text><text x="662" y="248" class="small muted">接受长度 / 草稿耗时</text><text x="662" y="271" class="small muted">任务、温度、长度调优</text><path d="M375 237H390" class="line"/><path d="M625 237H640" class="line"/><path d="M258 284V298" class="line"/><path d="M508 284V298" class="line"/><path d="M760 284V298" class="line"/><text x="24" y="332" class="year">2023–24</text><rect x="144" y="302" width="230" height="91" rx="8" fill="#182230" stroke="#344355"/><rect x="144" y="314" width="3" height="67" fill="#7dc6b2"/><text x="162" y="332" class="label" font-weight="600">多头 / 跳层 / 特征</text><text x="162" y="358" class="small muted">Medusa / EAGLE</text><text x="162" y="381" class="small muted">Lookahead / LayerSkip</text><rect x="394" y="302" width="230" height="91" rx="8" fill="#182230" stroke="#344355"/><rect x="394" y="314" width="3" height="67" fill="#a7b5ee"/><text x="412" y="332" class="label" font-weight="600">树与缓存语义</text><text x="412" y="358" class="small muted">SpecInfer / EAGLE-2</text><text x="412" y="381" class="small muted">路径因果 mask + 回滚</text><rect x="644" y="302" width="232" height="91" rx="8" fill="#182230" stroke="#344355"/><rect x="644" y="314" width="3" height="67" fill="#e6bf88"/><text x="662" y="332" class="label" font-weight="600">形状与复用</text><text x="662" y="358" class="small muted">动态树分配候选预算</text><text x="662" y="381" class="small muted">低层共享须匹配训练</text><path d="M375 347H390" class="line"/><path d="M625 347H640" class="line"/><path d="M258 394V408" class="line"/><path d="M508 394V408" class="line"/><path d="M760 394V408" class="line"/><text x="24" y="442" class="year">2025</text><rect x="144" y="412" width="230" height="91" rx="8" fill="#182230" stroke="#344355"/><rect x="144" y="424" width="3" height="67" fill="#7dc6b2"/><text x="162" y="442" class="label" font-weight="600">训练时 rollout</text><text x="162" y="468" class="small muted">EAGLE-3 多层融合</text><text x="162" y="491" class="small muted">修正训练—推理失配</text><rect x="394" y="412" width="230" height="91" rx="8" fill="#182230" stroke="#344355"/><rect x="394" y="424" width="3" height="67" fill="#a7b5ee"/><text x="412" y="442" class="label" font-weight="600">目标质量责任</text><text x="412" y="468" class="small muted">草稿可以改变</text><text x="412" y="491" class="small muted">验证与 sampler 保持边界</text><rect x="644" y="412" width="232" height="91" rx="8" fill="#182230" stroke="#344355"/><rect x="644" y="424" width="3" height="67" fill="#e6bf88"/><text x="662" y="442" class="label" font-weight="600">规模与服务差异</text><text x="662" y="468" class="small muted">更多训练数据有成本</text><text x="662" y="491" class="small muted">batch 1 ≠ 服务容量</text><path d="M375 457H390" class="line"/><path d="M625 457H640" class="line"/><path d="M258 504V518" class="line"/><path d="M508 504V518" class="line"/><path d="M760 504V518" class="line"/><text x="24" y="552" class="year">2026</text><rect x="144" y="522" width="230" height="91" rx="8" fill="#182230" stroke="#344355"/><rect x="144" y="534" width="3" height="67" fill="#7dc6b2"/><text x="162" y="552" class="label" font-weight="600">并行块与词表头</text><text x="162" y="578" class="small muted">DFlash 单次块草稿</text><text x="162" y="601" class="small muted">EAGLE-4 低秩候选</text><rect x="394" y="522" width="230" height="91" rx="8" fill="#182230" stroke="#344355"/><rect x="394" y="534" width="3" height="67" fill="#a7b5ee"/><text x="412" y="552" class="label" font-weight="600">数值与执行边界</text><text x="412" y="578" class="small muted">不同 shape 可能漂移</text><text x="412" y="601" class="small muted">停止 / KV / 取消生命周期</text><rect x="644" y="522" width="232" height="91" rx="8" fill="#182230" stroke="#344355"/><rect x="644" y="534" width="3" height="67" fill="#e6bf88"/><text x="662" y="552" class="label" font-weight="600">全局预算与 SLO</text><text x="662" y="578" class="small muted">ForeSpark 联合调度</text><text x="662" y="601" class="small muted">真实负载 / 长文本 / 手机</text><path d="M375 567H390" class="line"/><path d="M625 567H640" class="line"/><text x="24" y="660" class="small muted">三条路线持续并存，箭头表示问题衔接；论文和工程披露时间分别核对。截止 2026-11-16。</text></svg>