<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 475" role="img" aria-labelledby="svg-64394202-title svg-64394202-desc">
<title id="svg-64394202-title">精确拒绝采样的概率流</title><desc id="svg-64394202-desc">三词目标与草稿例子，重叠质量接受，正残差补偿，恢复目标分布。</desc>
<defs><marker id="svg-64394202-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8292a8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#dce4ef} .muted{fill:#9cabc0} .year{fill:#7dc6b2;font-size:17px;font-weight:600} .label{font-size:16px} .small{font-size:14px} .line{stroke:#718299;stroke-width:2;fill:none;marker-end:url(#svg-64394202-arrow)}</style>
<text x="24" y="36" font-size="22" font-weight="600">拒绝后补回缺少的质量，最终仍是目标分布</text><rect x="24" y="84" width="260" height="123" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="96" width="3" height="99" fill="#7dc6b2"/><text x="42" y="114" class="label" font-weight="600">目标 p</text><text x="42" y="140" class="small muted">A 0.50 / B 0.30 / C 0.20</text><text x="42" y="163" class="small muted">希望输出的完整份额</text><text x="42" y="186" class="small muted">历史 h 必须相同</text><rect x="318" y="84" width="260" height="123" rx="8" fill="#182230" stroke="#344355"/><rect x="318" y="96" width="3" height="99" fill="#a7b5ee"/><text x="336" y="114" class="label" font-weight="600">草稿 q</text><text x="336" y="140" class="small muted">A 0.20 / B 0.50 / C 0.30</text><text x="336" y="163" class="small muted">先抽候选，再按 p/q 接受</text><text x="336" y="186" class="small muted">平均拒绝概率 0.30</text><rect x="612" y="84" width="264" height="123" rx="8" fill="#182230" stroke="#344355"/><rect x="612" y="96" width="3" height="99" fill="#7dc6b2"/><text x="630" y="114" class="label" font-weight="600">接受质量 min(p,q)</text><text x="630" y="140" class="small muted">A 0.20 / B 0.30 / C 0.20</text><text x="630" y="163" class="small muted">草稿多给的部分被拒绝</text><text x="630" y="186" class="small muted">这些质量已进入最终输出</text><rect x="24" y="276" width="405" height="132" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="288" width="3" height="108" fill="#e6bf88"/><text x="42" y="306" class="label" font-weight="600">正残差 [p−q]₊</text><text x="42" y="332" class="small muted">A 缺 0.30；B / C 不再补</text><text x="42" y="355" class="small muted">条件残差 r = (1,0,0)</text><text x="42" y="378" class="small muted">拒绝事件的质量全补给 A</text><rect x="470" y="276" width="406" height="132" rx="8" fill="#182230" stroke="#344355"/><rect x="470" y="288" width="3" height="108" fill="#7dc6b2"/><text x="488" y="306" class="label" font-weight="600">接受 + 补偿 = p</text><text x="488" y="332" class="small muted">A 0.50 / B 0.30 / C 0.20</text><text x="488" y="355" class="small muted">不能拒绝后直接从 p 重采样</text><text x="488" y="378" class="small muted">同 seed 不要求同字符串</text><path d="M285 145H314" class="line"/><path d="M579 145H608" class="line"/><path d="M744 209L225 272" class="line"/><path d="M430 342H466" class="line"/><text x="24" y="450" class="small muted">单位置概率流；序列精确性还需要目标核验使用候选路径历史，并丢弃失败后的状态。</text></svg>