<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 632" role="img" aria-label="CNN 的发展：共享特征，分别解决识别、空间和部署问题"><style>text{font-family:system-ui,sans-serif;fill:#e3eaf3}.small{font-size:14px;fill:#a8b8cc}.head{font-size:16px;fill:#9be0c0}</style><rect width="1000" height="632" rx="12" fill="#111821"/><text x="28" y="37" font-size="22" font-weight="600">CNN 的发展：共享特征，分别解决识别、空间和部署问题</text><text x="155" y="80" class="head">特征骨干</text><text x="430" y="80" class="head">任务与输出</text><text x="705" y="80" class="head">算子与工程</text><text x="26" y="139" font-size="15">1998–2014</text><rect x="140" y="105" width="258" height="107" rx="6" fill="#1a2634" stroke="#405368"/><text x="152" y="132" font-size="16" font-weight="600">LeNet → Alex / VGG</text><text x="152" y="160" class="small">局部共享 → 数据与深度</text><text x="152" y="187" class="small">分类成为通用特征的训练入口</text><rect x="415" y="105" width="258" height="107" rx="6" fill="#1a2634" stroke="#405368"/><text x="427" y="132" font-size="16" font-weight="600">分类 → 检测与定位</text><text x="427" y="160" class="small">图像标签不能表达坐标</text><text x="427" y="187" class="small">检测框、热图与像素图需要新头</text><rect x="690" y="105" width="258" height="107" rx="6" fill="#1a2634" stroke="#405368"/><text x="702" y="132" font-size="16" font-weight="600">Inception</text><text x="702" y="160" class="small">并行尺度 + 1×1 压缩</text><text x="702" y="187" class="small">计算预算成为结构约束</text><text x="26" y="267" font-size="15">2015–2019</text><rect x="140" y="233" width="258" height="107" rx="6" fill="#1a2634" stroke="#405368"/><text x="152" y="260" font-size="16" font-weight="600">ResNet / DenseNet / SE</text><text x="152" y="288" class="small">残差、复用与通道选择</text><text x="152" y="315" class="small">深度更可训练，特征更可迁移</text><rect x="415" y="233" width="258" height="107" rx="6" fill="#1a2634" stroke="#405368"/><text x="427" y="260" font-size="16" font-weight="600">FPN / HRNet / U-Net</text><text x="427" y="288" class="small">融合语义与空间细节</text><text x="427" y="315" class="small">小目标、关键点、边界各有需求</text><rect x="690" y="233" width="258" height="107" rx="6" fill="#1a2634" stroke="#405368"/><text x="702" y="260" font-size="16" font-weight="600">MobileNet / EfficientNet</text><text x="702" y="288" class="small">可分离卷积与复合缩放</text><text x="702" y="315" class="small">MACs 降低 ≠ 所有硬件更快</text><text x="26" y="395" font-size="15">2021–2024</text><rect x="140" y="361" width="258" height="107" rx="6" fill="#1a2634" stroke="#405368"/><text x="152" y="388" font-size="16" font-weight="600">ConvNeXt / V2 / UniRep</text><text x="152" y="416" class="small">现代配方、GRN、大卷积核</text><text x="152" y="443" class="small">架构与预训练要一起比较</text><rect x="415" y="361" width="258" height="107" rx="6" fill="#1a2634" stroke="#405368"/><text x="427" y="388" font-size="16" font-weight="600">FCOS → YOLOv10 / RTMPose</text><text x="427" y="416" class="small">样本分配、输出编码、去重</text><text x="427" y="443" class="small">任务收益未必来自更强 backbone</text><rect x="690" y="361" width="258" height="107" rx="6" fill="#1a2634" stroke="#405368"/><text x="702" y="388" font-size="16" font-weight="600">RepVGG / RepViT / MobileV4</text><text x="702" y="416" class="small">重参数化与硬件感知搜索</text><text x="702" y="443" class="small">训练图、部署图和硬件分开核对</text><text x="26" y="523" font-size="15">2025–2026</text><rect x="140" y="489" width="258" height="107" rx="6" fill="#1a2634" stroke="#405368"/><text x="152" y="516" font-size="16" font-weight="600">DINOv3 CNN 蒸馏 / PolyNeXt</text><text x="152" y="544" class="small">大教师迁移 / 多项式结构探索</text><text x="152" y="571" class="small">纯 CNN、混合模型与训练区分</text><rect x="415" y="489" width="258" height="107" rx="6" fill="#1a2634" stroke="#405368"/><text x="427" y="516" font-size="16" font-weight="600">YOLO26 软件 + 多任务头</text><text x="427" y="544" class="small">当前工程路线的可核验例子</text><text x="427" y="571" class="small">各 benchmark 保留独立协议</text><rect x="690" y="489" width="258" height="107" rx="6" fill="#1a2634" stroke="#405368"/><text x="702" y="516" font-size="16" font-weight="600">布局 / 量化 / 常驻运行</text><text x="702" y="544" class="small">真正的端上链路与内存证据</text><text x="702" y="571" class="small">最终指标是精度、延迟与峰值</text></svg>