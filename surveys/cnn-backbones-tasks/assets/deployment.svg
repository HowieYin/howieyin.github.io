<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 376" role="img" aria-label="部署核对：从训练参数到业务输出的四道边界"><style>text{font-family:system-ui,sans-serif;fill:#e3eaf3}.small{font-size:14px;fill:#a8b8cc}.head{font-size:16px;fill:#9be0c0}</style><rect width="1000" height="376" rx="12" fill="#111821"/><text x="28" y="37" font-size="22" font-weight="600">部署核对：从训练参数到业务输出的四道边界</text><text x="155" y="80" class="head">参数与数值</text><text x="430" y="80" class="head">算子与内存</text><text x="705" y="80" class="head">完整链路</text><text x="26" y="139" font-size="15">图变换</text><rect x="140" y="105" width="258" height="107" rx="6" fill="#1a2634" stroke="#405368"/><text x="152" y="132" font-size="16" font-weight="600">训练图 → 等价部署图</text><text x="152" y="160" class="small">BN folding、RepVGG 分支合并</text><text x="152" y="187" class="small">eval 统计固定，逐层数值对照</text><rect x="415" y="105" width="258" height="107" rx="6" fill="#1a2634" stroke="#405368"/><text x="427" y="132" font-size="16" font-weight="600">浮点 → 量化图</text><text x="427" y="160" class="small">标定范围、粒度与饱和</text><text x="427" y="187" class="small">真实样本覆盖 + 中间 tensor 误差</text><rect x="690" y="105" width="258" height="107" rx="6" fill="#1a2634" stroke="#405368"/><text x="702" y="132" font-size="16" font-weight="600">Tensor → 硬件映射</text><text x="702" y="160" class="small">NCHW / NHWC、内存步幅</text><text x="702" y="187" class="small">名称、shape、stride 与量化轴一致</text><text x="26" y="267" font-size="15">业务链</text><rect x="140" y="233" width="258" height="107" rx="6" fill="#1a2634" stroke="#405368"/><text x="152" y="260" font-size="16" font-weight="600">输入与调度</text><text x="152" y="288" class="small">缓冲生命周期、队列、超时</text><text x="152" y="315" class="small">常驻 runner 分开冷启动与执行</text><rect x="415" y="233" width="258" height="107" rx="6" fill="#1a2634" stroke="#405368"/><text x="427" y="260" font-size="16" font-weight="600">实际后处理</text><text x="427" y="288" class="small">NMS、关键点解码、坐标还原</text><text x="427" y="315" class="small">有效结果随异常恢复一起验证</text><rect x="690" y="233" width="258" height="107" rx="6" fill="#1a2634" stroke="#405368"/><text x="702" y="260" font-size="16" font-weight="600">性能与内存</text><text x="702" y="288" class="small">per-op、拷贝、峰值物理占用</text><text x="702" y="315" class="small">目标设备实测才能称端上收益</text></svg>