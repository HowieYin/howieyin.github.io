<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 504" role="img" aria-label="从一张图到任务结果：每一步都有独立的责任"><style>text{font-family:system-ui,sans-serif;fill:#e3eaf3}.small{font-size:14px;fill:#a8b8cc}.head{font-size:16px;fill:#9be0c0}</style><rect width="1000" height="504" rx="12" fill="#111821"/><text x="28" y="37" font-size="22" font-weight="600">从一张图到任务结果：每一步都有独立的责任</text><text x="155" y="80" class="head">表示</text><text x="430" y="80" class="head">空间推理</text><text x="705" y="80" class="head">结果与条件</text><text x="26" y="139" font-size="15">① 输入</text><rect x="140" y="105" width="258" height="107" rx="6" fill="#1a2634" stroke="#405368"/><text x="152" y="132" font-size="16" font-weight="600">解码与预处理</text><text x="152" y="160" class="small">RGB、归一化、resize / pad</text><text x="152" y="187" class="small">记录坐标变换与真实 tensor 布局</text><rect x="415" y="105" width="258" height="107" rx="6" fill="#1a2634" stroke="#405368"/><text x="427" y="132" font-size="16" font-weight="600">Backbone 多尺度特征</text><text x="427" y="160" class="small">C2 / C3 / C4 / C5</text><text x="427" y="187" class="small">stride 决定可分辨的空间尺度</text><rect x="690" y="105" width="258" height="107" rx="6" fill="#1a2634" stroke="#405368"/><text x="702" y="132" font-size="16" font-weight="600">Neck 跨尺度融合</text><text x="702" y="160" class="small">FPN 上采样 + 横向连接</text><text x="702" y="187" class="small">高层语义与低层细节相遇</text><text x="26" y="267" font-size="15">② 输出</text><rect x="140" y="233" width="258" height="107" rx="6" fill="#1a2634" stroke="#405368"/><text x="152" y="260" font-size="16" font-weight="600">分类 / 人脸表征</text><text x="152" y="288" class="small">pool → logits / embedding</text><text x="152" y="315" class="small">一张图一个类别或一个向量</text><rect x="415" y="233" width="258" height="107" rx="6" fill="#1a2634" stroke="#405368"/><text x="427" y="260" font-size="16" font-weight="600">检测 / landmark</text><text x="427" y="288" class="small">box + class / heatmap / SimCC</text><text x="427" y="315" class="small">候选分配、坐标解码和 NMS</text><rect x="690" y="233" width="258" height="107" rx="6" fill="#1a2634" stroke="#405368"/><text x="702" y="260" font-size="16" font-weight="600">语义 / 实例分割</text><text x="702" y="288" class="small">pixel classes / per-object mask</text><text x="702" y="315" class="small">类别、实例归属与边界对齐</text><text x="26" y="395" font-size="15">③ 验证</text><rect x="140" y="361" width="258" height="107" rx="6" fill="#1a2634" stroke="#405368"/><text x="152" y="388" font-size="16" font-weight="600">任务精度</text><text x="152" y="416" class="small">Top-1 / AP / OKS / NME / mIoU</text><text x="152" y="443" class="small">匹配规则与数据划分先固定</text><rect x="415" y="361" width="258" height="107" rx="6" fill="#1a2634" stroke="#405368"/><text x="427" y="388" font-size="16" font-weight="600">运行时性能</text><text x="427" y="416" class="small">算子耗时 + 拷贝 + 后处理</text><text x="427" y="443" class="small">batch、精度、硬件和线程要固定</text><rect x="690" y="361" width="258" height="107" rx="6" fill="#1a2634" stroke="#405368"/><text x="702" y="388" font-size="16" font-weight="600">闭环结果</text><text x="702" y="416" class="small">文字、坐标、类别、掩码</text><text x="702" y="443" class="small">数值接近与业务语义同时成立</text></svg>