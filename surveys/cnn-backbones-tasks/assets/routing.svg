<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 376" role="img" aria-label="关键点与分割：低分辨率语义怎样回到正确位置"><style>text{font-family:system-ui,sans-serif;fill:#e3eaf3}.small{font-size:14px;fill:#a8b8cc}.head{font-size:16px;fill:#9be0c0}</style><rect width="1000" height="376" rx="12" fill="#111821"/><text x="28" y="37" font-size="22" font-weight="600">关键点与分割：低分辨率语义怎样回到正确位置</text><text x="155" y="80" class="head">保存位置</text><text x="430" y="80" class="head">聚合上下文</text><text x="705" y="80" class="head">解码与实例归属</text><text x="26" y="139" font-size="15">热图</text><rect x="140" y="105" width="258" height="107" rx="6" fill="#1a2634" stroke="#405368"/><text x="152" y="132" font-size="16" font-weight="600">Hourglass</text><text x="152" y="160" class="small">下采样 → 上采样 + skip</text><text x="152" y="187" class="small">多阶段预测修正局部误差</text><rect x="415" y="105" width="258" height="107" rx="6" fill="#1a2634" stroke="#405368"/><text x="427" y="132" font-size="16" font-weight="600">HRNet</text><text x="427" y="160" class="small">高分辨率分支持续保留</text><text x="427" y="187" class="small">反复跨尺度交换语义</text><rect x="690" y="105" width="258" height="107" rx="6" fill="#1a2634" stroke="#405368"/><text x="702" y="132" font-size="16" font-weight="600">RTMPose</text><text x="702" y="160" class="small">x / y 一维坐标分布</text><text x="702" y="187" class="small">解码更细，不等同于 2D 热图</text><text x="26" y="267" font-size="15">分割</text><rect x="140" y="233" width="258" height="107" rx="6" fill="#1a2634" stroke="#405368"/><text x="152" y="260" font-size="16" font-weight="600">FCN / U-Net</text><text x="152" y="288" class="small">粗特征与浅层细节融合</text><text x="152" y="315" class="small">上采样不足以恢复已丢失细节</text><rect x="415" y="233" width="258" height="107" rx="6" fill="#1a2634" stroke="#405368"/><text x="427" y="260" font-size="16" font-weight="600">DeepLabv3+ / SegNeXt</text><text x="427" y="288" class="small">空洞多尺度 / 卷积注意力</text><text x="427" y="315" class="small">感受野、边界与上下文折中</text><rect x="690" y="233" width="258" height="107" rx="6" fill="#1a2634" stroke="#405368"/><text x="702" y="260" font-size="16" font-weight="600">Mask R-CNN / YOLACT</text><text x="702" y="288" class="small">对齐 RoI / 原型线性组合</text><text x="702" y="315" class="small">实例分开与像素分类不同</text></svg>