<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 686" role="img" aria-labelledby="svg-54adacd7-title svg-54adacd7-desc">
<title id="svg-54adacd7-title">MoE专家预测与预取发展总览</title><desc id="svg-54adacd7-desc">2023至2026年，未来路线来源、按时加载和模型系统代价三条并行演进路线。</desc>
<defs><marker id="svg-54adacd7-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8292a8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#dce4ef} .muted{fill:#9cabc0} .year{fill:#7dc6b2;font-size:17px;font-weight:600} .label{font-size:16px} .small{font-size:14px} .line{stroke:#718299;stroke-width:2;fill:none;marker-end:url(#svg-54adacd7-arrow)}</style>
<text x="24" y="34" font-size="22" font-weight="600">专家预取：从早知道，到按时到，再到可安全执行</text><text x="146" y="68" class="small">未来路线从哪里来</text><text x="393" y="68" class="small">权重怎样按时到达</text><text x="640" y="68" class="small">模型与系统的代价</text><text x="24" y="118" class="year">2023</text><rect x="142" y="88" width="232" height="114" rx="8" fill="#182230" stroke="#344355"/><rect x="142" y="100" width="3" height="90" fill="#7dc6b2"/><text x="160" y="118" class="label" font-weight="600">前移 / 邻层猜测</text><text x="160" y="144" class="small muted">Pre-gated：训练早 gate</text><text x="160" y="167" class="small muted">Mix-Offload：残差流启发</text><rect x="393" y="88" width="232" height="114" rx="8" fill="#182230" stroke="#344355"/><rect x="393" y="100" width="3" height="90" fill="#a7b5ee"/><text x="411" y="118" class="label" font-weight="600">只搬选中专家</text><text x="411" y="144" class="small muted">计算与 CPU→GPU 重叠</text><text x="411" y="167" class="small muted">LRU + 正式 demand fallback</text><rect x="644" y="88" width="232" height="114" rx="8" fill="#182230" stroke="#344355"/><rect x="644" y="100" width="3" height="90" fill="#e6bf88"/><text x="662" y="118" class="label" font-weight="600">首次区分语义</text><text x="662" y="144" class="small muted">新路由 vs 原路由不变</text><text x="662" y="167" class="small muted">位宽 / 缓存也决定容量</text><path d="M258 204V222" class="line"/><path d="M509 204V222" class="line"/><path d="M760 204V222" class="line"/><text x="24" y="255" class="year">2024</text><rect x="142" y="225" width="232" height="114" rx="8" fill="#182230" stroke="#344355"/><rect x="142" y="237" width="3" height="90" fill="#7dc6b2"/><text x="160" y="255" class="label" font-weight="600">历史 / 学习 / 独立 router</text><text x="160" y="281" class="small muted">Infinity / ProMoE</text><text x="160" y="304" class="small muted">ExpertFlow / Read-ME</text><rect x="393" y="225" width="232" height="114" rx="8" fill="#182230" stroke="#344355"/><rect x="393" y="237" width="3" height="90" fill="#a7b5ee"/><text x="411" y="255" class="label" font-weight="600">缓存与 token / queue 联动</text><text x="411" y="281" class="small muted">Fiddler：真实 CPU 计算</text><text x="411" y="304" class="small muted">ProMoE：分块 + demand 升级</text><rect x="644" y="225" width="232" height="114" rx="8" fill="#182230" stroke="#344355"/><rect x="644" y="237" width="3" height="90" fill="#e6bf88"/><text x="662" y="255" class="label" font-weight="600">开始交换质量与成本</text><text x="662" y="281" class="small muted">Adap / HOBBIT 少算或低精度</text><text x="662" y="304" class="small muted">DAOP 提前输入预计算</text><path d="M258 341V359" class="line"/><path d="M509 341V359" class="line"/><path d="M760 341V359" class="line"/><text x="24" y="392" class="year">2025</text><rect x="142" y="362" width="232" height="114" rx="8" fill="#182230" stroke="#344355"/><rect x="142" y="374" width="3" height="90" fill="#7dc6b2"/><text x="160" y="392" class="label" font-weight="600">输入时机 / draft 窗口</text><text x="160" y="418" class="small muted">Fate / Pre-Attention</text><text x="160" y="441" class="small muted">SP-MoE：draft→target gate</text><rect x="393" y="362" width="232" height="114" rx="8" fill="#182230" stroke="#344355"/><rect x="393" y="374" width="3" height="90" fill="#a7b5ee"/><text x="411" y="392" class="label" font-weight="600">跨层、多批次调度</text><text x="411" y="418" class="small muted">LayerScope：CPU/GPU 分工</text><text x="411" y="441" class="small muted">及时性比 raw hit 更关键</text><rect x="644" y="362" width="232" height="114" rx="8" fill="#182230" stroke="#344355"/><rect x="644" y="374" width="3" height="90" fill="#e6bf88"/><text x="662" y="392" class="label" font-weight="600">短窗口与评测分母</text><text x="662" y="418" class="small muted">约 1ms attention 不够搬全部</text><text x="662" y="441" class="small muted">token / union / ranking 分开</text><path d="M258 478V496" class="line"/><path d="M509 478V496" class="line"/><path d="M760 478V496" class="line"/><text x="24" y="529" class="year">2026</text><rect x="142" y="499" width="232" height="114" rx="8" fill="#182230" stroke="#344355"/><rect x="142" y="511" width="3" height="90" fill="#7dc6b2"/><text x="160" y="529" class="label" font-weight="600">序列 / 训练 locality</text><text x="160" y="555" class="small muted">SeqMoE 跨 token / 八步</text><text x="160" y="578" class="small muted">Sticky / Stepped 段级计划</text><rect x="393" y="499" width="232" height="114" rx="8" fill="#182230" stroke="#344355"/><rect x="393" y="511" width="3" height="90" fill="#a7b5ee"/><text x="411" y="529" class="label" font-weight="600">静态图 / phase / 带宽</text><text x="411" y="555" class="small muted">SeqMoE TAG / PDScope</text><text x="411" y="578" class="small muted">FreeToken：实测带宽分配</text><rect x="644" y="499" width="232" height="114" rx="8" fill="#182230" stroke="#344355"/><rect x="644" y="511" width="3" height="90" fill="#e6bf88"/><text x="662" y="529" class="label" font-weight="600">SSD 与近似边界</text><text x="662" y="555" class="small muted">Edge0 新路由 / SPICE surrogate</text><text x="662" y="578" class="small muted">Roofline：oracle 也可能无益</text><text x="24" y="658" class="small muted">并行路线会融合；不是单线替代史。边界：质量、窗口、总字节与生命周期。截止 2026-11-16。</text></svg>