<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" role="img" aria-labelledby="svg-5b93dea9-title svg-5b93dea9-desc">
<title id="svg-5b93dea9-title">预取截止时间与通道阻塞</title><desc id="svg-5b93dea9-desc">教学时序中不可中断的错误拷贝挡住真实需求，正确预测也可能晚到，分块及升级减少阻塞但总字节仍有限。</desc>
<defs><marker id="svg-5b93dea9-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8292a8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#dce4ef} .muted{fill:#9cabc0} .year{fill:#7dc6b2;font-size:17px;font-weight:600} .label{font-size:16px} .small{font-size:14px} .line{stroke:#718299;stroke-width:2;fill:none;marker-end:url(#svg-5b93dea9-arrow)}</style>
<text x="24" y="36" font-size="22" font-weight="600">窗口之外，还要检查通道占用和真实 deadline</text><text x="26" y="90" class="small">教学时序：不是 GPU 实测</text><path d="M190 108V346" stroke="#263645"/><text x="185" y="375" class="small">0</text><path d="M322 108V346" stroke="#263645"/><text x="317" y="375" class="small">1</text><path d="M586 108V346" stroke="#263645"/><text x="581" y="375" class="small">3</text><path d="M850 108V346" stroke="#263645"/><text x="845" y="375" class="small">5</text><text x="24" y="145" class="small">远期错误 copy</text><rect x="190" y="121" width="528" height="44" rx="5" fill="#5c4930"/><text x="205" y="149" class="small">整块已经开始，不能随时中断</text><text x="24" y="234" class="small">真实 demand</text><path d="M322 189V264" stroke="#e6bf88" stroke-width="3"/><text x="337" y="231" class="small">到来 → 被在途 copy 挡住</text><text x="24" y="322" class="small">截止时间</text><path d="M586 279V346" stroke="#a7b5ee" stroke-width="3"/><text x="602" y="319" class="small">晚到，即使预测对也要等待</text><rect x="24" y="427" width="405" height="137" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="439" width="3" height="113" fill="#7dc6b2"/><text x="42" y="457" class="label" font-weight="600">改善：更早 + 分块 + 升级</text><text x="42" y="483" class="small muted">在块边界先处理真实 demand</text><text x="42" y="506" class="small muted">限制错误远期队列 / 保护槽位</text><text x="42" y="529" class="small muted">不是在 DMA 中途硬件抢占</text><rect x="470" y="427" width="406" height="137" rx="8" fill="#182230" stroke="#344355"/><rect x="470" y="439" width="3" height="113" fill="#e6bf88"/><text x="488" y="457" class="label" font-weight="600">硬边界：总 bytes/token</text><text x="488" y="483" class="small muted">100MB / 20GB/s ≈ 5ms</text><text x="488" y="506" class="small muted">1ms attention 单独藏不住</text><text x="488" y="529" class="small muted">持续饱和时 oracle 也无益</text></svg>