<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 541" role="img" aria-labelledby="svg-e4d2cfaa-title svg-e4d2cfaa-desc">
<title id="svg-e4d2cfaa-title">固定槽位的世代与异步完成</title><desc id="svg-e4d2cfaa-desc">专家槽位从空到加载再重用，晚到旧事件必须核对generation拒绝更新，新事件才可宣布ready。</desc>
<defs><marker id="svg-e4d2cfaa-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8292a8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#dce4ef} .muted{fill:#9cabc0} .year{fill:#7dc6b2;font-size:17px;font-weight:600} .label{font-size:16px} .small{font-size:14px} .line{stroke:#718299;stroke-width:2;fill:none;marker-end:url(#svg-e4d2cfaa-arrow)}</style>
<text x="24" y="36" font-size="22" font-weight="600">固定 graph 地址，动态专家映射：完成事件必须核对世代</text><rect x="24" y="95" width="264" height="128" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="107" width="3" height="104" fill="#7dc6b2"/><text x="42" y="125" class="label" font-weight="600">EMPTY</text><text x="42" y="151" class="small muted">固定 slot 地址</text><text x="42" y="174" class="small muted">尚无有效专家</text><path d="M290 159H314" class="line"/><rect x="318" y="95" width="264" height="128" rx="8" fill="#182230" stroke="#344355"/><rect x="318" y="107" width="3" height="104" fill="#7dc6b2"/><text x="336" y="125" class="label" font-weight="600">FETCH / tag 41</text><text x="336" y="151" class="small muted">为 expert 7 发起 copy</text><text x="336" y="174" class="small muted">event 携带 tag 41</text><path d="M584 159H608" class="line"/><rect x="612" y="95" width="264" height="128" rx="8" fill="#182230" stroke="#344355"/><rect x="612" y="107" width="3" height="104" fill="#a7b5ee"/><text x="630" y="125" class="label" font-weight="600">REUSED / tag 42</text><text x="630" y="151" class="small muted">取消 / 释放后重用</text><text x="630" y="174" class="small muted">现在属于 expert 19</text><rect x="24" y="310" width="405" height="136" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="322" width="3" height="112" fill="#e6bf88"/><text x="42" y="340" class="label" font-weight="600">旧 event：tag 41 晚完成</text><text x="42" y="366" class="small muted">slot expected = 42，拒绝更新</text><text x="42" y="389" class="small muted">不能把 expert 19 标为 expert 7</text><text x="42" y="412" class="small muted">旧 completion 不得宣布 ready</text><rect x="470" y="310" width="406" height="136" rx="8" fill="#182230" stroke="#344355"/><rect x="470" y="322" width="3" height="112" fill="#7dc6b2"/><text x="488" y="340" class="label" font-weight="600">新 event：tag 42 完成</text><text x="488" y="366" class="small muted">weight / scale / layout 绑定一致</text><text x="488" y="389" class="small muted">确认可读后 READY → COMPUTE</text><text x="488" y="412" class="small muted">graph launch 读取有效 map</text><text x="24" y="513" class="small muted">还需保护在算 slot、检查 request/layer/expert identity；toy generation 测试不是真实 DMA 验证。</text></svg>