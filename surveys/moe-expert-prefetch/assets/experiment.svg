<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="svg-fa56f9d1-title svg-fa56f9d1-desc">
<title id="svg-fa56f9d1-title">实际教学实验与指标反例</title><desc id="svg-fa56f9d1-desc">实际CPU合成MoE实验说明高Accuracy陷阱、回退与近似输出差异、batch union和联合成功分母。</desc>
<defs><marker id="svg-fa56f9d1-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8292a8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#dce4ef} .muted{fill:#9cabc0} .year{fill:#7dc6b2;font-size:17px;font-weight:600} .label{font-size:16px} .small{font-size:14px} .line{stroke:#718299;stroke-width:2;fill:none;marker-end:url(#svg-fa56f9d1-arrow)}</style>
<text x="24" y="36" font-size="22" font-weight="600">本次 CPU toy：相同 reference，预测全错仍可正确回退</text><rect x="24" y="89" width="405" height="163" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="101" width="3" height="139" fill="#7dc6b2"/><text x="42" y="119" class="label" font-weight="600">100% 错误集合</text><text x="42" y="145" class="small muted">TP 0 / FP 768 / FN 768</text><text x="42" y="168" class="small muted">TN 23040 → Accuracy 93.75%</text><text x="42" y="191" class="small muted">Precision 0 / Recall 0 / F1 0</text><rect x="470" y="89" width="406" height="163" rx="8" fill="#182230" stroke="#344355"/><rect x="470" y="101" width="3" height="139" fill="#e6bf88"/><text x="488" y="119" class="label" font-weight="600">两种实际输出</text><text x="488" y="145" class="small muted">真实 demand fallback：max abs 0</text><text x="488" y="168" class="small muted">执行预测专家：relative L2 0.486737</text><text x="488" y="191" class="small muted">不是真实 LLM 质量 / 延迟</text><rect x="24" y="322" width="405" height="148" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="334" width="3" height="124" fill="#a7b5ee"/><text x="42" y="352" class="label" font-weight="600">batch union 反例</text><text x="42" y="378" class="small muted">两个 token 的集合刚好互换</text><text x="42" y="401" class="small muted">逐 token Recall 0</text><text x="42" y="424" class="small muted">批次并集 Recall 1</text><rect x="470" y="322" width="406" height="148" rx="8" fill="#182230" stroke="#344355"/><rect x="470" y="334" width="3" height="124" fill="#7dc6b2"/><text x="488" y="352" class="label" font-weight="600">联合成功反例</text><text x="488" y="378" class="small muted">正确 0.8 / 及时 0.8</text><text x="488" y="401" class="small muted">实际同时成功 0.6</text><text x="488" y="424" class="small muted">边缘乘积 0.64 ≠ 联合</text><text x="24" y="532" class="small muted">固定 seed / 合成权重 / NumPy float64 / 独立输入；结果来自脚本，未测 GPU、SSD 或自回归。</text></svg>