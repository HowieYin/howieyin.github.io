<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 615" role="img" aria-labelledby="svg-3a834a9a-title svg-3a834a9a-desc">
<title id="svg-3a834a9a-title">三种预取与执行语义</title><desc id="svg-3a834a9a-desc">从相同错误预测分出目标路由回退、近似计算和训练新路由三种实际执行约定。</desc>
<defs><marker id="svg-3a834a9a-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8292a8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#dce4ef} .muted{fill:#9cabc0} .year{fill:#7dc6b2;font-size:17px;font-weight:600} .label{font-size:16px} .small{font-size:14px} .line{stroke:#718299;stroke-width:2;fill:none;marker-end:url(#svg-3a834a9a-arrow)}</style>
<text x="24" y="36" font-size="22" font-weight="600">真实集合 {7,19}，提前预测 {7,23}：正式执行哪条路？</text><rect x="24" y="91" width="250" height="132" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="103" width="3" height="108" fill="#7dc6b2"/><text x="42" y="121" class="label" font-weight="600">预测不是正式答案</text><text x="42" y="147" class="small muted">7：正确预取</text><text x="42" y="170" class="small muted">23：多余字节</text><text x="42" y="193" class="small muted">19：真实 miss</text><rect x="367" y="85" width="509" height="130" rx="8" fill="#182230" stroke="#344355"/><rect x="367" y="97" width="3" height="106" fill="#7dc6b2"/><text x="385" y="115" class="label" font-weight="600">保持目标路由</text><text x="385" y="141" class="small muted">等待加载真实 19 / CPU 算 19</text><text x="385" y="164" class="small muted">输入、专家与权重均按目标</text><path d="M276 157H322V150H363" class="line"/><rect x="367" y="242" width="509" height="130" rx="8" fill="#182230" stroke="#344355"/><rect x="367" y="254" width="3" height="106" fill="#e6bf88"/><text x="385" y="272" class="label" font-weight="600">近似计算</text><text x="385" y="298" class="small muted">省略 19 / 低精度 / surrogate</text><text x="385" y="321" class="small muted">或在较早 hidden 上预计算</text><path d="M276 157H322V307H363" class="line"/><rect x="367" y="399" width="509" height="130" rx="8" fill="#182230" stroke="#344355"/><rect x="367" y="411" width="3" height="106" fill="#a7b5ee"/><text x="385" y="429" class="label" font-weight="600">训练新的提前路由</text><text x="385" y="455" class="small muted">新模型正式执行 {7,23}</text><text x="385" y="478" class="small muted">需测相对原模型的任务质量</text><path d="M276 157H322V464H363" class="line"/><text x="24" y="587" class="small muted">同数学语义仍需数值验证；新路由的“没有预测 miss”不代表旧 checkpoint 不变。</text></svg>