<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 468" role="img" aria-labelledby="svg-b9c32a82-title svg-b9c32a82-desc">
<title id="svg-b9c32a82-title">MoE 的四本资源账</title><desc id="svg-b9c32a82-desc">区分总参数、每Token激活、实际内存和实际运行，并说明prefill decode区别。</desc>
<defs><marker id="svg-b9c32a82-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8292a8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#dce4ef} .muted{fill:#9cabc0} .year{fill:#7dc6b2;font-size:17px;font-weight:600} .label{font-size:16px} .small{font-size:14px} .line{stroke:#718299;stroke-width:2;fill:none;marker-end:url(#svg-b9c32a82-arrow)}</style>
<text x="24" y="38" font-size="23" font-weight="600">四本账：容量 ≠ 激活计算 ≠ 驻留内存 ≠ 延迟</text><rect x="24" y="76" width="408" height="132" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="88" width="3" height="108" fill="#7dc6b2"/><text x="42" y="106" class="label" font-weight="600">① 总参数</text><text x="42" y="132" class="small muted">所有专家 + Attention / Embedding</text><text x="42" y="155" class="small muted">决定完整权重规模；训练还有状态</text><rect x="468" y="76" width="408" height="132" rx="8" fill="#182230" stroke="#344355"/><rect x="468" y="88" width="3" height="108" fill="#7dc6b2"/><text x="486" y="106" class="label" font-weight="600">② 每 Token 激活</text><text x="486" y="132" class="small muted">少数路由专家 + 必跑共享部分</text><text x="486" y="155" class="small muted">不能按 k/E 缩放全部模型</text><rect x="24" y="240" width="408" height="156" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="252" width="3" height="132" fill="#7dc6b2"/><text x="42" y="270" class="label" font-weight="600">③ 实际内存</text><text x="42" y="296" class="small muted">权重 + KV + 激活 + 工作区</text><text x="42" y="319" class="small muted">卸载：CPU 内存 / 缓存 / 传输</text><text x="42" y="342" class="small muted">量化：比例因子与对齐也占字节</text><rect x="468" y="240" width="408" height="156" rx="8" fill="#182230" stroke="#344355"/><rect x="468" y="252" width="3" height="132" fill="#7dc6b2"/><text x="486" y="270" class="label" font-weight="600">④ 实际运行</text><text x="486" y="296" class="small muted">FFN + 路由 + 重排 + 通信 + 等待</text><text x="486" y="319" class="small muted">Prefill：大矩阵与吞吐</text><text x="486" y="342" class="small muted">Decode：小矩阵、权重带宽与 TPOT</text><path d="M227 209V235" class="line"/><path d="M672 209V235" class="line"/><text x="24" y="440" class="small muted">总 35B / 激活 3B：BF16 全部裸权重约 70GB；不能用激活规模推算驻留。</text></svg>