<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="svg-e51ea071-title svg-e51ea071-desc">
<title id="svg-e51ea071-title">Token 到专家再合并</title><desc id="svg-e51ea071-desc">四专家 Top-2，选择专家1和3，其他不执行，输出加权合并。</desc>
<defs><marker id="svg-e51ea071-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8292a8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#dce4ef} .muted{fill:#9cabc0} .year{fill:#7dc6b2;font-size:17px;font-weight:600} .label{font-size:16px} .small{font-size:14px} .line{stroke:#718299;stroke-width:2;fill:none;marker-end:url(#svg-e51ea071-arrow)}</style>
<text x="24" y="38" font-size="23" font-weight="600">一个 Token 在一层内部的路由</text><rect x="24" y="134" width="162" height="96" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="146" width="3" height="72" fill="#7dc6b2"/><text x="42" y="164" class="label" font-weight="600">隐藏向量 x</text><text x="42" y="190" class="small muted">共享 Attention 输出</text><rect x="222" y="134" width="180" height="96" rx="8" fill="#182230" stroke="#344355"/><rect x="222" y="146" width="3" height="72" fill="#7dc6b2"/><text x="240" y="164" class="label" font-weight="600">Router</text><text x="240" y="190" class="small muted">打分 → Top-2</text><text x="240" y="213" class="small muted">未选专家不运行</text><rect x="480" y="70" width="170" height="80" rx="8" fill="#182230" stroke="#344355"/><rect x="480" y="82" width="3" height="56" fill="#7dc6b2"/><text x="498" y="100" class="label" font-weight="600">专家 1</text><text x="498" y="126" class="small muted">独立 FFN</text><rect x="480" y="176" width="170" height="80" rx="8" fill="#182230" stroke="#344355"/><rect x="480" y="188" width="3" height="56" fill="#48576b"/><text x="498" y="206" class="label" font-weight="600">专家 2</text><text x="498" y="232" class="small muted">独立 FFN</text><rect x="480" y="282" width="170" height="80" rx="8" fill="#182230" stroke="#344355"/><rect x="480" y="294" width="3" height="56" fill="#7dc6b2"/><text x="498" y="312" class="label" font-weight="600">专家 3</text><text x="498" y="338" class="small muted">独立 FFN</text><rect x="480" y="388" width="170" height="80" rx="8" fill="#182230" stroke="#344355"/><rect x="480" y="400" width="3" height="56" fill="#48576b"/><text x="498" y="418" class="label" font-weight="600">专家 4</text><text x="498" y="444" class="small muted">独立 FFN</text><rect x="708" y="185" width="168" height="116" rx="8" fill="#182230" stroke="#344355"/><rect x="708" y="197" width="3" height="92" fill="#7dc6b2"/><text x="726" y="215" class="label" font-weight="600">加权合并</text><text x="726" y="241" class="small muted">所选输出 × gate</text><text x="726" y="264" class="small muted">再进入残差路径</text><path d="M186 181H218" class="line"/><path d="M402 170L476 110" class="line"/><path d="M402 190L476 322" class="line"/><path d="M650 110L704 215" class="line"/><path d="M650 322L704 265" class="line"/><text x="24" y="512" class="small muted">不同 Token、不同层可以使用不同专家；“专家”不保证固定语义职业。</text></svg>