<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" role="img" aria-labelledby="svg-58e73917-title svg-58e73917-desc">
<title id="svg-58e73917-title">MoE 领域技术发展总览</title><desc id="svg-58e73917-desc">五个阶段连接分工、稀疏计算、稳定性、细粒度与系统协同，并区分视觉和部署分支。</desc>
<defs><marker id="svg-58e73917-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8292a8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#dce4ef} .muted{fill:#9cabc0} .year{fill:#7dc6b2;font-size:17px;font-weight:600} .label{font-size:16px} .small{font-size:14px} .line{stroke:#718299;stroke-width:2;fill:none;marker-end:url(#svg-58e73917-arrow)}</style>
<text x="24" y="38" font-size="23" font-weight="600">MoE：分工 → 稀疏容量 → 模型与系统协同</text><text x="24" y="98" class="year">1991—1994</text><text x="24" y="123" class="small muted">起点</text><rect x="182" y="70" width="318" height="106" rx="8" fill="#182230" stroke="#344355"/><rect x="182" y="82" width="3" height="82" fill="#7dc6b2"/><text x="200" y="100" class="label" font-weight="600">统计分工</text><text x="200" y="126" class="small muted">输入决定专家责任</text><text x="200" y="149" class="small muted">概率混合与分层门控</text><rect x="536" y="70" width="338" height="106" rx="8" fill="#182230" stroke="#344355"/><rect x="536" y="82" width="3" height="82" fill="#a7b5ee"/><text x="554" y="100" class="label" font-weight="600">学习分工</text><text x="554" y="126" class="small muted">尚未以万亿级计算为目标</text><path d="M501 122H532" class="line"/><path d="M342 177V194" class="line"/><text x="24" y="226" class="year">2017—2021</text><text x="24" y="251" class="small muted">稀疏化</text><rect x="182" y="198" width="318" height="106" rx="8" fill="#182230" stroke="#344355"/><rect x="182" y="210" width="3" height="82" fill="#7dc6b2"/><text x="200" y="228" class="label" font-weight="600">稀疏条件计算</text><text x="200" y="254" class="small muted">少数专家执行每个 Token</text><text x="200" y="277" class="small muted">GShard / Switch 扩展 Transformer</text><rect x="536" y="198" width="338" height="106" rx="8" fill="#182230" stroke="#344355"/><rect x="536" y="210" width="3" height="82" fill="#a7b5ee"/><text x="554" y="228" class="label" font-weight="600">容量与并行</text><text x="554" y="254" class="small muted">专家分片 → 通信</text><text x="554" y="277" class="small muted">容量限制 → 丢弃 / padding</text><path d="M501 250H532" class="line"/><path d="M342 305V322" class="line"/><text x="24" y="354" class="year">2022—2023</text><text x="24" y="379" class="small muted">可靠化</text><rect x="182" y="326" width="318" height="106" rx="8" fill="#182230" stroke="#344355"/><rect x="182" y="338" width="3" height="82" fill="#7dc6b2"/><text x="200" y="356" class="label" font-weight="600">稳定与替代路由</text><text x="200" y="382" class="small muted">z-loss / Scaling Laws</text><text x="200" y="405" class="small muted">Expert Choice / Soft MoE</text><rect x="536" y="326" width="338" height="106" rx="8" fill="#182230" stroke="#344355"/><rect x="536" y="338" width="3" height="82" fill="#a7b5ee"/><text x="554" y="356" class="label" font-weight="600">计算组织</text><text x="554" y="382" class="small muted">MegaBlocks 保留分配</text><text x="554" y="405" class="small muted">因果性与视觉分支需区分</text><path d="M501 378H532" class="line"/><path d="M342 433V450" class="line"/><text x="24" y="482" class="year">2024—2025</text><text x="24" y="507" class="small muted">成熟化</text><rect x="182" y="454" width="318" height="106" rx="8" fill="#182230" stroke="#344355"/><rect x="182" y="466" width="3" height="82" fill="#7dc6b2"/><text x="200" y="484" class="label" font-weight="600">细粒度与开放验证</text><text x="200" y="510" class="small muted">共享专家 / 无辅助损失均衡</text><text x="200" y="533" class="small muted">Mixtral / OLMoE / V2–V3 / K2</text><rect x="536" y="454" width="338" height="106" rx="8" fill="#182230" stroke="#344355"/><rect x="536" y="466" width="3" height="82" fill="#a7b5ee"/><text x="554" y="484" class="label" font-weight="600">联合设计</text><text x="554" y="510" class="small muted">数据预算 + 低精度</text><text x="554" y="533" class="small muted">设备约束 + 计算通信重叠</text><path d="M501 506H532" class="line"/><path d="M342 561V578" class="line"/><text x="24" y="610" class="year">2026</text><text x="24" y="635" class="small muted">协同化</text><rect x="182" y="582" width="318" height="106" rx="8" fill="#182230" stroke="#344355"/><rect x="182" y="594" width="3" height="82" fill="#7dc6b2"/><text x="200" y="612" class="label" font-weight="600">潜空间与新控制</text><text x="200" y="638" class="small muted">V4 / K3 / Multi-View</text><text x="200" y="661" class="small muted">分位数均衡与混合架构</text><rect x="536" y="582" width="338" height="106" rx="8" fill="#182230" stroke="#344355"/><rect x="536" y="594" width="3" height="82" fill="#a7b5ee"/><text x="554" y="612" class="label" font-weight="600">部署前沿</text><text x="554" y="638" class="small muted">Stepped：分段路由</text><text x="554" y="661" class="small muted">FreeToken：带宽分担</text><path d="M501 634H532" class="line"/></svg>