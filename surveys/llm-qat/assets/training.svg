<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 555" role="img" aria-labelledby="svg-641e2280-title svg-641e2280-desc">
<title id="svg-641e2280-title">QAT前向与反向</title><desc id="svg-641e2280-desc">影子权重经硬量化重建用于前向，任务梯度通过STE或尺度估计器回传，训练状态仍通常高精度。</desc>
<defs><marker id="svg-641e2280-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8292a8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#dce4ef} .muted{fill:#9cabc0} .year{fill:#7dc6b2;font-size:17px;font-weight:600} .label{font-size:16px} .small{font-size:14px} .line{stroke:#718299;stroke-width:2;fill:none;marker-end:url(#svg-641e2280-arrow)}</style>
<text x="24" y="36" font-size="22" font-weight="600">前向看真实台阶，反向用明确的代理更新影子状态</text><rect x="24" y="95" width="264" height="145" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="107" width="3" height="121" fill="#7dc6b2"/><text x="42" y="125" class="label" font-weight="600">影子权重 W</text><text x="42" y="151" class="small muted">连续、通常 FP32 / BF16</text><text x="42" y="174" class="small muted">保留 optimizer / gradient</text><rect x="318" y="95" width="264" height="145" rx="8" fill="#182230" stroke="#344355"/><rect x="318" y="107" width="3" height="121" fill="#a7b5ee"/><text x="336" y="125" class="label" font-weight="600">Quantize → Dequantize</text><text x="336" y="151" class="small muted">w=0.26，s=0.1 → code 3</text><text x="336" y="174" class="small muted">重建为 0.3，前向有误差</text><rect x="612" y="95" width="264" height="145" rx="8" fill="#182230" stroke="#344355"/><rect x="612" y="107" width="3" height="121" fill="#e6bf88"/><text x="630" y="125" class="label" font-weight="600">语言任务 loss</text><text x="630" y="151" class="small muted">Linear → attention → logits</text><text x="630" y="174" class="small muted">CE 或教师 KL</text><path d="M290 165H314" class="line"/><path d="M584 165H608" class="line"/><rect x="24" y="331" width="405" height="146" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="343" width="3" height="122" fill="#a7b5ee"/><text x="42" y="361" class="label" font-weight="600">替代反向回到 W</text><text x="42" y="387" class="small muted">STE 可复制梯度或限制饱和区</text><text x="42" y="410" class="small muted">不宣称硬 round 的真导数非零</text><text x="42" y="433" class="small muted">更新跨过边界才改变 code</text><rect x="470" y="331" width="406" height="146" rx="8" fill="#182230" stroke="#344355"/><rect x="470" y="343" width="3" height="122" fill="#e6bf88"/><text x="488" y="361" class="label" font-weight="600">尺度 / clipping 可另行学习</text><text x="488" y="387" class="small muted">LSQ 为 s 设计替代梯度</text><text x="488" y="410" class="small muted">冻结 codes 只调 s：自由度受限</text><text x="488" y="433" class="small muted">最终 export 必须保留相同规则</text><path d="M744 243V289H226V327" class="line"/><path d="M226 328V244" class="line"/><text x="24" y="523" class="small muted">本文实测 full-QAT 使用恒等 STE 和 detached absmax scale；不是 LSQ 或命名论文的复现。</text></svg>