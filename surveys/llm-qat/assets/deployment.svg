<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="svg-21662ca4-title svg-21662ca4-desc">
<title id="svg-21662ca4-title">QAT部署与RL反馈</title><desc id="svg-21662ca4-desc">训练模拟经导出和真实低位运行验证，TRACE反馈实际量化信息；系统性能需单独测量而非从fakequant推出。</desc>
<defs><marker id="svg-21662ca4-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8292a8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#dce4ef} .muted{fill:#9cabc0} .year{fill:#7dc6b2;font-size:17px;font-weight:600} .label{font-size:16px} .small{font-size:14px} .line{stroke:#718299;stroke-width:2;fill:none;marker-end:url(#svg-21662ca4-arrow)}</style>
<text x="24" y="36" font-size="22" font-weight="600">训练、export 和 rollout 共用格式，RL 还要反馈实际执行</text><rect x="24" y="100" width="264" height="154" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="112" width="3" height="130" fill="#7dc6b2"/><text x="42" y="130" class="label" font-weight="600">训练 fake quant</text><text x="42" y="156" class="small muted">BF16 影子状态 / STE</text><text x="42" y="179" class="small muted">W/A/KV 与 scale 语义</text><path d="M290 177H314" class="line"/><rect x="318" y="100" width="264" height="154" rx="8" fill="#182230" stroke="#344355"/><rect x="318" y="112" width="3" height="130" fill="#a7b5ee"/><text x="336" y="130" class="label" font-weight="600">Export → Pack → Load</text><text x="336" y="156" class="small muted">codes + scales + fused metadata</text><text x="336" y="179" class="small muted">group / dtype / layout / version</text><path d="M584 177H608" class="line"/><rect x="612" y="100" width="264" height="154" rx="8" fill="#182230" stroke="#344355"/><rect x="612" y="112" width="3" height="130" fill="#e6bf88"/><text x="630" y="130" class="label" font-weight="600">真实低位 rollout</text><text x="630" y="156" class="small muted">内核执行、路由与 KV 状态</text><text x="630" y="179" class="small muted">token / probability / reward</text><path d="M744 257V302H156V342" class="line"/><rect x="24" y="345" width="405" height="158" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="357" width="3" height="134" fill="#e6bf88"/><text x="42" y="375" class="label" font-weight="600">TRACE：回传实际量化指导</text><text x="42" y="401" class="small muted">paired guidance 对应 rollout codes</text><text x="42" y="424" class="small muted">减少模拟与真实路径失配</text><text x="42" y="447" class="small muted">更新后仍需处理信息 stale</text><rect x="470" y="345" width="406" height="158" rx="8" fill="#182230" stroke="#344355"/><rect x="470" y="357" width="3" height="134" fill="#7dc6b2"/><text x="488" y="375" class="label" font-weight="600">逐级验证，区分质量与速度</text><text x="488" y="401" class="small muted">codes → weights → layer → logits</text><text x="488" y="424" class="small muted">任务 → TTFT / TPOT → peak memory</text><text x="488" y="447" class="small muted">prefill / decode、batch 与长度固定</text><path d="M155 342V258" class="line"/></svg>