<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="svg-378e1e06-title svg-378e1e06-desc">
<title id="svg-378e1e06-title">离散量化优化接口</title><desc id="svg-378e1e06-desc">固定码调连续值、固定值选码、改变代理梯度和零阶估计分别承担不同自由度与计算成本。</desc>
<defs><marker id="svg-378e1e06-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8292a8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#dce4ef} .muted{fill:#9cabc0} .year{fill:#7dc6b2;font-size:17px;font-weight:600} .label{font-size:16px} .small{font-size:14px} .line{stroke:#718299;stroke-width:2;fill:none;marker-end:url(#svg-378e1e06-arrow)}</style>
<text x="24" y="36" font-size="22" font-weight="600">更新 codes、重建参数、反向代理，是三个不同接口</text><rect x="24" y="102" width="264" height="172" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="114" width="3" height="148" fill="#7dc6b2"/><text x="42" y="132" class="label" font-weight="600">连续重建参数</text><text x="42" y="158" class="small muted">固定 codes → 移动 scale</text><text x="42" y="181" class="small muted">PEQA 等：少状态 / 少自由度</text><text x="42" y="204" class="small muted">PV P 步：保共享关系调值</text><rect x="318" y="102" width="264" height="172" rx="8" fill="#182230" stroke="#344355"/><rect x="318" y="114" width="3" height="148" fill="#a7b5ee"/><text x="336" y="132" class="label" font-weight="600">离散 assignments</text><text x="336" y="158" class="small muted">固定可用值 → 重新选码</text><text x="336" y="181" class="small muted">PV V 步：改变分配</text><text x="336" y="204" class="small muted">搜索成本随表示空间增长</text><rect x="612" y="102" width="264" height="172" rx="8" fill="#182230" stroke="#344355"/><rect x="612" y="114" width="3" height="148" fill="#e6bf88"/><text x="630" y="132" class="label" font-weight="600">反向代理 / 训练状态</text><text x="630" y="158" class="small muted">JacQuant：组敏感度</text><text x="630" y="181" class="small muted">WinQ：噪声 / 重初始化</text><text x="630" y="204" class="small muted">不把硬量化当光滑函数</text><rect x="24" y="355" width="405" height="147" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="367" width="3" height="123" fill="#a7b5ee"/><text x="42" y="385" class="label" font-weight="600">QUASAR：任务敏感度进入重建</text><text x="42" y="411" class="small muted">Adam 二阶矩是对角代理</text><text x="42" y="434" class="small muted">加权拟合 scale / offset + code search</text><text x="42" y="457" class="small muted">不等于精确 Hessian 或全局最优</text><rect x="470" y="355" width="406" height="147" rx="8" fill="#182230" stroke="#344355"/><rect x="470" y="367" width="3" height="123" fill="#e6bf88"/><text x="488" y="385" class="label" font-weight="600">ZeroQAT：改变反馈的获得方式</text><text x="488" y="411" class="small muted">随机方向上两次前向估计</text><text x="488" y="434" class="small muted">省反向激活，增加方差 / 前向</text><text x="488" y="457" class="small muted">扰动小到不跨码可能被吞掉</text></svg>