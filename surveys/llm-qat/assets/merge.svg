<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 525" role="img" aria-labelledby="svg-ddb6399b-title svg-ddb6399b-desc">
<title id="svg-ddb6399b-title">LoRA量化与合并顺序</title><desc id="svg-ddb6399b-desc">三种低秩更新接口及0.24加0.04的实例，表明量化非线性使独立旁路与合并后量化不等价。</desc>
<defs><marker id="svg-ddb6399b-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8292a8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#dce4ef} .muted{fill:#9cabc0} .year{fill:#7dc6b2;font-size:17px;font-weight:600} .label{font-size:16px} .small{font-size:14px} .line{stroke:#718299;stroke-width:2;fill:none;marker-end:url(#svg-ddb6399b-arrow)}</style>
<text x="24" y="36" font-size="22" font-weight="600">LoRA 在量化之前还是之后，决定最终学到哪个函数</text><rect x="24" y="96" width="264" height="176" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="108" width="3" height="152" fill="#7dc6b2"/><text x="42" y="126" class="label" font-weight="600">独立 adapter</text><text x="42" y="152" class="small muted">Q/DQ(W₀)x + αBAx</text><text x="42" y="175" class="small muted">浮点旁路可补量化误差</text><text x="42" y="198" class="small muted">QLoRA：冻结低位基座</text><text x="42" y="221" class="small muted">合并后再 PTQ 需重新验证</text><rect x="318" y="96" width="264" height="176" rx="8" fill="#182230" stroke="#344355"/><rect x="318" y="108" width="3" height="152" fill="#a7b5ee"/><text x="336" y="126" class="label" font-weight="600">合并后量化</text><text x="336" y="152" class="small muted">Q/DQ(W₀ + αBA)x</text><text x="336" y="175" class="small muted">每次训练就面对目标网格</text><text x="336" y="198" class="small muted">L4Q / LR-QAT 等路线</text><text x="336" y="221" class="small muted">冻结后不保留独立旁路</text><rect x="612" y="96" width="264" height="176" rx="8" fill="#182230" stroke="#344355"/><rect x="612" y="108" width="3" height="152" fill="#e6bf88"/><text x="630" y="126" class="label" font-weight="600">组结构兼容量化参数</text><text x="630" y="152" class="small muted">QA-LoRA：组内共享更新</text><text x="630" y="175" class="small muted">吸收到量化偏置</text><text x="630" y="198" class="small muted">减少新增取整步骤</text><text x="630" y="221" class="small muted">代价：LoRA 结构受限</text><rect x="24" y="359" width="852" height="128" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="371" width="3" height="104" fill="#a7b5ee"/><text x="42" y="389" class="label" font-weight="600">标量例子：s = 0.1，w₀ = 0.24，Δw = 0.04</text><text x="42" y="415" class="small muted">独立路径：Q/DQ(0.24) + 0.04 = 0.24；合并路径：Q/DQ(0.28) = 0.3。</text><text x="42" y="438" class="small muted">二者一般不相等；rank、scale、zero 与合并系数必须一起导出。</text></svg>