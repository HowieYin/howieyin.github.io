<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 804" role="img" aria-labelledby="svg-2feb1bf1-title svg-2feb1bf1-desc">
<title id="svg-2feb1bf1-title">QAT 技术发展总览</title><desc id="svg-2feb1bf1-desc">三条并行主线从基础梯度估计、参数高效训练和蒸馏走向离散优化、格点表示和FP4部署闭环。</desc>
<defs><marker id="svg-2feb1bf1-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8292a8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#dce4ef} .muted{fill:#9cabc0} .year{fill:#7dc6b2;font-size:17px;font-weight:600} .label{font-size:16px} .small{font-size:14px} .line{stroke:#718299;stroke-width:2;fill:none;marker-end:url(#svg-2feb1bf1-arrow)}</style>
<text x="24" y="34" font-size="22" font-weight="600">LLM QAT：谁学习误差，怎样更新码，怎样保持部署一致</text><text x="142" y="68" class="small">训练自由度与预算</text><text x="393" y="68" class="small">离散表示与更新</text><text x="644" y="68" class="small">语言行为与执行</text><text x="24" y="118" class="year">2013–20</text><rect x="142" y="88" width="232" height="110" rx="8" fill="#182230" stroke="#344355"/><rect x="142" y="100" width="3" height="86" fill="#7dc6b2"/><text x="160" y="118" class="label" font-weight="600">基础工具</text><text x="160" y="144" class="small muted">STE：影子权重</text><text x="160" y="167" class="small muted">PACT / LSQ：阈值与尺度</text><path d="M258 201V217" class="line"/><rect x="393" y="88" width="232" height="110" rx="8" fill="#182230" stroke="#344355"/><rect x="393" y="100" width="3" height="86" fill="#a7b5ee"/><text x="411" y="118" class="label" font-weight="600">离散前向 / 替代反向</text><text x="411" y="144" class="small muted">硬 round 不可普通求导</text><text x="411" y="167" class="small muted">基础实验主要为视觉</text><path d="M509 201V217" class="line"/><rect x="644" y="88" width="232" height="110" rx="8" fill="#182230" stroke="#344355"/><rect x="644" y="100" width="3" height="86" fill="#e6bf88"/><text x="662" y="118" class="label" font-weight="600">训练图对齐整数图</text><text x="662" y="144" class="small muted">Jacob：量化 / 累加 / 缩放</text><text x="662" y="167" class="small muted">8 bit mobile vision</text><path d="M760 201V217" class="line"/><text x="24" y="250" class="year">2023</text><rect x="142" y="220" width="232" height="110" rx="8" fill="#182230" stroke="#344355"/><rect x="142" y="232" width="3" height="86" fill="#7dc6b2"/><text x="160" y="250" class="label" font-weight="600">少状态任务适配</text><text x="160" y="276" class="small muted">PEQA：冻结 codes</text><text x="160" y="299" class="small muted">QLoRA / QA-LoRA：合并边界</text><path d="M258 333V349" class="line"/><rect x="393" y="220" width="232" height="110" rx="8" fill="#182230" stroke="#344355"/><rect x="393" y="232" width="3" height="86" fill="#a7b5ee"/><text x="411" y="250" class="label" font-weight="600">权重与网格共同学习</text><text x="411" y="276" class="small muted">参数与表示不是同一个轴</text><text x="411" y="299" class="small muted">不是 PTQ 永远不优化</text><path d="M509 333V349" class="line"/><rect x="644" y="220" width="232" height="110" rx="8" fill="#182230" stroke="#344355"/><rect x="644" y="232" width="3" height="86" fill="#e6bf88"/><text x="662" y="250" class="label" font-weight="600">LLM 量化感知蒸馏</text><text x="662" y="276" class="small muted">LLM-QAT：W / A / KV</text><text x="662" y="299" class="small muted">教师文本与 token 概率</text><path d="M760 333V349" class="line"/><text x="24" y="382" class="year">2024</text><rect x="142" y="352" width="232" height="110" rx="8" fill="#182230" stroke="#344355"/><rect x="142" y="364" width="3" height="86" fill="#7dc6b2"/><text x="160" y="382" class="label" font-weight="600">分阶段与低秩 QAT</text><text x="160" y="408" class="small muted">L4Q / LR-QAT：量化前合并</text><text x="160" y="431" class="small muted">EfficientQAT：block → global</text><path d="M258 465V481" class="line"/><rect x="393" y="352" width="232" height="110" rx="8" fill="#182230" stroke="#344355"/><rect x="393" y="364" width="3" height="86" fill="#a7b5ee"/><text x="411" y="382" class="label" font-weight="600">连续 / 离散交替</text><text x="411" y="408" class="small muted">PV：共享值与 assignments</text><text x="411" y="431" class="small muted">OneBit / Ternary：极低位</text><path d="M509 465V481" class="line"/><rect x="644" y="352" width="232" height="110" rx="8" fill="#182230" stroke="#344355"/><rect x="644" y="364" width="3" height="86" fill="#e6bf88"/><text x="662" y="382" class="label" font-weight="600">蒸馏更关注误差形状</text><text x="662" y="408" class="small muted">BitDistiller：置信度</text><text x="662" y="431" class="small muted">EdgeQAT → Squat 版本演进</text><path d="M760 465V481" class="line"/><text x="24" y="514" class="year">2025</text><rect x="142" y="484" width="232" height="110" rx="8" fill="#182230" stroke="#344355"/><rect x="142" y="496" width="3" height="86" fill="#7dc6b2"/><text x="160" y="514" class="label" font-weight="600">位宽与 token 共选</text><text x="160" y="540" class="small muted">ParetoQ：训练预算</text><text x="160" y="563" class="small muted">MatQuant：嵌套位宽</text><path d="M258 597V613" class="line"/><rect x="393" y="484" width="232" height="110" rx="8" fill="#182230" stroke="#344355"/><rect x="393" y="496" width="3" height="86" fill="#a7b5ee"/><text x="411" y="514" class="label" font-weight="600">日程 / 低状态优化</text><text x="411" y="540" class="small muted">PARQ：视觉近端基础</text><text x="411" y="563" class="small muted">ZeroQAT：零阶前向估计</text><path d="M509 597V613" class="line"/><rect x="644" y="484" width="232" height="110" rx="8" fill="#182230" stroke="#344355"/><rect x="644" y="496" width="3" height="86" fill="#e6bf88"/><text x="662" y="514" class="label" font-weight="600">原生预训练另设边界</text><text x="662" y="540" class="small muted">BitNet 2B4T / QuEST</text><text x="662" y="563" class="small muted">不等于 checkpoint 转换</text><path d="M760 597V613" class="line"/><text x="24" y="646" class="year">2026</text><rect x="142" y="616" width="232" height="110" rx="8" fill="#182230" stroke="#344355"/><rect x="142" y="628" width="3" height="86" fill="#7dc6b2"/><text x="160" y="646" class="label" font-weight="600">状态 / 敏感度再设计</text><text x="160" y="672" class="small muted">WinQ / JacQuant</text><text x="160" y="695" class="small muted">QUASAR：loss-aware 重建</text><rect x="393" y="616" width="232" height="110" rx="8" fill="#182230" stroke="#344355"/><rect x="393" y="628" width="3" height="86" fill="#a7b5ee"/><text x="411" y="646" class="label" font-weight="600">格点 / 渐进低位</text><text x="411" y="672" class="small muted">LC-QAT / E8-QAT</text><text x="411" y="695" class="small muted">Bit-by-Bit：日程与拆分</text><rect x="644" y="616" width="232" height="110" rx="8" fill="#182230" stroke="#344355"/><rect x="644" y="628" width="3" height="86" fill="#e6bf88"/><text x="662" y="646" class="label" font-weight="600">实际 FP4 反馈闭环</text><text x="662" y="672" class="small muted">QATFactory / TRACE</text><text x="662" y="695" class="small muted">Bolt：限定条件的 QAD</text><text x="24" y="778" class="small muted">按首次公开日期组织；箭头表示问题继承，可组合而非逐代淘汰。证据截止 2026-11-19。</text></svg>