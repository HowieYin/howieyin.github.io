<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" role="img" aria-labelledby="svg-03ad4d92-title svg-03ad4d92-desc">
<title id="svg-03ad4d92-title">Pythia真实QAT实验</title><desc id="svg-03ad4d92-desc">真实三种子测试PPL用对数坐标，误差线为样本标准差；并展示改变导出粒度损害量化前向一致性。</desc>
<defs><marker id="svg-03ad4d92-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8292a8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#dce4ef} .muted{fill:#9cabc0} .year{fill:#7dc6b2;font-size:17px;font-weight:600} .label{font-size:16px} .small{font-size:14px} .line{stroke:#718299;stroke-width:2;fill:none;marker-end:url(#svg-03ad4d92-arrow)}</style>
<text x="24" y="36" font-size="22" font-weight="600">真实 Pythia-70M：目标网格进入训练，导出粒度必须一致</text><text x="24" y="74" class="small muted">WikiText2 前4096 test tokens / 4080 targets；3 seeds；只量化24个Linear，FP32 GEMM。</text><path d="M240.0 112V454" stroke="#263441"/><text x="228.0" y="477" class="small">50</text><path d="M355.7555867474075 112V454" stroke="#263441"/><text x="343.7555867474075" y="477" class="small">100</text><path d="M471.511173494815 112V454" stroke="#263441"/><text x="459.511173494815" y="477" class="small">200</text><path d="M624.5317357563843 112V454" stroke="#263441"/><text x="612.5317357563843" y="477" class="small">500</text><path d="M740.2873225037918 112V454" stroke="#263441"/><text x="728.2873225037918" y="477" class="small">1000</text><path d="M808.0 112V454" stroke="#263441"/><text x="796.0" y="477" class="small">1500</text><text x="24" y="143" class="small">FP32</text><path d="M323.02342257566954 138H323.02342257566954" stroke="#7dc6b2" stroke-width="3"/><circle cx="323.02342257566954" cy="138" r="6" fill="#7dc6b2"/><text x="333.02342257566954" y="128" class="small">82.20 ± 0.00</text><text x="24" y="198" class="small">W3 RTN</text><path d="M757.4376112905678 193H757.4376112905678" stroke="#e6bf88" stroke-width="3"/><circle cx="757.4376112905678" cy="193" r="6" fill="#e6bf88"/><text x="767.4376112905678" y="183" class="small">1108.15 ± 0.00</text><text x="24" y="253" class="small">FT → RTN</text><path d="M677.7946129837953 248H722.955295447469" stroke="#e6bf88" stroke-width="3"/><circle cx="701.8968874922539" cy="248" r="6" fill="#e6bf88"/><text x="711.8968874922539" y="238" class="small">794.63 ± 106.79</text><text x="24" y="308" class="small">Full QAT</text><path d="M390.64229037206513 303H404.4502111163785" stroke="#7dc6b2" stroke-width="3"/><circle cx="397.68891869248455" cy="303" r="6" fill="#7dc6b2"/><text x="407.68891869248455" y="293" class="small">128.54 ± 5.31</text><text x="24" y="363" class="small">Frozen-code scale</text><path d="M475.1650316120023 358H476.3971864273502" stroke="#7dc6b2" stroke-width="3"/><circle cx="475.7822453983782" cy="358" r="6" fill="#7dc6b2"/><text x="485.7822453983782" y="348" class="small">205.18 ± 0.76</text><text x="24" y="418" class="small">Rank8 merged QAT</text><path d="M404.3766756151997 413H424.4839451678281" stroke="#7dc6b2" stroke-width="3"/><circle cx="414.7327492279394" cy="413" r="6" fill="#7dc6b2"/><text x="424.7327492279394" y="403" class="small">142.36 ± 8.56</text><text x="365" y="513" class="small">PPL（对数坐标；越低越好）</text><rect x="24" y="549" width="405" height="136" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="561" width="3" height="112" fill="#e6bf88"/><text x="42" y="579" class="label" font-weight="600">误差线：PPL 样本标准差</text><text x="42" y="605" class="small muted">不是置信区间；基线未训练</text><text x="42" y="628" class="small muted">策略学习率不同，不是方法排行榜</text><text x="42" y="651" class="small muted">浮点微调后再 RTN 仍明显失真</text><rect x="470" y="549" width="406" height="136" rx="8" fill="#182230" stroke="#344355"/><rect x="470" y="561" width="3" height="112" fill="#a7b5ee"/><text x="488" y="579" class="label" font-weight="600">主动改变导出 g128 → g256</text><text x="488" y="605" class="small muted">Full QAT 三种子 PPL 均恶化</text><text x="488" y="628" class="small muted">正确 Q/DQ export sampled logits差0</text><text x="488" y="651" class="small muted">额外 pack 只在后两个种子检验</text></svg>