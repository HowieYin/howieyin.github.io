<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 625" role="img" aria-labelledby="svg-beb560f9-title svg-beb560f9-desc">
<title id="svg-beb560f9-title">校准前缀的失配</title><desc id="svg-beb560f9-desc">同一校准token通过teacher和量化前缀产生不同输入，非对称目标恢复teacher而同输入目标可能延续偏差。</desc>
<defs><marker id="svg-beb560f9-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8292a8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#dce4ef} .muted{fill:#9cabc0} .year{fill:#7dc6b2;font-size:17px;font-weight:600} .label{font-size:16px} .small{font-size:14px} .line{stroke:#718299;stroke-width:2;fill:none;marker-end:url(#svg-beb560f9-arrow)}</style>
<text x="24" y="36" font-size="22" font-weight="600">相同 token，两份输入：teacher 的目标该由谁恢复？</text><rect x="24" y="91" width="264" height="121" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="103" width="3" height="97" fill="#7dc6b2"/><text x="42" y="121" class="label" font-weight="600">浮点前缀</text><text x="42" y="147" class="small muted">原 checkpoint</text><text x="42" y="170" class="small muted">得到 Xf</text><rect x="318" y="91" width="264" height="121" rx="8" fill="#182230" stroke="#344355"/><rect x="318" y="103" width="3" height="97" fill="#7dc6b2"/><text x="336" y="121" class="label" font-weight="600">原浮点当前层</text><text x="336" y="147" class="small muted">W × Xf</text><text x="336" y="170" class="small muted">teacher 输出 Yf</text><rect x="612" y="91" width="264" height="121" rx="8" fill="#182230" stroke="#344355"/><rect x="612" y="103" width="3" height="97" fill="#a7b5ee"/><text x="630" y="121" class="label" font-weight="600">GPTAQ 对齐目标</text><text x="630" y="147" class="small muted">ŴXq 应接近 WXf</text><text x="630" y="170" class="small muted">尝试纠正前缀偏差</text><rect x="24" y="302" width="264" height="121" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="314" width="3" height="97" fill="#e6bf88"/><text x="42" y="332" class="label" font-weight="600">已量化前缀</text><text x="42" y="358" class="small muted">同一批校准 token</text><text x="42" y="381" class="small muted">得到不同输入 Xq</text><rect x="318" y="302" width="264" height="121" rx="8" fill="#182230" stroke="#344355"/><rect x="318" y="314" width="3" height="97" fill="#a7b5ee"/><text x="336" y="332" class="label" font-weight="600">量化当前层</text><text x="336" y="358" class="small muted">Ŵ × Xq</text><text x="336" y="381" class="small muted">student 输出 Yq</text><rect x="612" y="302" width="264" height="121" rx="8" fill="#182230" stroke="#344355"/><rect x="612" y="314" width="3" height="97" fill="#e6bf88"/><text x="630" y="332" class="label" font-weight="600">same-input 目标</text><text x="630" y="358" class="small muted">仅对齐 W × Xq</text><text x="630" y="381" class="small muted">可能延续已有漂移</text><path d="M290 151H314" class="line"/><path d="M584 151H608" class="line"/><path d="M290 363H314" class="line"/><path d="M584 363H608" class="line"/><path d="M450 300V216" class="line"/><rect x="24" y="490" width="852" height="105" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="502" width="3" height="81" fill="#7dc6b2"/><text x="42" y="520" class="label" font-weight="600">CoreQ：纠正强度也要校准</text><text x="42" y="546" class="small muted">把观测失配分为可达 S 与不可达 E；不可达残差大时降低校正强度。</text><text x="42" y="569" class="small muted">G²PTQ / REAL-Q 进一步问梯度目标与刷新时机，但需要额外反馈成本。</text></svg>