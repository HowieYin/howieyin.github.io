<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" role="img" aria-labelledby="svg-1caa35bd-title svg-1caa35bd-desc">
<title id="svg-1caa35bd-title">旋转的融合边界</title><desc id="svg-1caa35bd-desc">线性等价、统一残差基底、非线性后的在线Hadamard与层间不同基底的连接开销。</desc>
<defs><marker id="svg-1caa35bd-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8292a8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#dce4ef} .muted{fill:#9cabc0} .year{fill:#7dc6b2;font-size:17px;font-weight:600} .label{font-size:16px} .small{font-size:14px} .line{stroke:#718299;stroke-width:2;fill:none;marker-end:url(#svg-1caa35bd-arrow)}</style>
<text x="24" y="36" font-size="22" font-weight="600">合法旋转位置：线性可融合，非线性接缝要保留</text><rect x="24" y="88" width="264" height="154" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="100" width="3" height="130" fill="#7dc6b2"/><text x="42" y="118" class="label" font-weight="600">残差流：共同基底 Q</text><text x="42" y="144" class="small muted">先吸收 RMSNorm gain</text><text x="42" y="167" class="small muted">两条残差处于同一基底</text><text x="42" y="190" class="small muted">相邻 Linear 离线吸收 Q</text><rect x="318" y="88" width="264" height="154" rx="8" fill="#182230" stroke="#344355"/><rect x="318" y="100" width="3" height="130" fill="#a7b5ee"/><text x="336" y="118" class="label" font-weight="600">单个 Linear 的等价</text><text x="336" y="144" class="small muted">x → Qx，W → WQᵀ</text><text x="336" y="167" class="small muted">WQᵀQx = Wx</text><text x="336" y="190" class="small muted">量化后不再保证精确等价</text><rect x="612" y="88" width="264" height="154" rx="8" fill="#182230" stroke="#344355"/><rect x="612" y="100" width="3" height="130" fill="#e6bf88"/><text x="630" y="118" class="label" font-weight="600">范数不变，峰值改变</text><text x="630" y="144" class="small muted">(10, 0) → (7.07, 7.07)</text><text x="630" y="167" class="small muted">能量约 100，最大值降低</text><text x="630" y="190" class="small muted">没有删除 outlier 的能量</text><rect x="24" y="310" width="264" height="148" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="322" width="3" height="124" fill="#e6bf88"/><text x="42" y="340" class="label" font-weight="600">FFN nonlinear / gate</text><text x="42" y="366" class="small muted">SiLU(gate) × up</text><text x="42" y="389" class="small muted">不能任意把 Q 穿过去</text><text x="42" y="412" class="small muted">先完成逐元素运算</text><rect x="318" y="310" width="264" height="148" rx="8" fill="#182230" stroke="#344355"/><rect x="318" y="322" width="3" height="124" fill="#a7b5ee"/><text x="336" y="340" class="label" font-weight="600">在线 Hadamard</text><text x="336" y="366" class="small muted">乘积后插入 H</text><text x="336" y="389" class="small muted">down 权重吸收 Hᵀ</text><text x="336" y="412" class="small muted">加减、读写和 launch 计费</text><rect x="612" y="310" width="264" height="148" rx="8" fill="#182230" stroke="#344355"/><rect x="612" y="322" width="3" height="124" fill="#7dc6b2"/><text x="630" y="340" class="label" font-weight="600">层间不同基底</text><text x="630" y="366" class="small muted">上一层 Q₁ → 下一层 Q₂</text><text x="630" y="389" class="small muted">残差需 connector</text><text x="630" y="412" class="small muted">ReSpin：低秩近似有误差</text><path d="M290 384H314" class="line"/><path d="M584 384H608" class="line"/><text x="24" y="522" class="small muted">示意三个接缝，不是完整 Transformer 图；attention head / RoPE 需按论文指定位置另行处理。</text></svg>