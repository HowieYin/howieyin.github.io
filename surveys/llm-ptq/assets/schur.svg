<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 525" role="img" aria-labelledby="svg-5400dbff-title svg-5400dbff-desc">
<title id="svg-5400dbff-title">Schur组优化的直觉</title><desc id="svg-5400dbff-desc">在标准二次型中固定当前组，消去连续后缀得到Schur曲率，组内网格和离散码还需要交替优化。</desc>
<defs><marker id="svg-5400dbff-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8292a8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#dce4ef} .muted{fill:#9cabc0} .year{fill:#7dc6b2;font-size:17px;font-weight:600} .label{font-size:16px} .small{font-size:14px} .line{stroke:#718299;stroke-width:2;fill:none;marker-end:url(#svg-5400dbff-arrow)}</style>
<text x="24" y="36" font-size="22" font-weight="600">Schur：先让连续后缀响应，再评价当前组的选码</text><rect x="24" y="100" width="264" height="163" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="112" width="3" height="139" fill="#7dc6b2"/><text x="42" y="130" class="label" font-weight="600">1. 当前组候选</text><text x="42" y="156" class="small muted">组内误差 u，曲率 A</text><text x="42" y="179" class="small muted">后缀误差 v，曲率 C</text><text x="42" y="202" class="small muted">耦合项 2uᵀBv</text><path d="M290 181H314" class="line"/><rect x="318" y="100" width="264" height="163" rx="8" fill="#182230" stroke="#344355"/><rect x="318" y="112" width="3" height="139" fill="#a7b5ee"/><text x="336" y="130" class="label" font-weight="600">2. 消去自由后缀</text><text x="336" y="156" class="small muted">固定 u，连续优化 v</text><text x="336" y="179" class="small muted">v* = −C⁻¹Bᵀu</text><text x="336" y="202" class="small muted">后缀还能接住部分误差</text><path d="M584 181H608" class="line"/><rect x="612" y="100" width="264" height="163" rx="8" fill="#182230" stroke="#344355"/><rect x="612" y="112" width="3" height="139" fill="#e6bf88"/><text x="630" y="130" class="label" font-weight="600">3. 比较剩余代价</text><text x="630" y="156" class="small muted">uᵀ(A − BC⁻¹Bᵀ)u</text><text x="630" y="179" class="small muted">不是直接使用 uᵀAu</text><text x="630" y="202" class="small muted">C 须可逆或正则化</text><rect x="24" y="345" width="405" height="145" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="357" width="3" height="121" fill="#7dc6b2"/><text x="42" y="375" class="label" font-weight="600">SchurQuant 的组内循环</text><text x="42" y="401" class="small muted">有效曲率下 refit scale / offset</text><text x="42" y="424" class="small muted">再细化离散 codes，有限次迭代</text><text x="42" y="447" class="small muted">不是单次闭式解全部低位权重</text><rect x="470" y="345" width="406" height="145" rx="8" fill="#182230" stroke="#344355"/><rect x="470" y="357" width="3" height="121" fill="#e6bf88"/><text x="488" y="375" class="label" font-weight="600">局部最优仍有边界</text><text x="488" y="401" class="small muted">后缀最终也会量化</text><text x="488" y="424" class="small muted">同输入重建 ≠ teacher 保真</text><text x="488" y="447" class="small muted">更低层损失可能更差 PPL</text></svg>