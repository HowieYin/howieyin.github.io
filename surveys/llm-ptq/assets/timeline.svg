#7dc6b2"/><text x="160" y="514" class="label" font-weight="600">无校准权重统计</text><text x="160" y="540" class="small muted">SINQ：双尺度</text><text x="160" y="563" class="small muted">不能保证所有业务分布</text><rect x="393" y="484" width="232" height="110" rx="8" fill="#182230" stroke="#344355"/><rect x="393" y="496" width="3" height="86" fill="#a7b5ee"/><text x="411" y="514" class="label" font-weight="600">FP4 / 混合预算</text><text x="411" y="540" class="small muted">Four Over Six：4/6 尺度</text><text x="411" y="563" class="small muted">SignRoundV2：位宽分配</text><rect x="644" y="484" width="232" height="110" rx="8" fill="#182230" stroke="#344355"/><rect x="644" y="496" width="3" height="86" fill="#e6bf88"/><text x="662" y="514" class="label" font-weight="600">纠正输入 / 内积失配</text><text x="662" y="540" class="small muted">GPTAQ：teacher 目标</text><text x="662" y="563" class="small muted">TurboQuant：在线向量</text><path d="M258 597V613" class="line"/><path d="M509 597V613" class="line"/><path d="M760 597V613" class="line"/><text x="24" y="646" class="year">2026</text><rect x="142" y="616" width="232" height="110" rx="8" fill="#182230" stroke="#344355"/><rect x="142" y="628" width="3" height="86" fill="#7dc6b2"/><text x="160" y="646" class="label" font-weight="600">层间独立旋转</text><text x="160" y="672" class="small muted">ReSpin：低秩连接</text><text x="160" y="695" class="small muted">自由度换训练与在线成本</text><rect x="393" y="616" width="232" height="110" rx="8" fill="#182230" stroke="#344355"/><rect x="393" y="628" width="3" height="86" fill="#a7b5ee"/><text x="411" y="646" class="label" font-weight="600">网格 / 元数据再优化</text><text x="411" y="672" class="small muted">Schur：组内联合搜索</text><text x="411" y="695" class="small muted">SAGE：scale 与 lookup</text><rect x="644" y="616" width="232" height="110" rx="8" fill="#182230" stroke="#344355"/><rect x="644" y="628" width="3" height="86" fill="#e6bf88"/><text x="662" y="646" class="label" font-weight="600">目标可靠性 / 动态反馈</text><text x="662" y="672" class="small muted">CoreQ：可达失配</text><text x="662" y="695" class="small muted">G²PTQ / REAL-Q：梯度</text><path d="M376 669H389" class="line"/><path d="M627 669H640" class="line"/><text x="24" y="778" class="small muted">按首次公开年份组织，可组合而非逐代替代；TurboQuant 正式发表为 ICLR 2026。截止 2026-11-19。</text></svg>