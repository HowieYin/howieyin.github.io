<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#dce4ef} .muted{fill:#9cabc0} .year{fill:#7dc6b2;font-size:17px;font-weight:600} .label{font-size:16px} .small{font-size:14px} .line{stroke:#718299;stroke-width:2;fill:none;marker-end:url(#svg-188de0f7-arrow)}</style>
<text x="24" y="34" font-size="22" font-weight="600">LLM PTQ：误差由谁承担，目标怎样改变，内核怎样执行</text><text x="142" y="68" class="small">异常值与坐标</text><text x="393" y="68" class="small">低位表示与取整</text><text x="644" y="68" class="small">目标与执行链</text><text x="24" y="118" class="year">2022</text><rect x="142" y="88" width="232" height="110" rx="8" fill="#182230" stroke="#344355"/><rect x="142" y="100" width="3" height="86" fill="#7dc6b2"/><text x="160" y="118" class="label" font-weight="600">分开 / 搬走异常</text><text x="160" y="144" class="small muted">LLM.int8()：FP16 例外</text><text x="160" y="167" class="small muted">SmoothQuant：W/A 尺度</text><rect x="393" y="88" width="232" height="110" rx="8" fill="#182230" stroke="#344355"/><rect x="393" y="100" width="3" height="86" fill="#a7b5ee"/><text x="411" y="118" class="label" font-weight="600">输入相关的误差补偿</text><text x="411" y="144" class="small muted">GPTQ：Hessian 代理</text><text x="411" y="167" class="small muted">剩余权重接住取整误差</text><rect x="644" y="88" width="232" height="110" rx="8" fill="#182230" stroke="#344355"/><rect x="644" y="100" width="3" height="86" fill="#e6bf88"/><text x="662" y="118" class="label" font-weight="600">从独立 RTN 到重建</text><text x="662" y="144" class="small muted">标定输入决定误差代价</text><text x="662" y="167" class="small muted">离线量化 ≠ 在线加速</text><path d="M258 201V217" class="line"/><path d="M509 201V217" class="line"/><path d="M760 201V217" class="line"/><text x="24" y="250" class="year">2023</text><rect x="142" y="220" width="232" height="110" rx="8" fill="#182230" stroke="#344355"/><rect x="142" y="232" width="3" height="86" fill="#7dc6b2"/><text x="160" y="250" class="label" font-weight="600">激活感知 / 可学习</text><text x="160" y="276" class="small muted">AWQ：保护重要通道</text><text x="160" y="299" class="small muted">OmniQuant：LET / LWC</text><rect x="393" y="220" width="232" height="110" rx="8" fill="#182230" stroke="#344355"/><rect x="393" y="232" width="3" height="86" fill="#a7b5ee"/><text x="411" y="250" class="label" font-weight=