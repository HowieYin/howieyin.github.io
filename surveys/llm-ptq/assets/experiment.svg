<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-labelledby="svg-52ef4370-title svg-52ef4370-desc">
<title id="svg-52ef4370-title">Pythia真实PTQ诊断</title><desc id="svg-52ef4370-desc">真实Pythia实验按NLL画粒度差异，并显示校准代理改善而PPL恶化和存储布局错误造成实际输出损害。</desc>
<defs><marker id="svg-52ef4370-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8292a8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#dce4ef} .muted{fill:#9cabc0} .year{fill:#7dc6b2;font-size:17px;font-weight:600} .label{font-size:16px} .small{font-size:14px} .line{stroke:#718299;stroke-width:2;fill:none;marker-end:url(#svg-52ef4370-arrow)}</style>
<text x="24" y="36" font-size="22" font-weight="600">实际 Pythia-70M：粒度有效，局部目标并不保证测试质量</text><text x="24" y="73" class="small muted">真实 WikiText2 前 4096 test tokens / 4080 targets；FP32 Q/DQ，非低位速度测试。</text><text x="24" y="119" class="label">固定 W4：测试 NLL，越低越好（nats/token）</text><text x="24" y="175" class="small">FP32</text><rect x="145" y="153" width="97.34" height="30" rx="3" fill="#7dc6b2"/><text x="252.34" y="175" class="small">4.409</text><text x="24" y="229" class="small">W4 tensor</text><rect x="145" y="207" width="552.53" height="30" rx="3" fill="#e6bf88"/><text x="707.53" y="229" class="small">25.028</text><text x="24" y="283" class="small">W4 row</text><rect x="145" y="261" width="110.72" height="30" rx="3" fill="#a7b5ee"/><text x="265.72" y="283" class="small">5.015</text><text x="24" y="337" class="small">W4 g128</text><rect x="145" y="315" width="106.76" height="30" rx="3" fill="#a7b5ee"/><text x="261.76" y="337" class="small">4.836</text><rect x="24" y="415" width="405" height="157" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="427" width="3" height="133" fill="#e6bf88"/><text x="42" y="445" class="label" font-weight="600">固定 g128：proxy ↓，PPL ↑</text><text x="42" y="471" class="small muted">RTN：proxy 0.066414 / PPL 125.921</text><text x="42" y="494" class="small muted">clip：proxy 0.050379 / PPL 133.040</text><text x="42" y="517" class="small muted">只改善校准代理仍可能失去泛化</text><rect x="470" y="415" width="406" height="157" rx="8" fill="#182230" stroke="#344355"/><rect x="470" y="427" width="3" height="133" fill="#a7b5ee"/><text x="488" y="445" class="label" font-weight="600">真实权重 / 激活的存储注入</text><text x="488" y="471" class="small muted">正确解码：0 code mismatch</text><text x="488" y="494" class="small muted">offset 错误：output rel L2 0.408</text><text x="488" y="517" class="small muted">layout 错误：output rel L2 1.342</text><text x="24" y="621" class="small muted">恢复原权重：NLL 与 sample logits 精确回归；实验不是 AWQ/GPTQ 或 HTP benchmark。</text></svg>