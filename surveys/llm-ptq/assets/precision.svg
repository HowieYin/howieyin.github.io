<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" role="img" aria-labelledby="svg-bdc9acb4-title svg-bdc9acb4-desc">
<title id="svg-bdc9acb4-title">量化数据与执行链</title><desc id="svg-bdc9acb4-desc">区分浮点参考、量化与反量化数值验证以及打包加载解码和低位内核运行，错误轴和布局会损坏输出。</desc>
<defs><marker id="svg-bdc9acb4-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8292a8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#dce4ef} .muted{fill:#9cabc0} .year{fill:#7dc6b2;font-size:17px;font-weight:600} .label{font-size:16px} .small{font-size:14px} .line{stroke:#718299;stroke-width:2;fill:none;marker-end:url(#svg-bdc9acb4-arrow)}</style>
<text x="24" y="36" font-size="22" font-weight="600">从 checkpoint 到输出：同一组码，也可能被错误解释</text><rect x="24" y="88" width="264" height="130" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="100" width="3" height="106" fill="#7dc6b2"/><text x="42" y="118" class="label" font-weight="600">浮点参考</text><text x="42" y="144" class="small muted">原始 W / 输入 X</text><text x="42" y="167" class="small muted">固定 tokenizer / context</text><path d="M290 153H314" class="line"/><rect x="318" y="88" width="264" height="130" rx="8" fill="#182230" stroke="#344355"/><rect x="318" y="100" width="3" height="106" fill="#a7b5ee"/><text x="336" y="118" class="label" font-weight="600">量化算法</text><text x="336" y="144" class="small muted">codes + scale + zero</text><text x="336" y="167" class="small muted">axis / group / round</text><path d="M584 153H608" class="line"/><rect x="612" y="88" width="264" height="130" rx="8" fill="#182230" stroke="#344355"/><rect x="612" y="100" width="3" height="106" fill="#7dc6b2"/><text x="630" y="118" class="label" font-weight="600">Q/DQ 参考</text><text x="630" y="144" class="small muted">反量化为 FP32 再乘</text><text x="630" y="167" class="small muted">质量证据，不是低位速度</text><path d="M450 220V274H155V309" class="line"/><rect x="24" y="312" width="264" height="145" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="324" width="3" height="121" fill="#e6bf88"/><text x="42" y="342" class="label" font-weight="600">Pack → Load → Unpack</text><text x="42" y="368" class="small muted">nibble / stride / tile reorder</text><text x="42" y="391" class="small muted">码、scale 与版本共同绑定</text><path d="M290 384H314" class="line"/><rect x="318" y="312" width="264" height="145" rx="8" fill="#182230" stroke="#344355"/><rect x="318" y="324" width="3" height="121" fill="#a7b5ee"/><text x="336" y="342" class="label" font-weight="600">真正 GEMM / attention</text><text x="336" y="368" class="small muted">低位数据读取 / 累加</text><text x="336" y="391" class="small muted">在线变换 / KV flush</text><path d="M584 384H608" class="line"/><rect x="612" y="312" width="264" height="145" rx="8" fill="#182230" stroke="#344355"/><rect x="612" y="324" width="3" height="121" fill="#a7b5ee"/><text x="630" y="342" class="label" font-weight="600">最终 logits / 生成</text><text x="630" y="368" class="small muted">PPL / KL / 任务独立测</text><text x="630" y="391" class="small muted">TTFT / TPOT / peak memory</text><text x="24" y="521" class="small muted">W4A16 常解码为浮点；W4A8 可以恢复 INT8 再用整数 Tensor Core。本文实跑上方 Q/DQ 与布局注入。</text></svg>