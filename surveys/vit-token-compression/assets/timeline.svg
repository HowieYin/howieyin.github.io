<title id="svg-22941250-title">ViT token 压缩技术发展总览</title><desc id="svg-22941250-desc">三条并行路线：选择与深度、聚合与重采样、任务系统约束。五阶段从ViT到2026前沿，并标出训练、空间、评测与算子瓶颈。</desc>
