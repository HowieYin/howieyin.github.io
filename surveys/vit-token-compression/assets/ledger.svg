<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 458" role="img" aria-labelledby="svg-968e068e-title svg-968e068e-desc">
<title id="svg-968e068e-title">token压缩的成本账</title><desc id="svg-968e068e-desc">投影MLP及注意力成本和压缩恢复额外操作分开记账，必须测per-op和整链。</desc>
<defs><marker id="svg-968e068e-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8292a8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#dce4ef} .muted{fill:#9cabc0} .year{fill:#7dc6b2;font-size:17px;font-weight:600} .label{font-size:16px} .small{font-size:14px} .line{stroke:#718299;stroke-width:2;fill:none;marker-end:url(#svg-968e068e-arrow)}</style>
<text x="24" y="36" font-size="22" font-weight="600">算得更少，必须覆盖新增操作的成本</text><rect x="24" y="78" width="405" height="140" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="90" width="3" height="116" fill="#7dc6b2"/><text x="42" y="108" class="label" font-weight="600">原 block：N 行</text><text x="42" y="134" class="small muted">QKV + 输出投影：4Nd²</text><text x="42" y="157" class="small muted">注意力：2N²d；MLP：8Nd²</text><text x="42" y="180" class="small muted">d=768、N=197：平方项仅约4.10%</text><rect x="470" y="78" width="406" height="140" rx="8" fill="#182230" stroke="#344355"/><rect x="470" y="90" width="3" height="116" fill="#7dc6b2"/><text x="488" y="108" class="label" font-weight="600">压缩后：N′ 行</text><text x="488" y="134" class="small muted">投影 / MLP / 注意力一起减少</text><text x="488" y="157" class="small muted">插入注意力之后：本层注意力不省</text><text x="488" y="180" class="small muted">有 CLS、保护行和恢复层时须另计</text><rect x="24" y="254" width="405" height="136" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="266" width="3" height="112" fill="#e6bf88"/><text x="42" y="284" class="label" font-weight="600">新增成本</text><text x="42" y="310" class="small muted">affinity / 排序 / gather / scatter</text><text x="42" y="333" class="small muted">size / 空间映射 / 临时矩阵</text><text x="42" y="356" class="small muted">恢复的完整 block、缓存与同步</text><rect x="470" y="254" width="406" height="136" rx="8" fill="#182230" stroke="#344355"/><rect x="470" y="266" width="3" height="112" fill="#a7b5ee"/><text x="488" y="284" class="label" font-weight="600">最终检验</text><text x="488" y="310" class="small muted">真实行数 + per-op + 整条链</text><text x="488" y="333" class="small muted">CPU / GPU / HTP 分别验证</text><text x="488" y="356" class="small muted">FLOPs 不等于延迟、峰值内存或功耗</text><path d="M430 148H466" class="line"/><path d="M226 220V250" class="line"/><path d="M674 220V250" class="line"/><text x="24" y="430" class="small muted">MAC 记账模型省略归一化、softmax、搬运和匹配；这些省略不能带入实测结论。</text></svg>