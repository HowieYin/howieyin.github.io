<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 456" role="img" aria-labelledby="svg-d3c56bfc-title svg-d3c56bfc-desc">
<title id="svg-d3c56bfc-title">VLM视觉token压缩位置</title><desc id="svg-d3c56bfc-desc">编码器内部、视觉语言接口、LLM早层之后三类位置分别承担不同计算与信息损失。</desc>
<defs><marker id="svg-d3c56bfc-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8292a8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#dce4ef} .muted{fill:#9cabc0} .year{fill:#7dc6b2;font-size:17px;font-weight:600} .label{font-size:16px} .small{font-size:14px} .line{stroke:#718299;stroke-width:2;fill:none;marker-end:url(#svg-d3c56bfc-arrow)}</style>
<text x="24" y="36" font-size="22" font-weight="600">VLM 压缩位置：越靠后，已支付的计算越多</text><rect x="24" y="94" width="156" height="96" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="106" width="3" height="72" fill="#7dc6b2"/><text x="42" y="124" class="label" font-weight="600">图像</text><text x="42" y="150" class="small muted">分辨率 / 裁图</text><path d="M181 141H194" class="line"/><rect x="198" y="94" width="156" height="96" rx="8" fill="#182230" stroke="#344355"/><rect x="198" y="106" width="3" height="72" fill="#7dc6b2"/><text x="216" y="124" class="label" font-weight="600">视觉编码器</text><text x="216" y="150" class="small muted">ViT block</text><path d="M355 141H368" class="line"/><rect x="372" y="94" width="156" height="96" rx="8" fill="#182230" stroke="#344355"/><rect x="372" y="106" width="3" height="72" fill="#7dc6b2"/><text x="390" y="124" class="label" font-weight="600">视觉桥</text><text x="390" y="150" class="small muted">projector / queries</text><path d="M529 141H542" class="line"/><rect x="546" y="94" width="156" height="96" rx="8" fill="#182230" stroke="#344355"/><rect x="546" y="106" width="3" height="72" fill="#7dc6b2"/><text x="564" y="124" class="label" font-weight="600">LLM prefill</text><text x="564" y="150" class="small muted">完整前缀多层</text><path d="M703 141H716" class="line"/><rect x="720" y="94" width="156" height="96" rx="8" fill="#182230" stroke="#344355"/><rect x="720" y="106" width="3" height="72" fill="#7dc6b2"/><text x="738" y="124" class="label" font-weight="600">LLM decode</text><text x="738" y="150" class="small muted">逐 token + KV</text><rect x="24" y="245" width="265" height="132" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="257" width="3" height="108" fill="#7dc6b2"/><text x="42" y="275" class="label" font-weight="600">① 编码器内部</text><text x="42" y="301" class="small muted">ToMe / DynamicViT / Cropr</text><text x="42" y="324" class="small muted">后续视觉 block 也可能省</text><text x="42" y="347" class="small muted">空间与任务信息尚未成熟</text><rect x="317" y="245" width="265" height="132" rx="8" fill="#182230" stroke="#344355"/><rect x="317" y="257" width="3" height="108" fill="#a7b5ee"/><text x="335" y="275" class="label" font-weight="600">② 视觉 → 语言接口</text><text x="335" y="301" class="small muted">BLIP-2 / VisionZip</text><text x="335" y="324" class="small muted">缩短语言前缀</text><text x="335" y="347" class="small muted">视觉编码器完整成本仍在</text><rect x="611" y="245" width="265" height="132" rx="8" fill="#182230" stroke="#344355"/><rect x="611" y="257" width="3" height="108" fill="#e6bf88"/><text x="629" y="275" class="label" font-weight="600">③ LLM 早层之后</text><text x="629" y="301" class="small muted">FastV</text><text x="629" y="324" class="small muted">先建立跨模态交互</text><text x="629" y="347" class="small muted">早层成本、KV兼容须核</text><path d="M277 192L156 241" class="line"/><path d="M450 192V241" class="line"/><path d="M623 192L744 241" class="line"/><text x="24" y="429" class="small muted">TTFT 从何时开始计？包含视觉、预处理与采样吗？prefill 时间与总请求时间需分开。</text></svg>