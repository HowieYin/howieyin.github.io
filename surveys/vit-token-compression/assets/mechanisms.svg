<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 546" role="img" aria-labelledby="svg-dd34afcf-title svg-dd34afcf-desc">
<title id="svg-dd34afcf-title">四种token压缩机制</title><desc id="svg-dd34afcf-desc">剪枝保留子集，合并聚合原行，重采样生成新摘要，自适应深度改变每行层数。</desc>
<defs><marker id="svg-dd34afcf-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8292a8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#dce4ef} .muted{fill:#9cabc0} .year{fill:#7dc6b2;font-size:17px;font-weight:600} .label{font-size:16px} .small{font-size:14px} .line{stroke:#718299;stroke-width:2;fill:none;marker-end:url(#svg-dd34afcf-arrow)}</style>
<text x="24" y="36" font-size="22" font-weight="600">同样更短，输出身份却不同</text><rect x="24" y="74" width="170" height="90" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="86" width="3" height="66" fill="#7dc6b2"/><text x="42" y="104" class="label" font-weight="600">原序列</text><text x="42" y="130" class="small muted">狗 / 天空 / 街牌</text><text x="42" y="153" class="small muted">两位行人</text><rect x="250" y="74" width="230" height="90" rx="8" fill="#182230" stroke="#344355"/><rect x="250" y="86" width="3" height="66" fill="#7dc6b2"/><text x="268" y="104" class="label" font-weight="600">剪枝</text><text x="268" y="130" class="small muted">原行子集：狗 / 街牌保留</text><text x="268" y="153" class="small muted">低分行退出，通常不再回来</text><rect x="536" y="74" width="340" height="90" rx="8" fill="#182230" stroke="#344355"/><rect x="536" y="86" width="3" height="66" fill="#7dc6b2"/><text x="554" y="104" class="label" font-weight="600">必须问的接口</text><text x="554" y="130" class="small muted">哪些行永久消失？</text><text x="554" y="153" class="small muted">位置、质量、个体差异是否保留？</text><path d="M195 119H246" class="line"/><path d="M481 119H532" class="line"/><rect x="24" y="186" width="170" height="90" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="198" width="3" height="66" fill="#7dc6b2"/><text x="42" y="216" class="label" font-weight="600">原序列</text><text x="42" y="242" class="small muted">狗 / 天空 / 街牌</text><text x="42" y="265" class="small muted">两位行人</text><rect x="250" y="186" width="230" height="90" rx="8" fill="#182230" stroke="#344355"/><rect x="250" y="198" width="3" height="66" fill="#7dc6b2"/><text x="268" y="216" class="label" font-weight="600">合并</text><text x="268" y="242" class="small muted">相似行 → 带 size 的摘要</text><text x="268" y="265" class="small muted">平均保宏观信息，差异会丢</text><rect x="536" y="186" width="340" height="90" rx="8" fill="#182230" stroke="#344355"/><rect x="536" y="198" width="3" height="66" fill="#7dc6b2"/><text x="554" y="216" class="label" font-weight="600">必须问的接口</text><text x="554" y="242" class="small muted">是否真的 gather 少行？</text><text x="554" y="265" class="small muted">恢复布局不等于找回信息</text><path d="M195 231H246" class="line"/><path d="M481 231H532" class="line"/><rect x="24" y="298" width="170" height="90" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="310" width="3" height="66" fill="#7dc6b2"/><text x="42" y="328" class="label" font-weight="600">原序列</text><text x="42" y="354" class="small muted">狗 / 天空 / 街牌</text><text x="42" y="377" class="small muted">两位行人</text><rect x="250" y="298" width="230" height="90" rx="8" fill="#182230" stroke="#344355"/><rect x="250" y="310" width="3" height="66" fill="#7dc6b2"/><text x="268" y="328" class="label" font-weight="600">重采样</text><text x="268" y="354" class="small muted">学习 mask → 新的摘要行</text><text x="268" y="377" class="small muted">区域可重叠，不是 Top-K</text><rect x="536" y="298" width="340" height="90" rx="8" fill="#182230" stroke="#344355"/><rect x="536" y="310" width="3" height="66" fill="#7dc6b2"/><text x="554" y="328" class="label" font-weight="600">必须问的接口</text><text x="554" y="354" class="small muted">是否真的 gather 少行？</text><text x="554" y="377" class="small muted">位置、质量、个体差异是否保留？</text><path d="M195 343H246" class="line"/><path d="M481 343H532" class="line"/><rect x="24" y="410" width="170" height="90" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="422" width="3" height="66" fill="#7dc6b2"/><text x="42" y="440" class="label" font-weight="600">原序列</text><text x="42" y="466" class="small muted">狗 / 天空 / 街牌</text><text x="42" y="489" class="small muted">两位行人</text><rect x="250" y="410" width="230" height="90" rx="8" fill="#182230" stroke="#344355"/><rect x="250" y="422" width="3" height="66" fill="#7dc6b2"/><text x="268" y="440" class="label" font-weight="600">自适应深度</text><text x="268" y="466" class="small muted">天空浅停，复杂行深走</text><text x="268" y="489" class="small muted">改变每行经过的层数</text><rect x="536" y="410" width="340" height="90" rx="8" fill="#182230" stroke="#344355"/><rect x="536" y="422" width="3" height="66" fill="#7dc6b2"/><text x="554" y="440" class="label" font-weight="600">必须问的接口</text><text x="554" y="466" class="small muted">是否真的 gather 少行？</text><text x="554" y="489" class="small muted">恢复布局不等于找回信息</text><path d="M195 455H246" class="line"/><path d="M481 455H532" class="line"/></svg>