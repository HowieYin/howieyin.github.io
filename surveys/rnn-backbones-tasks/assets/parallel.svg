<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 505" role="img" aria-label="两类并行：结合性扫描与非线性方程求解"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#81bba6"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#e3eaf3}.small{font-size:15px;fill:#b7c5d6}.lane{font-size:16px;fill:#9be0c0}.wire{fill:none;stroke:#81bba6;stroke-width:2;marker-end:url(#arrow)}</style><rect width="1200" height="505" rx="12" fill="#111821"/><text x="28" y="38" font-size="24" font-weight="600">两类并行：结合性扫描与非线性方程求解</text><text x="28" y="68" class="small">左侧系数可预计算；右侧每轮的系数依赖当前状态猜测。</text><path class="wire" d="M340,179.0 H382.5 V179.0 H425"/><path class="wire" d="M735,179.0 H777.5 V179.0 H820"/><path class="wire" d="M340,399.0 H382.5 V399.0 H425"/><path class="wire" d="M735,399.0 H777.5 V399.0 H820"/><rect x="30" y="130" width="310" height="98" rx="6" fill="#1a2634" stroke="#405368"/><text x="44" y="158" font-size="18" font-weight="600">① 输入先生成 a、b</text><text x="44" y="185" class="small">hₜ = aₜ ⊙ hₜ₋₁ + bₜ</text><text x="44" y="209" class="small">当前层系数不依赖未知 h</text><rect x="425" y="130" width="310" height="98" rx="6" fill="#1a2634" stroke="#405368"/><text x="439" y="158" font-size="18" font-weight="600">② 合成相邻仿射映射</text><text x="439" y="185" class="small">先 1 后 2：a₂a₁，a₂b₁+b₂</text><text x="439" y="209" class="small">可结合，不可交换</text><rect x="820" y="130" width="310" height="98" rx="6" fill="#1a2634" stroke="#405368"/><text x="834" y="158" font-size="18" font-weight="600">③ 树形前缀扫描</text><text x="834" y="185" class="small">minGRU / mLSTM 等结构</text><text x="834" y="209" class="small">重结合要看浮点误差</text><rect x="30" y="350" width="310" height="98" rx="6" fill="#1a2634" stroke="#405368"/><text x="44" y="378" font-size="18" font-weight="600">① 猜测整段 H</text><text x="44" y="405" class="small">rₜ = hₜ − F(hₜ₋₁,xₜ)</text><text x="44" y="429" class="small">保留 nonlinear update</text><rect x="425" y="350" width="310" height="98" rx="6" fill="#1a2634" stroke="#405368"/><text x="439" y="378" font-size="18" font-weight="600">② Jacobian 与残差</text><text x="439" y="405" class="small">并行解线性化系统</text><text x="439" y="429" class="small">block 结构决定成本</text><rect x="820" y="350" width="310" height="98" rx="6" fill="#1a2634" stroke="#405368"/><text x="834" y="378" font-size="18" font-weight="600">③ 更新猜测，再迭代</text><text x="834" y="405" class="small">ParaRNN：检查 residual</text><text x="834" y="429" class="small">少轮收敛才有实际收益</text></svg>