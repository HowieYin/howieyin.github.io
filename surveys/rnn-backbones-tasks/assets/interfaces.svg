<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="Backbone 与任务：编码、递归、监督与输出各有责任"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#81bba6"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#e3eaf3}.small{font-size:15px;fill:#b7c5d6}.lane{font-size:16px;fill:#9be0c0}.wire{fill:none;stroke:#81bba6;stroke-width:2;marker-end:url(#arrow)}</style><rect width="1200" height="620" rx="12" fill="#111821"/><text x="28" y="38" font-size="24" font-weight="600">Backbone 与任务：编码、递归、监督与输出各有责任</text><text x="28" y="68" class="small">沿输入输出路线读；方向与状态形状由任务可见性决定。</text><path class="wire" d="M280,168.0 H307.5 V168.0 H335"/><path class="wire" d="M585,168.0 H612.5 V168.0 H640"/><path class="wire" d="M890,168.0 H917.5 V168.0 H945"/><path class="wire" d="M280,348.0 H307.5 V348.0 H335"/><path class="wire" d="M585,348.0 H612.5 V348.0 H640"/><path class="wire" d="M890,348.0 H917.5 V348.0 H945"/><path class="wire" d="M280,528.0 H307.5 V528.0 H335"/><path class="wire" d="M585,528.0 H612.5 V528.0 H640"/><path class="wire" d="M890,528.0 H917.5 V528.0 H945"/><rect x="30" y="120" width="250" height="96" rx="6" fill="#1a2634" stroke="#405368"/><text x="44" y="148" font-size="18" font-weight="600">token / 声学帧 / 图像列</text><text x="44" y="175" class="small">embedding / acoustic / CNN</text><text x="44" y="199" class="small">先定义每一步输入</text><rect x="335" y="120" width="250" height="96" rx="6" fill="#1a2634" stroke="#405368"/><text x="349" y="148" font-size="18" font-weight="600">向量 / 双向递归</text><text x="349" y="175" class="small">h，或 h+c；逐步更新</text><text x="349" y="199" class="small">双向会读取未来后缀</text><rect x="640" y="120" width="250" height="96" rx="6" fill="#1a2634" stroke="#405368"/><text x="654" y="148" font-size="18" font-weight="600">token logits / CTC / RNN-T</text><text x="654" y="175" class="small">next-token / alignment / joint</text><text x="654" y="199" class="small">损失与解码不属于 cell</text><rect x="945" y="120" width="230" height="96" rx="6" fill="#1a2634" stroke="#405368"/><text x="959" y="148" font-size="18" font-weight="600">字符串 / 类别</text><text x="959" y="175" class="small">beam、词表、字典</text><text x="959" y="199" class="small">识别与检测不同</text><rect x="30" y="300" width="250" height="96" rx="6" fill="#1a2634" stroke="#405368"/><text x="44" y="328" font-size="18" font-weight="600">图像 / 视频 / 关节</text><text x="44" y="355" class="small">patch / feature map / pose</text><text x="44" y="379" class="small">时间、空间、迭代区分</text><rect x="335" y="300" width="250" height="96" rx="6" fill="#1a2634" stroke="#405368"/><text x="349" y="328" font-size="18" font-weight="600">空间 / 时间状态</text><text x="349" y="355" class="small">ConvLSTM / VRWKV / 修正</text><text x="349" y="379" class="small">网格不能错误展平</text><rect x="640" y="300" width="250" height="96" rx="6" fill="#1a2634" stroke="#405368"/><text x="654" y="328" font-size="18" font-weight="600">检测 / mask / landmark head</text><text x="654" y="355" class="small">box、像素、坐标监督</text><text x="654" y="379" class="small">保留多尺度与位置</text><rect x="945" y="300" width="230" height="96" rx="6" fill="#1a2634" stroke="#405368"/><text x="959" y="328" font-size="18" font-weight="600">位置 / 掩码 / 轨迹</text><text x="959" y="355" class="small">坐标还原 / 跟踪</text><text x="959" y="379" class="small">按对应指标验证</text><rect x="30" y="480" width="250" height="96" rx="6" fill="#1a2634" stroke="#405368"/><text x="44" y="508" font-size="18" font-weight="600">多变量与协变量</text><text x="44" y="535" class="small">mask / 时间差 / scale</text><text x="44" y="559" class="small">已知未来 ≠ 未来真值</text><rect x="335" y="480" width="250" height="96" rx="6" fill="#1a2634" stroke="#405368"/><text x="349" y="508" font-size="18" font-weight="600">概率 / 混合递归</text><text x="349" y="535" class="small">DeepAR / TFT / TiRex-2</text><text x="349" y="559" class="small">跨时间与跨变量分开</text><rect x="640" y="480" width="250" height="96" rx="6" fill="#1a2634" stroke="#405368"/><text x="654" y="508" font-size="18" font-weight="600">分布 / quantile head</text><text x="654" y="535" class="small">likelihood / pinball loss</text><text x="654" y="559" class="small">校准与路径相关性</text><rect x="945" y="480" width="230" height="96" rx="6" fill="#1a2634" stroke="#405368"/><text x="959" y="508" font-size="18" font-weight="600">未来分布与区间</text><text x="959" y="535" class="small">采样 / 分位数</text><text x="959" y="559" class="small">MASE、CRPS、覆盖</text></svg>