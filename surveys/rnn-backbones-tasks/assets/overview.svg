<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-label="RNN 的发展：状态、任务与硬件的三条并行路线"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#81bba6"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#e3eaf3}.small{font-size:15px;fill:#b7c5d6}.lane{font-size:16px;fill:#9be0c0}.wire{fill:none;stroke:#81bba6;stroke-width:2;marker-end:url(#arrow)}</style><rect width="1200" height="660" rx="12" fill="#111821"/><text x="28" y="38" font-size="24" font-weight="600">RNN 的发展：状态、任务与硬件的三条并行路线</text><text x="28" y="68" class="small">箭头表示问题与机制的延续；SSM、线性注意力与混合模型保留不同身份。</text><text x="30" y="107" class="lane">状态与记忆</text><text x="30" y="296" class="lane">任务与信息可见性</text><text x="30" y="486" class="lane">计算组织</text><path class="wire" d="M275,174.0 H302.5 V174.0 H330"/><path class="wire" d="M575,174.0 H602.5 V174.0 H630"/><path class="wire" d="M875,174.0 H902.5 V174.0 H930"/><path class="wire" d="M275,364.0 H302.5 V364.0 H330"/><path class="wire" d="M575,364.0 H602.5 V364.0 H630"/><path class="wire" d="M875,364.0 H902.5 V364.0 H930"/><path class="wire" d="M275,554.0 H302.5 V554.0 H330"/><path class="wire" d="M575,554.0 H602.5 V554.0 H630"/><path class="wire" d="M875,554.0 H902.5 V554.0 H930"/><path class="wire" d="M452.5,223 V269.0 H452.5 V315"/><path class="wire" d="M752.5,223 V364.0 H752.5 V505"/><rect x="30" y="125" width="245" height="98" rx="6" fill="#1a2634" stroke="#405368"/><text x="44" y="153" font-size="18" font-weight="600">Elman / BPTT</text><text x="44" y="180" class="small">1988–1994：学习时间结构</text><text x="44" y="204" class="small">长期梯度难传播</text><rect x="330" y="125" width="245" height="98" rx="6" fill="#1a2634" stroke="#405368"/><text x="344" y="153" font-size="18" font-weight="600">LSTM → forget → GRU</text><text x="344" y="180" class="small">1997–2014：读写与遗忘</text><text x="344" y="204" class="small">双向、投影、深层骨干</text><rect x="630" y="125" width="245" height="98" rx="6" fill="#1a2634" stroke="#405368"/><text x="644" y="153" font-size="18" font-weight="600">sLSTM / mLSTM / RWKV</text><text x="644" y="180" class="small">2023–2025：动态门、矩阵</text><text x="644" y="204" class="small">delta 更新与状态跟踪</text><rect x="930" y="125" width="240" height="98" rx="6" fill="#1a2634" stroke="#405368"/><text x="944" y="153" font-size="18" font-weight="600">2025–2026：记忆几何</text><text x="944" y="180" class="small">KDA / Preconditioned Delta</text><text x="944" y="204" class="small">容量、纠错与计算折中</text><rect x="30" y="315" width="245" height="98" rx="6" fill="#1a2634" stroke="#405368"/><text x="44" y="343" font-size="18" font-weight="600">输入 → 状态 → task head</text><text x="44" y="370" class="small">语言 / 分类 / 序列标注</text><text x="44" y="394" class="small">Backbone 与监督分开</text><rect x="330" y="315" width="245" height="98" rx="6" fill="#1a2634" stroke="#405368"/><text x="344" y="343" font-size="18" font-weight="600">CTC / RNN-T / 空间递归</text><text x="344" y="370" class="small">语音与 OCR：对齐</text><text x="344" y="394" class="small">视觉：位置、多阶段修正</text><rect x="630" y="315" width="245" height="98" rx="6" fill="#1a2634" stroke="#405368"/><text x="644" y="343" font-size="18" font-weight="600">ConvLSTM / TFT / VRWKV</text><text x="644" y="370" class="small">视频、概率预测、视觉</text><text x="644" y="394" class="small">空间 / 时间 / 已知未来</text><rect x="930" y="315" width="240" height="98" rx="6" fill="#1a2634" stroke="#405368"/><text x="944" y="343" font-size="18" font-weight="600">TiRex / TiRex-2</text><text x="944" y="370" class="small">预测基础模型与变量混合</text><text x="944" y="394" class="small">评测协议、公开流接口</text><rect x="30" y="505" width="245" height="98" rx="6" fill="#1a2634" stroke="#405368"/><text x="44" y="533" font-size="18" font-weight="600">经典逐步执行</text><text x="44" y="560" class="small">时间状态相互依赖</text><text x="44" y="584" class="small">训练存激活，推理传状态</text><rect x="330" y="505" width="245" height="98" rx="6" fill="#1a2634" stroke="#405368"/><text x="344" y="533" font-size="18" font-weight="600">QRNN / SRU / IndRNN</text><text x="344" y="560" class="small">移出稠密跨通道计算</text><text x="344" y="584" class="small">各自非线性依赖仍要看</text><rect x="630" y="505" width="245" height="98" rx="6" fill="#1a2634" stroke="#405368"/><text x="644" y="533" font-size="18" font-weight="600">minRNN / Mamba / SSD</text><text x="644" y="560" class="small">输入依赖的可扫描更新</text><text x="644" y="584" class="small">chunk matmul 与 fused kernel</text><rect x="930" y="505" width="240" height="98" rx="6" fill="#1a2634" stroke="#405368"/><text x="944" y="533" font-size="18" font-weight="600">ParaRNN / hybrid</text><text x="944" y="560" class="small">非线性并行求解 / 部分注意力</text><text x="944" y="584" class="small">收敛、缓存与实际延迟</text></svg>