<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" role="img" aria-label="有限记忆的三种写入：向量、关联矩阵、delta 纠错"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#81bba6"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#e3eaf3}.small{font-size:15px;fill:#b7c5d6}.lane{font-size:16px;fill:#9be0c0}.wire{fill:none;stroke:#81bba6;stroke-width:2;marker-end:url(#arrow)}</style><rect width="1200" height="490" rx="12" fill="#111821"/><text x="28" y="38" font-size="24" font-weight="600">有限记忆的三种写入：向量、关联矩阵、delta 纠错</text><text x="28" y="68" class="small">这是机制示意，矩阵没有为每个历史 token 分配一个独占格子。</text><path class="wire" d="M190.0,233 V284.0 H190.0 V335"/><path class="wire" d="M590.0,233 V284.0 H590.0 V335"/><path class="wire" d="M990.0,233 V284.0 H990.0 V335"/><rect x="30" y="135" width="320" height="98" rx="6" fill="#1a2634" stroke="#405368"/><text x="44" y="163" font-size="18" font-weight="600">向量 state h / c</text><text x="44" y="190" class="small">输入 + 旧状态 → 新状态</text><text x="44" y="214" class="small">压缩为任务相关表征</text><rect x="430" y="135" width="320" height="98" rx="6" fill="#1a2634" stroke="#405368"/><text x="444" y="163" font-size="18" font-weight="600">矩阵外积累积</text><text x="444" y="190" class="small">旧矩阵 + value × keyᵀ</text><text x="444" y="214" class="small">关联共享方向，可能干扰</text><rect x="830" y="135" width="320" height="98" rx="6" fill="#1a2634" stroke="#405368"/><text x="844" y="163" font-size="18" font-weight="600">带门 delta 更新</text><text x="844" y="190" class="small">先衰减，再读出当前 key</text><text x="844" y="214" class="small">value − 旧预测 = 写入误差</text><rect x="30" y="335" width="320" height="98" rx="6" fill="#1a2634" stroke="#405368"/><text x="44" y="363" font-size="18" font-weight="600">门控制保留与读写</text><text x="44" y="390" class="small">LSTM / GRU / sLSTM</text><text x="44" y="414" class="small">训练仍要学会写入</text><rect x="430" y="335" width="320" height="98" rx="6" fill="#1a2634" stroke="#405368"/><text x="444" y="363" font-size="18" font-weight="600">query 读出 Cq</text><text x="444" y="390" class="small">mLSTM / retention / SSD</text><text x="444" y="414" class="small">normalizer、stabilizer 另计</text><rect x="830" y="335" width="320" height="98" rx="6" fill="#1a2634" stroke="#405368"/><text x="844" y="363" font-size="18" font-weight="600">沿 key 方向修正</text><text x="844" y="390" class="small">新 S × query → norm / gate</text><text x="844" y="414" class="small">GDN / KDA：有限关联记忆</text></svg>