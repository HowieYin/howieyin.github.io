<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 515" role="img" aria-label="完整状态生命周期：chunk 延续，独立请求归零"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#81bba6"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#e3eaf3}.small{font-size:15px;fill:#b7c5d6}.lane{font-size:16px;fill:#9be0c0}.wire{fill:none;stroke:#81bba6;stroke-width:2;marker-end:url(#arrow)}</style><rect width="1200" height="515" rx="12" fill="#111821"/><text x="28" y="38" font-size="24" font-weight="600">完整状态生命周期：chunk 延续，独立请求归零</text><text x="28" y="68" class="small">checkpoint 要绑定模型、位置、dtype、层/方向及 batch 样本身份。</text><path class="wire" d="M265,194.0 H292.5 V194.0 H320"/><path class="wire" d="M555,194.0 H582.5 V194.0 H610"/><path class="wire" d="M845,194.0 H872.5 V194.0 H900"/><rect x="30" y="145" width="235" height="98" rx="6" fill="#1a2634" stroke="#405368"/><text x="44" y="173" font-size="18" font-weight="600">① 独立请求 A</text><text x="44" y="200" class="small">创建完整零状态</text><text x="44" y="224" class="small">LSTM 包括 h 和 c</text><rect x="320" y="145" width="235" height="98" rx="6" fill="#1a2634" stroke="#405368"/><text x="334" y="173" font-size="18" font-weight="600">② 处理 chunk 1</text><text x="334" y="200" class="small">输入 + state → 新 state</text><text x="334" y="224" class="small">有效输出后确认状态</text><rect x="610" y="145" width="235" height="98" rx="6" fill="#1a2634" stroke="#405368"/><text x="624" y="173" font-size="18" font-weight="600">③ 保存与恢复</text><text x="624" y="200" class="small">所有 state tensor 一并传递</text><text x="624" y="224" class="small">不要只保存可见 h</text><rect x="900" y="145" width="265" height="98" rx="6" fill="#1a2634" stroke="#405368"/><text x="914" y="173" font-size="18" font-weight="600">④ 继续 chunk 2</text><text x="914" y="200" class="small">位置与样本顺序匹配</text><text x="914" y="224" class="small">结果应与全段基线一致</text><rect x="30" y="360" width="235" height="98" rx="6" fill="#1a2634" stroke="#405368"/><text x="44" y="388" font-size="18" font-weight="600">下一请求 B</text><text x="44" y="415" class="small">重新初始化自己的状态</text><text x="44" y="439" class="small">A 的 final state 不给 B</text><rect x="320" y="360" width="235" height="98" rx="6" fill="#1a2634" stroke="#405368"/><text x="334" y="388" font-size="18" font-weight="600">误清每个 chunk</text><text x="334" y="415" class="small">前缀记忆被删除</text><text x="334" y="439" class="small">能返回不表示正确</text><rect x="610" y="360" width="235" height="98" rx="6" fill="#1a2634" stroke="#405368"/><text x="624" y="388" font-size="18" font-weight="600">遗漏 c / 轴错误</text><text x="624" y="415" class="small">shape 对也可能语义错</text><text x="624" y="439" class="small">完整恢复 + 类别验证</text><rect x="900" y="360" width="265" height="98" rx="6" fill="#1a2634" stroke="#405368"/><text x="914" y="388" font-size="18" font-weight="600">detach / INT8 边界</text><text x="914" y="415" class="small">切梯度 / 改数值分别测</text><text x="914" y="439" class="small">不等于清状态 / W8A8</text></svg>