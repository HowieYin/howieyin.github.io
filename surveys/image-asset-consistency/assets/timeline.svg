<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 794" role="img" aria-labelledby="svg-75543f17-title svg-75543f17-desc">
<title id="svg-75543f17-title">素材一致性技术发展总览</title><desc id="svg-75543f17-desc">三条并行路线连接参数个性化、即时参考和结构编辑，标明时间、机制突破和瓶颈。</desc>
<defs><marker id="svg-75543f17-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8292a8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#dce4ef} .muted{fill:#9cabc0} .year{fill:#7dc6b2;font-size:17px;font-weight:600} .label{font-size:16px} .small{font-size:14px} .line{stroke:#718299;stroke-width:2;fill:none;marker-end:url(#svg-75543f17-arrow)}</style>
<text x="24" y="36" font-size="23" font-weight="600">素材一致性：记住什么、允许改什么、信息属于谁</text><text x="138" y="75" class="label">写入专属参数</text><text x="390" y="75" class="label">推理时读取参考</text><text x="642" y="75" class="label">编辑与空间关系</text><text x="24" y="124" class="year">2022</text><rect x="138" y="92" width="234" height="112" rx="8" fill="#182230" stroke="#344355"/><rect x="138" y="104" width="3" height="88" fill="#7dc6b2"/><text x="156" y="122" class="label" font-weight="600">低维词 → 全权重</text><text x="156" y="148" class="small muted">TI / DreamBooth</text><text x="156" y="171" class="small muted">保真提高，背景也可能被记住</text><path d="M255 207V218" class="line"/><rect x="390" y="92" width="234" height="112" rx="8" fill="#182230" stroke="#344355"/><rect x="390" y="104" width="3" height="88" fill="#a7b5ee"/><text x="408" y="122" class="label" font-weight="600">即时参考的需求</text><text x="408" y="148" class="small muted">每主体训练成本高</text><text x="408" y="171" class="small muted">需把适配摊到共享模型</text><path d="M507 207V218" class="line"/><rect x="642" y="92" width="234" height="112" rx="8" fill="#182230" stroke="#344355"/><rect x="642" y="104" width="3" height="88" fill="#e6bf88"/><text x="660" y="122" class="label" font-weight="600">注意力地图与特征</text><text x="660" y="148" class="small muted">Prompt-to-Prompt / PnP</text><text x="660" y="171" class="small muted">保护布局，反演仍有误差</text><path d="M759 207V218" class="line"/><text x="24" y="253" class="year">2023</text><rect x="138" y="221" width="234" height="112" rx="8" fill="#182230" stroke="#344355"/><rect x="138" y="233" width="3" height="88" fill="#7dc6b2"/><text x="156" y="251" class="label" font-weight="600">选择性更新与合并</text><text x="156" y="277" class="small muted">Custom / 图像 LoRA / Zip</text><text x="156" y="300" class="small muted">小资产，主体与风格仍冲突</text><path d="M255 336V347" class="line"/><rect x="390" y="221" width="234" height="112" rx="8" fill="#182230" stroke="#344355"/><rect x="390" y="233" width="3" height="88" fill="#a7b5ee"/><text x="408" y="251" class="label" font-weight="600">共享视觉与多照条件</text><text x="408" y="277" class="small muted">BLIP / IP / PhotoMaker</text><text x="408" y="300" class="small muted">每用户免微调，语义≠身份</text><path d="M507 336V347" class="line"/><rect x="642" y="221" width="234" height="112" rx="8" fill="#182230" stroke="#344355"/><rect x="642" y="233" width="3" height="88" fill="#e6bf88"/><text x="660" y="251" class="label" font-weight="600">几何约束与源内容</text><text x="660" y="277" class="small muted">ControlNet / MasaCtrl</text><text x="660" y="300" class="small muted">位置、姿态与身份各有职责</text><path d="M759 336V347" class="line"/><text x="24" y="382" class="year">2024</text><rect x="138" y="350" width="234" height="112" rx="8" fill="#182230" stroke="#344355"/><rect x="138" y="362" width="3" height="88" fill="#7dc6b2"/><text x="156" y="380" class="label" font-weight="600">专属资产与共享条件</text><text x="156" y="406" class="small muted">用户 LoRA 可与适配器组合</text><text x="156" y="429" class="small muted">适配模块也可能含 LoRA</text><path d="M255 465V476" class="line"/><rect x="390" y="350" width="234" height="112" rx="8" fill="#182230" stroke="#344355"/><rect x="390" y="362" width="3" height="88" fill="#a7b5ee"/><text x="408" y="380" class="label" font-weight="600">身份、布局与局部对齐</text><text x="408" y="406" class="small muted">InstantID / PuLID / 局部身份</text><text x="408" y="429" class="small muted">身份更强，指令自由度需保护</text><path d="M507 465V476" class="line"/><rect x="642" y="350" width="234" height="112" rx="8" fill="#182230" stroke="#344355"/><rect x="642" y="362" width="3" height="88" fill="#e6bf88"/><text x="660" y="380" class="label" font-weight="600">跨图片共享主体</text><text x="660" y="406" class="small muted">ConsiStory / StoryDiffusion</text><text x="660" y="429" class="small muted">角色更稳，属性与背景会泄漏</text><path d="M759 465V476" class="line"/><text x="24" y="511" class="year">2025</text><rect x="138" y="479" width="234" height="112" rx="8" fill="#182230" stroke="#344355"/><rect x="138" y="491" width="3" height="88" fill="#7dc6b2"/><text x="156" y="509" class="label" font-weight="600">参考寻址与细节融合</text><text x="156" y="535" class="small muted">DreamO / XVerse</text><text x="156" y="558" class="small muted">多种素材，不只是人脸</text><path d="M255 594V605" class="line"/><rect x="390" y="479" width="234" height="112" rx="8" fill="#182230" stroke="#344355"/><rect x="390" y="491" width="3" height="88" fill="#a7b5ee"/><text x="408" y="509" class="label" font-weight="600">多人物与不同姿态</text><text x="408" y="535" class="small muted">UMO / WithAnyone</text><text x="408" y="558" class="small muted">抑制串脸和参考姿态复制</text><path d="M507 594V605" class="line"/><rect x="642" y="479" width="234" height="112" rx="8" fill="#182230" stroke="#344355"/><rect x="642" y="491" width="3" height="88" fill="#e6bf88"/><text x="660" y="509" class="label" font-weight="600">原生上下文编辑</text><text x="660" y="535" class="small muted">Kontext / OmniGen2 / Qwen</text><text x="660" y="558" class="small muted">语义＋latent，仍不是无损</text><path d="M759 594V605" class="line"/><text x="24" y="640" class="year">2026</text><rect x="138" y="608" width="234" height="112" rx="8" fill="#182230" stroke="#344355"/><rect x="138" y="620" width="3" height="88" fill="#7dc6b2"/><text x="156" y="638" class="label" font-weight="600">局部风格优化</text><text x="156" y="664" class="small muted">Stylus：测试时额外计算</text><text x="156" y="687" class="small muted">身份、内容与风格分开测</text><rect x="390" y="608" width="234" height="112" rx="8" fill="#182230" stroke="#344355"/><rect x="390" y="620" width="3" height="88" fill="#a7b5ee"/><text x="408" y="638" class="label" font-weight="600">身份绑定布局</text><text x="408" y="664" class="small muted">WithEveryone：五至十人</text><text x="408" y="687" class="small muted">小脸与公开复现仍是边界</text><rect x="642" y="608" width="234" height="112" rx="8" fill="#182230" stroke="#344355"/><rect x="642" y="620" width="3" height="88" fill="#e6bf88"/><text x="660" y="638" class="label" font-weight="600">属性、锚点与反馈</text><text x="660" y="664" class="small muted">AttriStory / ELECT / 闭环</text><text x="660" y="687" class="small muted">长链漂移，候选与测量有成本</text><path d="M374 533H386" class="line"/><path d="M628 533H638" class="line"/><text x="24" y="768" class="small muted">按首次公开年份，三条路线可组合；2026 行包含早期工作的续版与新任务。截止 2026-11-20。</text></svg>