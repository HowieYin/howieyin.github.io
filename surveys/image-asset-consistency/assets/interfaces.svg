<text x="24" y="36" font-size="23" font-weight="600">参考信息进入模型的五种接口</text><rect x="24" y="278" width="180" height="116" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="290" width="3" height="92" fill="#7dc6b2"/><text x="42" y="308" class="label" font-weight="600">参考素材</text><text x="42" y="334" class="small muted">照片 / 商品 / 风格</text><text x="42" y="357" class="small muted">身份与属性不同</text><rect x="250" y="70" width="626" height="100" rx="8" fill="#182230" stroke="#344355"/><rect x="250" y="82" width="3" height="76" fill="#7dc6b2"/><text x="268" y="100" class="label" font-weight="600">专属权重</text><text x="268" y="126" class="small muted">DreamBooth / 用户 LoRA</text><text x="268" y="149" class="small muted">离线训练后加载</text><path d="M226 120H246" class="line"/><rect x="250" y="180" width="626" height="100" rx="8" fill="#182230" stroke="#344355"/><rect x="250" y="192" width="3" height="76" fill="#7dc6b2"/><text x="268" y="210" class="label" font-weight="600">文字软 token</text><text x="268" y="236" class="small muted">TI / BLIP / PhotoMaker</text><text x="268" y="259" class="small muted">进入文字条件路径</text><path d="M226 230H246" class="line"/><rect x="250" y="290" width="626" height="100" rx="8" fill="#182230" stroke="#344355"/><rect x="250" y="302" width="3" height="76" fill="#7dc6b2"/><text x="268" y="320" class="label" font-weight="600">图像注意力</text><text x="268" y="346" class="small muted">IP / InstantID / PuLID</text><text x="268" y="369" class="small muted">独立或特定身份支路</text><path d="M226 340H246" class="line"/><rect x="250" y="400" width="626" height="100" rx="8" fill="#182230" stroke="#344355"/><rect x="250" y="412" width="3" height="76" fill="#7dc6b2"/><text x="268" y="430" class="label" font-weight="600">空间 latent</text><text x="268" y="456" class="small muted">DreamO / 原生编辑</text><text x="268" y="479" class="small muted">保留更多图像位置细节</text><path d="M226 450H246" class="line"/><rect x="250" y="510" width="626" height="100" rx="8" fill="#182230" stroke="#344355"/><rect x=