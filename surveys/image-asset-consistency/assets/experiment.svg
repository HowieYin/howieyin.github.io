<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 515" role="img" aria-labelledby="svg-d492c3dc-title svg-d492c3dc-desc">
<title id="svg-d492c3dc-title">编码器与像素保真实际诊断</title><desc id="svg-d492c3dc-desc">亮度变化与JPEG会改变区域外像素，即使DINO和CLIP很高。</desc>
<defs><marker id="svg-d492c3dc-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8292a8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#dce4ef} .muted{fill:#9cabc0} .year{fill:#7dc6b2;font-size:17px;font-weight:600} .label{font-size:16px} .small{font-size:14px} .line{stroke:#718299;stroke-width:2;fill:none;marker-end:url(#svg-d492c3dc-arrow)}</style>
<text x="24" y="36" font-size="23" font-weight="600">真实输入诊断：高特征相似，不保证像素没变</text><rect x="24" y="92" width="264" height="142" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="104" width="3" height="118" fill="#e6bf88"/><text x="42" y="122" class="label" font-weight="600">亮度 × 0.7</text><text x="42" y="148" class="small muted">DINO 0.9954 / CLIP 0.9798</text><text x="42" y="171" class="small muted">区域外 99.69% 像素变化</text><rect x="318" y="92" width="264" height="142" rx="8" fill="#182230" stroke="#344355"/><rect x="318" y="104" width="3" height="118" fill="#7dc6b2"/><text x="336" y="122" class="label" font-weight="600">精确红块 → PNG</text><text x="336" y="148" class="small muted">DINO 0.9681 / CLIP 0.9210</text><text x="336" y="171" class="small muted">区域外 0 像素变化</text><rect x="612" y="92" width="264" height="142" rx="8" fill="#182230" stroke="#344355"/><rect x="612" y="104" width="3" height="118" fill="#a7b5ee"/><text x="630" y="122" class="label" font-weight="600">同一红块 → JPEG90</text><text x="630" y="148" class="small muted">DINO 0.9677 / CLIP 0.9128</text><text x="630" y="171" class="small muted">区域外 69.45% 像素变化</text><rect x="24" y="292" width="406" height="143" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="304" width="3" height="119" fill="#7dc6b2"/><text x="42" y="322" class="label" font-weight="600">特征相似测的是表征</text><text x="42" y="348" class="small muted">编码器可忽略亮度、翻转等变化</text><text x="42" y="371" class="small muted">身份 / 类别 / 风格不是同一表征</text><rect x="468" y="292" width="408" height="143" rx="8" fill="#182230" stroke="#344355"/><rect x="468" y="304" width="3" height="119" fill="#e6bf88"/><text x="486" y="322" class="label" font-weight="600">区域外误差测的是输出链</text><text x="486" y="348" class="small muted">同坐标对齐后比较 RGB 像素</text><text x="486" y="371" class="small muted">输出 JPEG 也能改坏背景</text><text x="24" y="487" class="small muted">8 张 DreamBench++ 实图 × 8 变换，CPU FP32；不是生成模型或身份准确率实验。</text></svg>