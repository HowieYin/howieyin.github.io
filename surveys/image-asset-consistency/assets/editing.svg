<text x="24" y="36" font-size="23" font-weight="600">编辑中的 Q / K / V：到底交换了什么</text><rect x="24" y="86" width="258" height="116" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="98" width="3" height="92" fill="#7dc6b2"/><text x="42" y="116" class="label" font-weight="600">Prompt-to-Prompt</text><text x="42" y="142" class="small muted">源交叉注意力地图</text><rect x="334" y="86" width="542" height="116" rx="8" fill="#182230" stroke="#344355"/><rect x="334" y="98" width="3" height="92" fill="#a7b5ee"/><text x="352" y="116" class="label" font-weight="600">保持对象与边界</text><text x="352" y="142" class="small muted">文字→位置对应沿用</text><text x="352" y="165" class="small muted">目标文字 V 提供新内容</text><path d="M284 144H330" class="line"/><rect x="24" y="234" width="258" height="116" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="246" width="3" height="92" fill="#7dc6b2"/><text x="42" y="264" class="label" font-weight="600">PnP Features</text><text x="42" y="290" class="small muted">源特征＋源 Q/K</text><rect x="334" y="234" width="542" height="116" rx="8" fill="#182230" stroke="#344355"/><rect x="334" y="246" width="3" height="92" fill="#a7b5ee"/><text x="352" y="264" class="label" font-weight="600">保持对象与边界</text><text x="352" y="290" class="small muted">图像内部布局与亲和沿用</text><text x="352" y="313" class="small muted">目标 V 表达新外观</text><path d="M284 292H330" class="line"/><rect x="24" y="382" width="258" height="116" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="394" width="3" height="92" fill="#7dc6b2"/><text x="42" y="412" class="label" font-weight="600">MasaCtrl</text><text x="42" y="438" class="small muted">目标 Q 查源 K/V</text><rect x="334" y="382" width="542" height="116" rx="8" fill="#182230" stroke="#344355"/><rect x="334" y="394" width="3" height="92" fill="#a7b5ee"/><text x="352" y="412" class="label" font-weight="600">保持对象与边界</text><text x="352" y="438" class="small muted">目标布局读取源图内容</text><text x="352" y="461" class="small muted">时刻与蒙版决定复制程度</text><path d="M284 440H330" 