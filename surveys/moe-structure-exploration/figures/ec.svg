<svg xmlns="http://www.w3.org/2000/svg" width="480" height="536" viewBox="0 0 480 536" role="img"><title>TC / EC：谁选择谁？</title><rect width="480" height="536" fill="#ffffff"/><text x="20" y="30" font-size="22" font-family="sans-serif" fill="#172230">TC / EC：谁选择谁？</text><rect x="12" y="74" width="456" height="116" rx="8" fill="#edf2f7" stroke="#62738a"/><text x="22" y="104" font-size="22" font-family="sans-serif" fill="#172230">Token Choice · 每token选 k experts</text><text x="22" y="142" font-size="21" font-family="sans-serif" fill="#172230">t0 → e0 + e1；t1 → e0 + e1。箭头从</text><text x="22" y="168" font-size="21" font-family="sans-serif" fill="#172230">token出发，k的单位是experts/token。</text><rect x="12" y="214" width="456" height="116" rx="8" fill="#edf2f7" stroke="#62738a"/><text x="22" y="244" font-size="22" font-family="sans-serif" fill="#172230">Expert Choice · 每expert选 q tokens</text><text x="22" y="282" font-size="21" font-family="sans-serif" fill="#172230">e0 → t3；e1 → t2；e2 → t2。箭头从</text><text x="22" y="308" font-size="21" font-family="sans-serif" fill="#172230">expert出发，q的单位是tokens/expert。</text><rect x="12" y="354" width="456" height="142" rx="8" fill="#edf2f7" stroke="#62738a"/><text x="22" y="384" font-size="22" font-family="sans-serif" fill="#172230">固定列配额不保证行覆盖</text><text x="22" y="422" font-size="21" font-family="sans-serif" fill="#172230">T=4，E=3，q=1：t2重复被两expert选；</text><text x="22" y="448" font-size="21" font-family="sans-serif" fill="#172230">t0、t1没有专家记录。负载(1,1,1)，token</text><text x="22" y="474" font-size="21" font-family="sans-serif" fill="#172230">覆盖(0,0,2,1)。</text></svg>