<svg xmlns="http://www.w3.org/2000/svg" width="480" height="510" viewBox="0 0 480 510" role="img"><title>细粒度 / shared：预算拆分</title><rect width="480" height="510" fill="#ffffff"/><text x="20" y="30" font-size="22" font-family="sans-serif" fill="#172230">细粒度 / shared：预算拆分</text><rect x="12" y="74" width="456" height="116" rx="8" fill="#edf2f7" stroke="#62738a"/><text x="22" y="104" font-size="22" font-family="sans-serif" fill="#172230">Coarse · 每token top2</text><text x="22" y="142" font-size="21" font-family="sans-serif" fill="#172230">2个宽m的routed FFN → 专家主参数触及</text><text x="22" y="168" font-size="21" font-family="sans-serif" fill="#172230">6dm。</text><rect x="12" y="214" width="456" height="116" rx="8" fill="#edf2f7" stroke="#62738a"/><text x="22" y="244" font-size="22" font-family="sans-serif" fill="#172230">Fine · 每token top4</text><text x="22" y="282" font-size="21" font-family="sans-serif" fill="#172230">4个宽m/2的routed FFN → 同6dm，更多gate</text><text x="22" y="308" font-size="21" font-family="sans-serif" fill="#172230">列与记录。</text><rect x="12" y="354" width="456" height="116" rx="8" fill="#edf2f7" stroke="#62738a"/><text x="22" y="384" font-size="22" font-family="sans-serif" fill="#172230">Shared + routed</text><text x="22" y="422" font-size="21" font-family="sans-serif" fill="#172230">1个常开宽m/2 shared + top3宽m/2 routed</text><text x="22" y="448" font-size="21" font-family="sans-serif" fill="#172230">→ 同主预算；shared不进入routed分母。</text></svg>