<svg xmlns="http://www.w3.org/2000/svg" width="480" height="510" viewBox="0 0 480 510" role="img"><title>稀疏专家：输入、门控与组合</title><rect width="480" height="510" fill="#ffffff"/><text x="20" y="30" font-size="22" font-family="sans-serif" fill="#172230">稀疏专家：输入、门控与组合</text><rect x="12" y="74" width="456" height="116" rx="8" fill="#edf2f7" stroke="#62738a"/><text x="22" y="104" font-size="22" font-family="sans-serif" fill="#172230">Input · 同一token隐状态</text><text x="22" y="142" font-size="21" font-family="sans-serif" fill="#172230">x → gate；x → 被选择的专家。门控不是预</text><text x="22" y="168" font-size="21" font-family="sans-serif" fill="#172230">先指定的语义技能标签。</text><rect x="12" y="214" width="456" height="116" rx="8" fill="#edf2f7" stroke="#62738a"/><text x="22" y="244" font-size="22" font-family="sans-serif" fill="#172230">Gate · 选择少数专家</text><text x="22" y="282" font-size="21" font-family="sans-serif" fill="#172230">示例top2：e0、e2接收x；e1不执行。选后</text><text x="22" y="308" font-size="21" font-family="sans-serif" fill="#172230">权重来自相应路由定义。</text><rect x="12" y="354" width="456" height="116" rx="8" fill="#edf2f7" stroke="#62738a"/><text x="22" y="384" font-size="22" font-family="sans-serif" fill="#172230">Combine · 加权回写</text><text x="22" y="422" font-size="21" font-family="sans-serif" fill="#172230">g0 f0(x) + g2 f2(x) → 输出。专家调用数</text><text x="22" y="448" font-size="21" font-family="sans-serif" fill="#172230">不等于设备速度；小批次和通信另计。</text></svg>