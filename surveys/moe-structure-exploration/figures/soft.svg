<svg xmlns="http://www.w3.org/2000/svg" width="480" height="510" viewBox="0 0 480 510" role="img"><title>Soft：两次混合、一次slot变换</title><rect width="480" height="510" fill="#ffffff"/><text x="20" y="30" font-size="22" font-family="sans-serif" fill="#172230">Soft：两次混合、一次slot变换</text><rect x="12" y="74" width="456" height="116" rx="8" fill="#edf2f7" stroke="#62738a"/><text x="22" y="104" font-size="22" font-family="sans-serif" fill="#172230">Dispatch · token → slot</text><text x="22" y="142" font-size="21" font-family="sans-serif" fill="#172230">x0=2，x1=4；D=(½,½) → slot输入3。每列</text><text x="22" y="168" font-size="21" font-family="sans-serif" fill="#172230">沿token归一。</text><rect x="12" y="214" width="456" height="116" rx="8" fill="#edf2f7" stroke="#62738a"/><text x="22" y="244" font-size="22" font-family="sans-serif" fill="#172230">Expert · slot → transformed slot</text><text x="22" y="282" font-size="21" font-family="sans-serif" fill="#172230">只有一个slot：f(3)=3²=9。执行单位是</text><text x="22" y="308" font-size="21" font-family="sans-serif" fill="#172230">slot，不是每token各跑完整expert。</text><rect x="12" y="354" width="456" height="116" rx="8" fill="#edf2f7" stroke="#62738a"/><text x="22" y="384" font-size="22" font-family="sans-serif" fill="#172230">Combine · slot → token</text><text x="22" y="422" font-size="21" font-family="sans-serif" fill="#172230">C=(1,1) → y0=y1=9。每行沿slot归一；与</text><text x="22" y="448" font-size="21" font-family="sans-serif" fill="#172230">逐token平方(4,16)不同。</text></svg>