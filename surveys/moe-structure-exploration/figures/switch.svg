<svg xmlns="http://www.w3.org/2000/svg" width="480" height="536" viewBox="0 0 480 536" role="img"><title>容量：候选 → 接纳 → 残差</title><rect width="480" height="536" fill="#ffffff"/><text x="20" y="30" font-size="22" font-family="sans-serif" fill="#172230">容量：候选 → 接纳 → 残差</text><rect x="12" y="74" width="456" height="116" rx="8" fill="#edf2f7" stroke="#62738a"/><text x="22" y="104" font-size="22" font-family="sans-serif" fill="#172230">容量是每expert记录上限</text><text x="22" y="142" font-size="21" font-family="sans-serif" fill="#172230">e0容量1：t0 → e0接受；t1 → e0溢出。e1</text><text x="22" y="168" font-size="21" font-family="sans-serif" fill="#172230">空槽不能自动接收不属于它的候选。</text><rect x="12" y="214" width="456" height="142" rx="8" fill="#edf2f7" stroke="#62738a"/><text x="22" y="244" font-size="22" font-family="sans-serif" fill="#172230">Drop与padding不是同一计数</text><text x="22" y="282" font-size="21" font-family="sans-serif" fill="#172230">Overflow record → 不执行该expert分支；</text><text x="22" y="308" font-size="21" font-family="sans-serif" fill="#172230">unused slot → padding。提高CF可减</text><text x="22" y="334" font-size="21" font-family="sans-serif" fill="#172230">drop，但可能增工作区与通信。</text><rect x="12" y="380" width="456" height="116" rx="8" fill="#edf2f7" stroke="#62738a"/><text x="22" y="410" font-size="22" font-family="sans-serif" fill="#172230">输出与专家路径分离</text><text x="22" y="448" font-size="21" font-family="sans-serif" fill="#172230">零接纳token：routed=0 → y=x。残差定义</text><text x="22" y="474" font-size="21" font-family="sans-serif" fill="#172230">输出，但没有补回被丢expert的函数。</text></svg>