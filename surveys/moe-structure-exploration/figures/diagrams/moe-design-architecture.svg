<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img"><title>MoE four-domain design architecture</title><rect width="1280" height="720" fill="#f7f8fa"/><text x="64" y="62" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#172230">MoE design is four coupled contracts</text><text x="64" y="94" font-family="Arial,sans-serif" font-size="20" fill="#526174">Changing one layer does not preserve the layers below automatically.</text><rect x="64" y="132" width="1152" height="104" fill="#ffffff" stroke="#315b8a" stroke-width="3"/><rect x="64" y="132" width="238" height="104" fill="#315b8a"/><text x="86" y="176" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#ffffff">01  INFORMATION</text><text x="86" y="207" font-family="Arial,sans-serif" font-size="16" fill="#ffffff">design boundary</text><text x="336" y="175" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#172230">token / sequence / batch context</text><text x="336" y="208" font-family="Arial,sans-serif" font-size="19" fill="#526174">What may the router observe?</text><line x1="640" y1="236" x2="640" y2="264" stroke="#172230" stroke-width="3"/><path d="M630 254 L640 266 L650 254" fill="#172230"/><rect x="64" y="266" width="1152" height="104" fill="#ffffff" stroke="#8a4f3d" stroke-width="3"/><rect x="64" y="266" width="238" height="104" fill="#8a4f3d"/><text x="86" y="310" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#ffffff">02  ASSIGNMENT</text><text x="86" y="341" font-family="Arial,sans-serif" font-size="16" fill="#ffffff">design boundary</text><text x="336" y="309" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#172230">score → candidate → accept / cover</text><text x="336" y="342" font-family="Arial,sans-serif" font-size="19" fill="#526174">Which expert records exist?</text><line x1="640" y1="370" x2="640" y2="398" stroke="#172230" stroke-width="3"/><path d="M630 388 L640 400 L650 388" fill="#172230"/><rect x="64" y="400" width="1152" height="104" fill="#ffffff" stroke="#2d7264" stroke-width="3"/><rect x="64" y="400" width="238" height="104" fill="#2d7264"/><text x="86" y="444" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#ffffff">03  EXECUTION</text><text x="86" y="475" font-family="Arial,sans-serif" font-size="16" fill="#ffffff">design boundary</text><text x="336" y="443" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#172230">dispatch → expert / shared → combine</text><text x="336" y="476" font-family="Arial,sans-serif" font-size="19" fill="#526174">Which kernels and collectives run?</text><line x1="640" y1="504" x2="640" y2="532" stroke="#172230" stroke-width="3"/><path d="M630 522 L640 534 L650 522" fill="#172230"/><rect x="64" y="534" width="1152" height="104" fill="#ffffff" stroke="#72528a" stroke-width="3"/><rect x="64" y="534" width="238" height="104" fill="#72528a"/><text x="86" y="578" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#ffffff">04  RESIDENCY</text><text x="86" y="609" font-family="Arial,sans-serif" font-size="16" fill="#ffffff">design boundary</text><text x="336" y="577" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#172230">placement → cache / offload → version</text><text x="336" y="610" font-family="Arial,sans-serif" font-size="19" fill="#526174">Where are weights and state now?</text><text x="64" y="690" font-family="Arial,sans-serif" font-size="18" fill="#526174">Preservation audit: information → assignment → execution → residency → quality / latency / failure denominator</text></svg>