<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 565" role="img" aria-labelledby="svg-ddb6399b-title svg-ddb6399b-desc">
<title id="svg-ddb6399b-title">LoRA量化与合并顺序</title><desc id="svg-ddb6399b-desc">三种量化接口及同一网格0.24加0.04的非交换例子，导出需对齐表示与计算精度。</desc>
<defs><marker id="svg-ddb6399b-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8292a8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#dce4ef} .muted{fill:#9cabc0} .year{fill:#7dc6b2;font-size:17px;font-weight:600} .label{font-size:16px} .small{font-size:14px} .line{stroke:#718299;stroke-width:2;fill:none;marker-end:url(#svg-ddb6399b-arrow)}</style>
<text x="24" y="36" font-size="22" font-weight="600">量化后的旁路、初始化补偿与可吸收更新是三种接口</text><rect x="24" y="100" width="264" height="191" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="112" width="3" height="167" fill="#7dc6b2"/><text x="42" y="130" class="label" font-weight="600">QLoRA</text><text x="42" y="156" class="small muted">DQ(Q(W₀))x + sBAx</text><text x="42" y="179" class="small muted">低位基座 / 浮点支路</text><text x="42" y="202" class="small muted">NF4 / double quant</text><text x="42" y="225" class="small muted">合并后再量化需重测</text><rect x="318" y="100" width="264" height="191" rx="8" fill="#182230" stroke="#344355"/><rect x="318" y="112" width="3" height="167" fill="#a7b5ee"/><text x="336" y="130" class="label" font-weight="600">LoftQ</text><text x="336" y="156" class="small muted">Q / DQ 与 BA 联合初始化</text><text x="336" y="179" class="small muted">W₀ − DQ(Q) ≈ BA</text><text x="336" y="202" class="small muted">先补权重重建差距</text><text x="336" y="225" class="small muted">不保证任务 loss 最优</text><rect x="612" y="100" width="264" height="191" rx="8" fill="#182230" stroke="#344355"/><rect x="612" y="112" width="3" height="167" fill="#e6bf88"/><text x="630" y="130" class="label" font-weight="600">QA-LoRA</text><text x="630" y="156" class="small muted">输入按组求和</text><text x="630" y="179" class="small muted">同组增量共享</text><text x="630" y="202" class="small muted">吸收进量化偏置</text><text x="630" y="225" class="small muted">自由度 / 格式受约束</text><rect x="24" y="380" width="852" height="151" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="392" width="3" height="127" fill="#a7b5ee"/><text x="42" y="410" class="label" font-weight="600">同一网格：scale0.1，w₀0.24，增量0.04</text><text x="42" y="436" class="small muted">旁路：DQ(Q(0.24)) + 0.04 = 0.24；合并再量化：DQ(Q(0.28)) = 0.30。</text><text x="42" y="459" class="small muted">不相等不代表某边一定更好；训练和 export 必须对应目标函数。</text><text x="42" y="482" class="small muted">group / axis / codebook / scale / zero / layout / accum 精度一起核验。</text></svg>