<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" role="img" aria-labelledby="svg-ad4140f4-title svg-ad4140f4-desc">
<title id="svg-ad4140f4-title">LoRA线性层前向与反向</title><desc id="svg-ad4140f4-desc">输入经过完整冻结基座及A/B旁路后相加，反向仍传播；可合并但需要数值一致性验证。</desc>
<defs><marker id="svg-ad4140f4-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8292a8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#dce4ef} .muted{fill:#9cabc0} .year{fill:#7dc6b2;font-size:17px;font-weight:600} .label{font-size:16px} .small{font-size:14px} .line{stroke:#718299;stroke-width:2;fill:none;marker-end:url(#svg-ad4140f4-arrow)}</style>
<text x="24" y="36" font-size="22" font-weight="600">一个线性层：冻结大矩阵，训练小旁路，输出相加</text><rect x="24" y="112" width="170" height="120" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="124" width="3" height="96" fill="#7dc6b2"/><text x="42" y="142" class="label" font-weight="600">输入 x</text><text x="42" y="168" class="small muted">n 个特征</text><text x="42" y="191" class="small muted">工单 token 表示</text><rect x="282" y="92" width="300" height="120" rx="8" fill="#182230" stroke="#344355"/><rect x="282" y="104" width="3" height="96" fill="#a7b5ee"/><text x="300" y="122" class="label" font-weight="600">W₀：m × n（冻结）</text><text x="300" y="148" class="small muted">基座前向仍执行</text><text x="300" y="171" class="small muted">梯度仍可传给前层</text><rect x="240" y="302" width="195" height="120" rx="8" fill="#182230" stroke="#344355"/><rect x="240" y="314" width="3" height="96" fill="#7dc6b2"/><text x="258" y="332" class="label" font-weight="600">A：r × n</text><text x="258" y="358" class="small muted">输入 → r 维</text><text x="258" y="381" class="small muted">随机初始化</text><rect x="477" y="302" width="195" height="120" rx="8" fill="#182230" stroke="#344355"/><rect x="477" y="314" width="3" height="96" fill="#e6bf88"/><text x="495" y="332" class="label" font-weight="600">B：m × r</text><text x="495" y="358" class="small muted">r 维 → 输出</text><text x="495" y="381" class="small muted">初始零</text><rect x="714" y="182" width="162" height="150" rx="8" fill="#182230" stroke="#344355"/><rect x="714" y="194" width="3" height="126" fill="#7dc6b2"/><text x="732" y="212" class="label" font-weight="600">相加 → y</text><text x="732" y="238" class="small muted">W₀x + sBAx</text><text x="732" y="261" class="small muted">输出 m 维</text><path d="M197 164H278" class="line"/><path d="M106 235V362H236" class="line"/><path d="M439 362H473" class="line"/><path d="M586 153H795V178" class="line"/><path d="M676 362H795V336" class="line"/><rect x="24" y="486" width="405" height="143" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="498" width="3" height="119" fill="#7dc6b2"/><text x="42" y="516" class="label" font-weight="600">训练：省状态，不是只算旁路</text><text x="42" y="542" class="small muted">B 梯度需 AX；A 梯度常需 x</text><text x="42" y="565" class="small muted">冻结 W₀ 不切断整个反向链</text><text x="42" y="588" class="small muted">r16 / 4096²：参数比例0.78125%</text><rect x="470" y="486" width="406" height="143" rx="8" fill="#182230" stroke="#344355"/><rect x="470" y="498" width="3" height="119" fill="#a7b5ee"/><text x="488" y="516" class="label" font-weight="600">固定任务可合并</text><text x="488" y="542" class="small muted">Wmerged = W₀ + sBA</text><text x="488" y="565" class="small muted">先核对 alpha / rank / dropout</text><text x="488" y="588" class="small muted">有限精度需 logits 与任务复验</text></svg>