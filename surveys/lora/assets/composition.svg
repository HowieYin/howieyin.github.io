<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" role="img" aria-labelledby="svg-a57ff47f-title svg-a57ff47f-desc">
<title id="svg-a57ff47f-title">LoRA组合的代数对象</title><desc id="svg-a57ff47f-desc">严格增量串接与分别平均因子引入的交叉项不同，用实际训练adapter和真实层输入验证。</desc>
<defs><marker id="svg-a57ff47f-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8292a8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#dce4ef} .muted{fill:#9cabc0} .year{fill:#7dc6b2;font-size:17px;font-weight:600} .label{font-size:16px} .small{font-size:14px} .line{stroke:#718299;stroke-width:2;fill:none;marker-end:url(#svg-a57ff47f-arrow)}</style>
<text x="24" y="36" font-size="22" font-weight="600">先定义合并对象：增量相加与因子平均有不同代数</text><rect x="24" y="107" width="405" height="207" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="119" width="3" height="183" fill="#7dc6b2"/><text x="42" y="137" class="label" font-weight="600">严格增量和</text><text x="42" y="163" class="small muted">Δ = c₁s₁B₁A₁ + c₂s₂B₂A₂</text><text x="42" y="186" class="small muted">串接 Bcat=[c₁s₁B₁, c₂s₂B₂]</text><text x="42" y="209" class="small muted">Acat=[A₁; A₂]</text><text x="42" y="232" class="small muted">精确表达，内 rank 加和</text><text x="42" y="255" class="small muted">压缩回低 rank 又有新误差</text><rect x="470" y="107" width="406" height="207" rx="8" fill="#182230" stroke="#344355"/><rect x="470" y="119" width="3" height="183" fill="#e6bf88"/><text x="488" y="137" class="label" font-weight="600">分别平均因子</text><text x="488" y="163" class="small muted">(c₁B₁+c₂B₂)(c₁A₁+c₂A₂)</text><text x="488" y="186" class="small muted">多出 B₁A₂ / B₂A₁ 交叉项</text><text x="488" y="209" class="small muted">原增量系数也变为平方</text><text x="488" y="232" class="small muted">因子坐标还存在可逆变换</text><text x="488" y="255" class="small muted">LoRAHub：可学习但非严格和</text><rect x="24" y="393" width="852" height="151" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="405" width="3" height="127" fill="#a7b5ee"/><text x="42" y="423" class="label" font-weight="600">真实两个 rank4 adapter：同任务不同 seed，CPU float64</text><text x="42" y="449" class="small muted">第一层64个真实 token：因子平均与严格平均输出 max 差0.144317。</text><text x="42" y="472" class="small muted">串接与严格平均输出 max 差2.78×10⁻¹⁷，只验证代数。</text><text x="42" y="495" class="small muted">TIES符号选择 / DARE掩码引入新操作；跨任务能力要单独测试。</text></svg>