<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 565" role="img" aria-labelledby="svg-c945172a-title svg-c945172a-desc">
<title id="svg-c945172a-title">LoRA初始化信息与函数保持</title><desc id="svg-c945172a-desc">权重分解、激活与协方差、梯度三种信息源不同，非零因子必须从基座扣除以保持初始函数。</desc>
<defs><marker id="svg-c945172a-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8292a8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#dce4ef} .muted{fill:#9cabc0} .year{fill:#7dc6b2;font-size:17px;font-weight:600} .label{font-size:16px} .small{font-size:14px} .line{stroke:#718299;stroke-width:2;fill:none;marker-end:url(#svg-c945172a-arrow)}</style>
<text x="24" y="36" font-size="22" font-weight="600">初始化的信息源不同：基座、输入和目标不能混为一谈</text><rect x="24" y="99" width="264" height="190" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="111" width="3" height="166" fill="#7dc6b2"/><text x="42" y="129" class="label" font-weight="600">权重 W₀</text><text x="42" y="155" class="small muted">PiSSA：SVD 主方向</text><text x="42" y="178" class="small muted">OLoRA：QR 列基</text><text x="42" y="201" class="small muted">无需任务标签</text><text x="42" y="224" class="small muted">已有伸缩 ≠ 最佳任务方向</text><rect x="318" y="99" width="264" height="190" rx="8" fill="#182230" stroke="#344355"/><rect x="318" y="111" width="3" height="166" fill="#a7b5ee"/><text x="336" y="129" class="label" font-weight="600">输入 X / 协方差</text><text x="336" y="155" class="small muted">EVA：激活方差 / 预算</text><text x="336" y="178" class="small muted">CorDA：KPM / IPM</text><text x="336" y="201" class="small muted">数据扫描与统计成本</text><text x="336" y="224" class="small muted">高方差 ≠ 高任务价值</text><rect x="612" y="99" width="264" height="190" rx="8" fill="#182230" stroke="#344355"/><rect x="612" y="111" width="3" height="166" fill="#e6bf88"/><text x="630" y="129" class="label" font-weight="600">损失梯度 G</text><text x="630" y="155" class="small muted">LoRA-GA：G 的 SVD</text><text x="630" y="178" class="small muted">包含目标与监督信息</text><text x="630" y="201" class="small muted">全量梯度获取成本</text><text x="630" y="224" class="small muted">抽样方向 ≠ 全程 FT</text><rect x="24" y="373" width="852" height="154" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="385" width="3" height="130" fill="#a7b5ee"/><text x="42" y="403" class="label" font-weight="600">非零支路还要保持总函数：Wres = W₀ − sBinitAinit</text><text x="42" y="429" class="small muted">前向 Wres + sBA；初始化时相同分量减掉再加回。</text><text x="42" y="452" class="small muted">若共享原 W₀，应导出 s(BA − BinitAinit)，一般 rank 上界2r。</text><text x="42" y="475" class="small muted">有限精度减法、分解和量化需逐级核对，不只检查文件尺寸。</text></svg>