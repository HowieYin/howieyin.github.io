<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 602" role="img" aria-labelledby="svg-f22f44d7-title svg-f22f44d7-desc">
<title id="svg-f22f44d7-title">多适配器服务与缓存身份</title><desc id="svg-f22f44d7-desc">共享大基座GEMM、按请求匹配小adapter支路，并区分CPU权重缓存、GPU驻留和KV生命周期。</desc>
<defs><marker id="svg-f22f44d7-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8292a8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#dce4ef} .muted{fill:#9cabc0} .year{fill:#7dc6b2;font-size:17px;font-weight:600} .label{font-size:16px} .small{font-size:14px} .line{stroke:#718299;stroke-width:2;fill:none;marker-end:url(#svg-f22f44d7-arrow)}</style>
<text x="24" y="36" font-size="22" font-weight="600">同一批请求，共享基座计算；每行匹配自己的 adapter</text><rect x="24" y="100" width="264" height="150" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="112" width="3" height="126" fill="#7dc6b2"/><text x="42" y="130" class="label" font-weight="600">请求 batch / 调度</text><text x="42" y="156" class="small muted">row0 摘要 · row1 代码</text><text x="42" y="179" class="small muted">row2 摘要 · 长度 / 阶段</text><text x="42" y="202" class="small muted">adapter 身份进入映射</text><rect x="318" y="100" width="264" height="150" rx="8" fill="#182230" stroke="#344355"/><rect x="318" y="112" width="3" height="126" fill="#a7b5ee"/><text x="336" y="130" class="label" font-weight="600">共享基座 GEMM</text><text x="336" y="156" class="small muted">Xbatch × W₀ᵀ</text><text x="336" y="179" class="small muted">基座权重只共享一份</text><text x="336" y="202" class="small muted">attention / KV 另有成本</text><rect x="612" y="100" width="264" height="150" rx="8" fill="#182230" stroke="#344355"/><rect x="612" y="112" width="3" height="126" fill="#e6bf88"/><text x="630" y="130" class="label" font-weight="600">分段 adapter 支路</text><text x="630" y="156" class="small muted">每行取对应 A / B</text><text x="630" y="179" class="small muted">SGMV / 异构 rank kernel</text><text x="630" y="202" class="small muted">按原行加回输出</text><path d="M290 176H314" class="line"/><path d="M584 176H608" class="line"/><rect x="24" y="341" width="264" height="174" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="353" width="3" height="150" fill="#7dc6b2"/><text x="42" y="371" class="label" font-weight="600">CPU 权重缓存</text><text x="42" y="397" class="small muted">大库 / 冷加载 / LRU</text><text x="42" y="420" class="small muted">热度决定换入频率</text><text x="42" y="443" class="small muted">文件身份与版本一起绑定</text><rect x="318" y="341" width="264" height="174" rx="8" fill="#182230" stroke="#344355"/><rect x="318" y="353" width="3" height="150" fill="#a7b5ee"/><text x="336" y="371" class="label" font-weight="600">GPU 活跃 adapter</text><text x="336" y="397" class="small muted">rank / target / dtype</text><text x="336" y="420" class="small muted">页表或容量限制</text><text x="336" y="443" class="small muted">实际驻留 != 全部任务数</text><rect x="612" y="341" width="264" height="174" rx="8" fill="#182230" stroke="#344355"/><rect x="612" y="353" width="3" height="150" fill="#e6bf88"/><text x="630" y="371" class="label" font-weight="600">KV pages / prefix cache</text><text x="630" y="397" class="small muted">对应已计算的权重函数</text><text x="630" y="420" class="small muted">切换 adapter 不能任意复用</text><text x="630" y="443" class="small muted">基座 + adapter + tokens</text><path d="M290 427H314" class="line"/><path d="M450 337V254" class="line"/><text x="24" y="569" class="small muted">S-LoRA / Punica 为历史机制；2026 vLLM 官方已支持 LoRA。本文未跑多租户 GPU benchmark。</text></svg>