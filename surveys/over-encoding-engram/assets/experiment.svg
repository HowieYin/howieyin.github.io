<text x="24" y="36" font-size="22" font-weight="600">真实 Pythia 小支路：学习率改变结论，状态影响函数</text><text x="24" y="73" class="small muted">三seed / 同数据次序 / 120steps；新增参数不等，不作OE与Engram方法排名。</text><path d="M240.0 113V385" stroke="#263441"/><text x="230.0" y="415" class="small">60</text><path d="M310.1 113V385" stroke="#263441"/><text x="300.1" y="415" class="small">80</text><path d="M364.6 113V385" stroke="#263441"/><text x="354.6" y="415" class="small">100</text><path d="M463.4 113V385" stroke="#263441"/><text x="453.4" y="415" class="small">150</text><path d="M588.0 113V385" stroke="#263441"/><text x="578.0" y="415" class="small">250</text><path d="M670.0 113V385" stroke="#263441"/><text x="660.0" y="415" class="small">350</text><text x="24" y="148" class="small">输入 / LR1e−4</text><path d="M305.52 143H306.92" stroke="#7dc6b2" stroke-width="3"/><circle cx="306.22" cy="143" r="5" fill="#7dc6b2"/><text x="705" y="148" class="small">78.72 ± 0.23</text><text x="24" y="213" class="small">门控 / LR1e−4</text><path d="M291.76 208H297.82" stroke="#7dc6b2" stroke-width="3"/><circle cx="294.81" cy="208" r="5" fill="#7dc6b2"/><text x="705" y="213" class="small">75.12 ± 0.93</text><text x="24" y="278" class="small">输入 / LR1e−3</text><path d="M559.67 273H640.14" stroke="#e6bf88" stroke-width="3"/><circle cx="603.21" cy="273" r="5" fill="#e6bf88"/><text x="705" y="278" class="small">266.13 ± 43.52</text><text x="24" y="343" class="small">门控 / LR1e−3</text><path d="M380.02 338H558.05" stroke="#e6bf88" stroke-width="3"/><circle cx="484.94" cy="338" r="5" fill="#e6bf88"/><text x="705" y="343" class="small">163.85 ± 57.30</text><text x="350" y="446" class="small">测试PPL（对数坐标，越低越好）</text><rect x="24" y="487" width="406" height="147" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="499" width="3" height="123" fill="#e6bf88"/><text x="42" y="517" class="label" font-weight="600">高LR退化不是容量定律</text><text x="42" y="543" class="small muted">基座PPL82.2011</text><text x="42" y="566" class="small muted">