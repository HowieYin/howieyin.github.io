<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 651" role="img" aria-labelledby="svg-ea4351e0-title svg-ea4351e0-desc">
<title id="svg-ea4351e0-title">多头地址与相关碰撞</title><desc id="svg-ea4351e0-desc">两词串共享一个head行但联合地址不同；同模数只加seed的head共同碰撞，独立概率不能直接使用。</desc>
<defs><marker id="svg-ea4351e0-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8292a8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#dce4ef} .muted{fill:#9cabc0} .year{fill:#7dc6b2;font-size:17px;font-weight:600} .label{font-size:16px} .small{font-size:14px} .line{stroke:#718299;stroke-width:2;fill:none;marker-end:url(#svg-ea4351e0-arrow)}</style>
<text x="24" y="36" font-size="22" font-weight="600">完整地址不同，部分表行仍可能共享</text><rect x="24" y="109" width="230" height="119" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="121" width="3" height="95" fill="#7dc6b2"/><text x="42" y="139" class="label" font-weight="600">词串 A：New York</text><text x="42" y="165" class="small muted">head1 → row7</text><text x="42" y="188" class="small muted">head2 → row12</text><rect x="24" y="268" width="230" height="119" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="280" width="3" height="95" fill="#a7b5ee"/><text x="42" y="298" class="label" font-weight="600">词串 B：…</text><text x="42" y="324" class="small muted">head1 → row7</text><text x="42" y="347" class="small muted">head2 → row29</text><rect x="333" y="144" width="220" height="208" rx="8" fill="#182230" stroke="#344355"/><rect x="333" y="156" width="3" height="184" fill="#e6bf88"/><text x="351" y="174" class="label" font-weight="600">head1 的 row7</text><text x="351" y="200" class="small muted">两个key共同读</text><text x="351" y="223" class="small muted">两个key共同更新</text><text x="351" y="246" class="small muted">局部参数干扰仍在</text><rect x="633" y="109" width="243" height="119" rx="8" fill="#182230" stroke="#344355"/><rect x="633" y="121" width="3" height="95" fill="#7dc6b2"/><text x="651" y="139" class="label" font-weight="600">head2 的 row12</text><text x="651" y="165" class="small muted">完整地址A=(7,12)</text><text x="651" y="188" class="small muted">保留另一头的区别</text><rect x="633" y="268" width="243" height="119" rx="8" fill="#182230" stroke="#344355"/><rect x="633" y="280" width="3" height="95" fill="#a7b5ee"/><text x="651" y="298" class="label" font-weight="600">head2 的 row29</text><text x="651" y="324" class="small muted">完整地址B=(7,29)</text><text x="651" y="347" class="small muted">联合地址未合并</text><path d="M258 170H305V208H329" class="line"/><path d="M258 329H305V288H329" class="line"/><path d="M258 123H599V145H629" class="line"/><path d="M258 376H599V351H629" class="line"/><rect x="24" y="466" width="852" height="149" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="478" width="3" height="125" fill="#e6bf88"/><text x="42" y="496" class="label" font-weight="600">反例：所有head只换加法seed、使用同一个模数</text><text x="42" y="522" class="small muted">hⱼ(q) = (S(q)+sⱼ) mod M；第一头碰撞意味着S差是M倍数。</text><text x="42" y="545" class="small muted">任意head加偏移后仍碰撞；多个occupancy mask只是集合循环平移。</text><text x="42" y="568" class="small muted">不同素数模数可减轻共同碰撞，但不自动等于独立随机哈希。</text></svg>