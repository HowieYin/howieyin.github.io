<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 565" role="img" aria-labelledby="svg-b4ff6f82-title svg-b4ff6f82-desc">
<title id="svg-b4ff6f82-title">条件记忆低位存储与读取预算</title><desc id="svg-b4ff6f82-desc">以DeepSeek256维行解释多层存储、GPUhost驻留与动态1.5/2.1bit读取，固定QDQ不代表packed速度。</desc>
<defs><marker id="svg-b4ff6f82-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8292a8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#dce4ef} .muted{fill:#9cabc0} .year{fill:#7dc6b2;font-size:17px;font-weight:600} .label{font-size:16px} .small{font-size:14px} .line{stroke:#718299;stroke-width:2;fill:none;marker-end:url(#svg-b4ff6f82-arrow)}</style>
<text x="24" y="36" font-size="22" font-weight="600">低位预算要问：保存多少、驻留哪里、这次读多深</text><text x="24" y="76" class="small muted">下方数字以256维行、每层1bit code＋FP16行scale为例。</text><rect x="24" y="108" width="264" height="194" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="120" width="3" height="170" fill="#7dc6b2"/><text x="42" y="138" class="label" font-weight="600">整表存储</text><text x="42" y="164" class="small muted">L1 + L2 (+ L3)</text><text x="42" y="187" class="small muted">每层1bit + FP16scale</text><text x="42" y="210" class="small muted">两层≈2.125bit/元素</text><text x="42" y="233" class="small muted">三层≈3.1875bit/元素</text><rect x="318" y="108" width="264" height="194" rx="8" fill="#182230" stroke="#344355"/><rect x="318" y="120" width="3" height="170" fill="#a7b5ee"/><text x="336" y="138" class="label" font-weight="600">GPU / Host 驻留</text><text x="336" y="164" class="small muted">GPU：所有行L1</text><text x="336" y="187" class="small muted">Host：可补读residual</text><text x="336" y="210" class="small muted">共有表 / node副本</text><text x="336" y="233" class="small muted">驻留不等于平均读率</text><rect x="612" y="108" width="264" height="194" rx="8" fill="#182230" stroke="#344355"/><rect x="612" y="120" width="3" height="170" fill="#e6bf88"/><text x="630" y="138" class="label" font-weight="600">单次 lookup 读取</text><text x="630" y="164" class="small muted">先L1 → gate / 排序</text><text x="630" y="187" class="small muted">部分读L2，少部分L3</text><text x="630" y="210" class="small muted">平均可为1.5 / 2.1bit</text><text x="630" y="233" class="small muted">实际传输还要packing</text><rect x="24" y="381" width="406" height="148" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="393" width="3" height="124" fill="#7dc6b2"/><text x="42" y="411" class="label" font-weight="600">固定 PTQ / QAT</text><text x="42" y="437" class="small muted">低位code+row scale重建</text><text x="42" y="460" class="small muted">QAT通常仍保留高精度master</text><text x="42" y="483" class="small muted">QDQ仿真不减少gather字节</text><rect x="470" y="381" width="406" height="148" rx="8" fill="#182230" stroke="#344355"/><rect x="470" y="393" width="3" height="124" fill="#e6bf88"/><text x="488" y="411" class="label" font-weight="600">GateRQ 的额外依赖</text><text x="488" y="437" class="small muted">先有当前门，才决定residual</text><text x="488" y="460" class="small muted">batch quota可跨多个请求</text><text x="488" y="483" class="small muted">table-side核不等整步latency</text></svg>