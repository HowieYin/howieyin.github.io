<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 815" role="img" aria-labelledby="svg-708f5174-title svg-708f5174-desc">
<title id="svg-708f5174-title">局部查表与条件记忆技术发展总览</title><desc id="svg-708f5174-desc">三条并行路线从统计与连续语言模型发展到OE、SCONE、Engram、动态记忆和外部检索，并汇入碰撞、低位与写入验证。</desc>
<defs><marker id="svg-708f5174-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8292a8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#dce4ef} .muted{fill:#9cabc0} .year{fill:#7dc6b2;font-size:17px;font-weight:600} .label{font-size:16px} .small{font-size:14px} .line{stroke:#718299;stroke-width:2;fill:none;marker-end:url(#svg-708f5174-arrow)}</style>
<text x="24" y="34" font-size="22" font-weight="600">从局部模式到条件记忆：三条路线与共同瓶颈</text><text x="148" y="76" class="label" fill="#7dc6b2">确定性局部输入</text><text x="394" y="76" class="label" fill="#a7b5ee">动态键 / 计算</text><text x="640" y="76" class="label" fill="#e6bf88">实例 / 文本 / 计数</text><text x="24" y="128" class="year">2000–03</text><rect x="148" y="98" width="226" height="108" rx="8" fill="#182230" stroke="#344355"/><rect x="148" y="110" width="3" height="84" fill="#7dc6b2"/><text x="166" y="128" class="label" font-weight="600">连续泛化</text><text x="166" y="154" class="small muted">Bengio：共享词向量</text><text x="166" y="177" class="small muted">稀疏计数 → 连续概率</text><path d="M261 210V229" class="line"/><rect x="394" y="98" width="226" height="108" rx="8" fill="#182230" stroke="#344355"/><rect x="394" y="110" width="3" height="84" fill="#a7b5ee"/><text x="412" y="128" class="label" font-weight="600">共享神经计算</text><text x="412" y="154" class="small muted">窗口网络学习相似性</text><text x="412" y="177" class="small muted">局部组合仍有限</text><path d="M507 210V229" class="line"/><rect x="640" y="98" width="226" height="108" rx="8" fill="#182230" stroke="#344355"/><rect x="640" y="110" width="3" height="84" fill="#e6bf88"/><text x="658" y="128" class="label" font-weight="600">统计 n-gram</text><text x="658" y="154" class="small muted">计数 / 回退 / 插值</text><text x="658" y="177" class="small muted">未见长词串稀疏</text><path d="M753 210V229" class="line"/><text x="24" y="263" class="year">2019–22</text><rect x="148" y="233" width="226" height="108" rx="8" fill="#182230" stroke="#344355"/><rect x="148" y="245" width="3" height="84" fill="#7dc6b2"/><text x="166" y="263" class="label" font-weight="600">查表扩容</text><text x="166" y="289" class="small muted">LookupLM：历史词串</text><text x="166" y="312" class="small muted">N-Grammer：潜在bigram</text><path d="M261 345V364" class="line"/><rect x="394" y="233" width="226" height="108" rx="8" fill="#182230" stroke="#344355"/><rect x="394" y="245" width="3" height="84" fill="#a7b5ee"/><text x="412" y="263" class="label" font-weight="600">PKM 乘积键</text><text x="412" y="289" class="small muted">query 之后才选地址</text><text x="412" y="312" class="small muted">容量 / top-k 成本</text><path d="M507 345V364" class="line"/><rect x="640" y="233" width="226" height="108" rx="8" fill="#182230" stroke="#344355"/><rect x="640" y="245" width="3" height="84" fill="#e6bf88"/><text x="658" y="263" class="label" font-weight="600">kNN-LM / RETRO</text><text x="658" y="289" class="small muted">实例概率 / 文本块</text><text x="658" y="312" class="small muted">索引与检索成本</text><path d="M753 345V364" class="line"/><text x="24" y="398" class="year">2024–25</text><rect x="148" y="368" width="226" height="108" rx="8" fill="#182230" stroke="#344355"/><rect x="148" y="380" width="3" height="84" fill="#7dc6b2"/><text x="166" y="398" class="label" font-weight="600">输入与输出解耦</text><text x="166" y="424" class="small muted">OE：独立表与投影</text><text x="166" y="447" class="small muted">SCONE：局部计算离线</text><path d="M261 480V499" class="line"/><rect x="394" y="368" width="226" height="108" rx="8" fill="#182230" stroke="#344355"/><rect x="394" y="380" width="3" height="84" fill="#a7b5ee"/><text x="412" y="398" class="label" font-weight="600">动态记忆扩展</text><text x="412" y="424" class="small muted">Memory / UltraMem V2</text><text x="412" y="447" class="small muted">共享表 / value计算</text><path d="M507 480V499" class="line"/><rect x="640" y="368" width="226" height="108" rx="8" fill="#182230" stroke="#344355"/><rect x="640" y="380" width="3" height="84" fill="#e6bf88"/><text x="658" y="398" class="label" font-weight="600">Infini-gram / BLT</text><text x="658" y="424" class="small muted">计数索引 / byte patch</text><text x="658" y="447" class="small muted">统计与输入架构边界</text><path d="M753 480V499" class="line"/><text x="24" y="533" class="year">2026</text><rect x="148" y="503" width="226" height="108" rx="8" fill="#182230" stroke="#344355"/><rect x="148" y="515" width="3" height="84" fill="#7dc6b2"/><text x="166" y="533" class="label" font-weight="600">Engram / DSE</text><text x="166" y="559" class="small muted">静态地址 + 动态gate</text><text x="166" y="582" class="small muted">MoE预算 / 预取窗口</text><rect x="394" y="503" width="226" height="108" rx="8" fill="#182230" stroke="#344355"/><rect x="394" y="515" width="3" height="84" fill="#a7b5ee"/><text x="412" y="533" class="label" font-weight="600">接口与共享</text><text x="412" y="559" class="small muted">TN-gram / byte hash</text><text x="412" y="582" class="small muted">低秩约束 / 桥接训练</text><rect x="640" y="503" width="226" height="108" rx="8" fill="#182230" stroke="#344355"/><rect x="640" y="515" width="3" height="84" fill="#e6bf88"/><text x="658" y="533" class="label" font-weight="600">写入与反证</text><text x="658" y="559" class="small muted">Adapter / User / Edit</text><text x="658" y="582" class="small muted">Forking / Atoms：边界</text><rect x="24" y="653" width="852" height="100" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="665" width="3" height="76" fill="#7dc6b2"/><text x="42" y="683" class="label" font-weight="600">共同瓶颈 → 新一轮验证</text><text x="42" y="709" class="small muted">稀疏更新 / 行冲突 → 筛频与共享；随机访存 → offload / CXL / 低位表。</text><text x="42" y="732" class="small muted">GateRQ按lookup精度；可读 / 可写 / 可组合分开；服务状态需异常后恢复。</text><text x="24" y="786" class="small muted">竖箭头表示问题继承；横列是并行路线，非互相替代。截止2026-11-19。</text></svg>