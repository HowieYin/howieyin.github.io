<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 705" role="img" aria-labelledby="svg-578872a9-title svg-578872a9-desc">
<title id="svg-578872a9-title">条件记忆推理成本与状态路径</title><desc id="svg-578872a9-desc">token历史到hash、gather、传输解码、投影门控、卷积主干，prefill重叠窗口与decode请求身份。</desc>
<defs><marker id="svg-578872a9-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8292a8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#dce4ef} .muted{fill:#9cabc0} .year{fill:#7dc6b2;font-size:17px;font-weight:600} .label{font-size:16px} .small{font-size:14px} .line{stroke:#718299;stroke-width:2;fill:none;marker-end:url(#svg-578872a9-arrow)}</style>
<text x="24" y="36" font-size="22" font-weight="600">服务关键路径：按数据流拆开每项时间</text><rect x="24" y="108" width="264" height="127" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="120" width="3" height="103" fill="#7dc6b2"/><text x="42" y="138" class="label" font-weight="600">token / 历史</text><text x="42" y="164" class="small muted">请求ID + 位置</text><text x="42" y="187" class="small muted">压缩 / hash</text><rect x="318" y="108" width="264" height="127" rx="8" fill="#182230" stroke="#344355"/><rect x="318" y="120" width="3" height="103" fill="#7dc6b2"/><text x="336" y="138" class="label" font-weight="600">地址 → gather</text><text x="336" y="164" class="small muted">GPU / CPU / peer</text><text x="336" y="187" class="small muted">随机读 / 排队</text><rect x="612" y="108" width="264" height="127" rx="8" fill="#182230" stroke="#344355"/><rect x="612" y="120" width="3" height="103" fill="#7dc6b2"/><text x="630" y="138" class="label" font-weight="600">传输 / 解码</text><text x="630" y="164" class="small muted">pinned / UVA / 对齐</text><text x="630" y="187" class="small muted">低位code → 向量</text><rect x="24" y="319" width="264" height="127" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="331" width="3" height="103" fill="#a7b5ee"/><text x="42" y="349" class="label" font-weight="600">残差 / 主干</text><text x="42" y="375" class="small muted">卷积状态 + add</text><text x="42" y="398" class="small muted">Attention / MoE</text><rect x="318" y="319" width="264" height="127" rx="8" fill="#182230" stroke="#344355"/><rect x="318" y="331" width="3" height="103" fill="#a7b5ee"/><text x="336" y="349" class="label" font-weight="600">门控 / value</text><text x="336" y="375" class="small muted">query匹配key</text><text x="336" y="398" class="small muted">当前gate后可补读</text><rect x="612" y="319" width="264" height="127" rx="8" fill="#182230" stroke="#344355"/><rect x="612" y="331" width="3" height="103" fill="#a7b5ee"/><text x="630" y="349" class="label" font-weight="600">投影 K / V</text><text x="630" y="375" class="small muted">仍有GEMM算术</text><text x="630" y="398" class="small muted">等待当前层query</text><path d="M292 172H314" class="line"/><path d="M586 172H608" class="line"/><path d="M744 239V315" class="line"/><path d="M608 382H586" class="line"/><path d="M314 382H292" class="line"/><rect x="24" y="523" width="406" height="146" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="535" width="3" height="122" fill="#7dc6b2"/><text x="42" y="553" class="label" font-weight="600">Prefill：已知地址可批量预取</text><text x="42" y="579" class="small muted">前序层计算提供重叠窗口C</text><text x="42" y="602" class="small muted">理想等待 max(0, Tio−C)</text><text x="42" y="625" class="small muted">早层 / 小batch窗口较紧</text><rect x="470" y="523" width="406" height="146" rx="8" fill="#182230" stroke="#344355"/><rect x="470" y="535" width="3" height="122" fill="#e6bf88"/><text x="488" y="553" class="label" font-weight="600">Decode / abort：状态先正确</text><text x="488" y="579" class="small muted">原token尾部 + 卷积value历史</text><text x="488" y="602" class="small muted">batch重排 / overlay / cache版本</text><text x="488" y="625" class="small muted">恢复不仅是进程不崩溃</text></svg>