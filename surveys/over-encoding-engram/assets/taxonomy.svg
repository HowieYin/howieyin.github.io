<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 655" role="img" aria-labelledby="svg-548a8f18-title svg-548a8f18-desc">
<title id="svg-548a8f18-title">语言模型记忆分类</title><desc id="svg-548a8f18-desc">四种记忆按地址来源、读取内容和注入位置分类，KVcache是不同的请求计算状态。</desc>
<defs><marker id="svg-548a8f18-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8292a8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#dce4ef} .muted{fill:#9cabc0} .year{fill:#7dc6b2;font-size:17px;font-weight:600} .label{font-size:16px} .small{font-size:14px} .line{stroke:#718299;stroke-width:2;fill:none;marker-end:url(#svg-548a8f18-arrow)}</style>
<text x="24" y="36" font-size="22" font-weight="600">同样叫“记忆”，地址、内容和注入位置不同</text><rect x="24" y="101" width="252" height="92" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="113" width="3" height="68" fill="#7dc6b2"/><text x="42" y="131" class="label" font-weight="600">token / byte后缀</text><text x="42" y="157" class="small muted">① 何时能确定地址</text><rect x="318" y="101" width="258" height="92" rx="8" fill="#182230" stroke="#344355"/><rect x="318" y="113" width="3" height="68" fill="#7dc6b2"/><text x="336" y="131" class="label" font-weight="600">OE / SCONE / Engram</text><text x="336" y="157" class="small muted">② 存什么 / 怎样读</text><rect x="618" y="101" width="258" height="92" rx="8" fill="#182230" stroke="#344355"/><rect x="618" y="113" width="3" height="68" fill="#7dc6b2"/><text x="636" y="131" class="label" font-weight="600">向量 → 输入 / 层残差</text><text x="636" y="157" class="small muted">③ 在哪里影响预测</text><path d="M280 148H314" class="line"/><path d="M580 148H614" class="line"/><rect x="24" y="224" width="252" height="92" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="236" width="3" height="68" fill="#a7b5ee"/><text x="42" y="254" class="label" font-weight="600">当前 hidden query</text><text x="42" y="280" class="small muted">① 何时能确定地址</text><rect x="318" y="224" width="258" height="92" rx="8" fill="#182230" stroke="#344355"/><rect x="318" y="236" width="3" height="68" fill="#a7b5ee"/><text x="336" y="254" class="label" font-weight="600">PKM / Memory / MoC</text><text x="336" y="280" class="small muted">② 存什么 / 怎样读</text><rect x="618" y="224" width="258" height="92" rx="8" fill="#182230" stroke="#344355"/><rect x="618" y="236" width="3" height="68" fill="#a7b5ee"/><text x="636" y="254" class="label" font-weight="600">学到的值 → 层残差</text><text x="636" y="280" class="small muted">③ 在哪里影响预测</text><path d="M280 271H314" class="line"/><path d="M580 271H614" class="line"/><rect x="24" y="347" width="252" height="92" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="359" width="3" height="68" fill="#e6bf88"/><text x="42" y="377" class="label" font-weight="600">神经近邻 / 文本块</text><text x="42" y="403" class="small muted">① 何时能确定地址</text><rect x="318" y="347" width="258" height="92" rx="8" fill="#182230" stroke="#344355"/><rect x="318" y="359" width="3" height="68" fill="#e6bf88"/><text x="336" y="377" class="label" font-weight="600">kNN-LM / RETRO</text><text x="336" y="403" class="small muted">② 存什么 / 怎样读</text><rect x="618" y="347" width="258" height="92" rx="8" fill="#182230" stroke="#344355"/><rect x="618" y="359" width="3" height="68" fill="#e6bf88"/><text x="636" y="377" class="label" font-weight="600">标签概率 / 文本交互</text><text x="636" y="403" class="small muted">③ 在哪里影响预测</text><path d="M280 394H314" class="line"/><path d="M580 394H614" class="line"/><rect x="24" y="470" width="252" height="92" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="482" width="3" height="68" fill="#7dc6b2"/><text x="42" y="500" class="label" font-weight="600">词串精确计数</text><text x="42" y="526" class="small muted">① 何时能确定地址</text><rect x="318" y="470" width="258" height="92" rx="8" fill="#182230" stroke="#344355"/><rect x="318" y="482" width="3" height="68" fill="#7dc6b2"/><text x="336" y="500" class="label" font-weight="600">Infini-gram</text><text x="336" y="526" class="small muted">② 存什么 / 怎样读</text><rect x="618" y="470" width="258" height="92" rx="8" fill="#182230" stroke="#344355"/><rect x="618" y="482" width="3" height="68" fill="#7dc6b2"/><text x="636" y="500" class="label" font-weight="600">统计概率 → 输出插值</text><text x="636" y="526" class="small muted">③ 在哪里影响预测</text><path d="M280 517H314" class="line"/><path d="M580 517H614" class="line"/><text x="24" y="622" class="small muted">KV cache 保存本请求过去计算结果；以上记忆多为共享训练参数或外部资料。</text></svg>