<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" role="img" aria-labelledby="svg-ecc9eb6f-title svg-ecc9eb6f-desc">
<title id="svg-ecc9eb6f-title">Engram地址门控与请求状态</title><desc id="svg-ecc9eb6f-desc">静态token地址提前读取，动态query计算门控，因果卷积加回残差；token与卷积历史分别保存。</desc>
<defs><marker id="svg-ecc9eb6f-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8292a8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#dce4ef} .muted{fill:#9cabc0} .year{fill:#7dc6b2;font-size:17px;font-weight:600} .label{font-size:16px} .small{font-size:14px} .line{stroke:#718299;stroke-width:2;fill:none;marker-end:url(#svg-ecc9eb6f-arrow)}</style>
<text x="24" y="36" font-size="22" font-weight="600">Engram：取哪行可提前，用多少要等当前上下文</text><rect x="24" y="101" width="220" height="123" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="113" width="3" height="99" fill="#7dc6b2"/><text x="42" y="131" class="label" font-weight="600">已知 token：New / York</text><text x="42" y="157" class="small muted">原ID进入主干</text><text x="42" y="180" class="small muted">规范ID只给记忆支路</text><rect x="293" y="101" width="255" height="123" rx="8" fill="#182230" stroke="#344355"/><rect x="293" y="113" width="3" height="99" fill="#7dc6b2"/><text x="311" y="131" class="label" font-weight="600">后缀 → 多头地址</text><text x="311" y="157" class="small muted">New York / … New York</text><text x="311" y="180" class="small muted">mix + 各头不同模数</text><rect x="598" y="101" width="278" height="123" rx="8" fill="#182230" stroke="#344355"/><rect x="598" y="113" width="3" height="99" fill="#7dc6b2"/><text x="616" y="131" class="label" font-weight="600">提前 gather / prefetch</text><text x="616" y="157" class="small muted">CPU / GPU 表取窄向量</text><text x="616" y="180" class="small muted">concat → z</text><path d="M248 163H289" class="line"/><path d="M552 163H594" class="line"/><rect x="24" y="310" width="255" height="137" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="322" width="3" height="113" fill="#a7b5ee"/><text x="42" y="340" class="label" font-weight="600">前序主干 → query q</text><text x="42" y="366" class="small muted">整句问的是州还是人口</text><text x="42" y="389" class="small muted">同词串上下文不同</text><rect x="330" y="310" width="250" height="137" rx="8" fill="#182230" stroke="#344355"/><rect x="330" y="322" width="3" height="113" fill="#a7b5ee"/><text x="348" y="340" class="label" font-weight="600">投影 K / V + gate</text><text x="348" y="366" class="small muted">K匹配q → α ∈ (0,1)</text><text x="348" y="389" class="small muted">u = αV；不是概率</text><rect x="630" y="310" width="246" height="137" rx="8" fill="#182230" stroke="#344355"/><rect x="630" y="322" width="3" height="113" fill="#e6bf88"/><text x="648" y="340" class="label" font-weight="600">因果短卷积 → 加回</text><text x="648" y="366" class="small muted">只读当前与过去u</text><text x="648" y="389" class="small muted">再经attention / MoE</text><path d="M283 378H326" class="line"/><path d="M584 378H626" class="line"/><path d="M737 228V273H455V306" class="line"/><rect x="24" y="518" width="406" height="125" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="530" width="3" height="101" fill="#7dc6b2"/><text x="42" y="548" class="label" font-weight="600">请求状态 A：token尾部</text><text x="42" y="574" class="small muted">2/3-gram需最后2个token</text><text x="42" y="597" class="small muted">分块 / decode继续同一历史</text><rect x="470" y="518" width="406" height="125" rx="8" fill="#182230" stroke="#344355"/><rect x="470" y="530" width="3" height="101" fill="#e6bf88"/><text x="488" y="548" class="label" font-weight="600">请求状态 B：卷积value</text><text x="488" y="574" class="small muted">kernel4 / dilation3需9个过去u</text><text x="488" y="597" class="small muted">只保token不足以保持等价</text></svg>