<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 682" role="img" aria-labelledby="svg-872c53c6-title svg-872c53c6-desc">
<title id="svg-872c53c6-title">条件记忆读写组合与还原</title><desc id="svg-872c53c6-desc">四个独立验证关口分别是可读、可写、可组合和可还原，指标与失败模式不同。</desc>
<defs><marker id="svg-872c53c6-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8292a8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#dce4ef} .muted{fill:#9cabc0} .year{fill:#7dc6b2;font-size:17px;font-weight:600} .label{font-size:16px} .small{font-size:14px} .line{stroke:#718299;stroke-width:2;fill:none;marker-end:url(#svg-872c53c6-arrow)}</style>
<text x="24" y="36" font-size="22" font-weight="600">从“记忆有用”到“可靠写入”，要通过四项不同验证</text><rect x="24" y="102" width="180" height="97" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="114" width="3" height="73" fill="#7dc6b2"/><text x="42" y="132" class="label" font-weight="600">① 可读</text><text x="42" y="158" class="small muted">主干使用</text><rect x="250" y="102" width="626" height="97" rx="8" fill="#182230" stroke="#344355"/><rect x="250" y="114" width="3" height="73" fill="#7dc6b2"/><text x="268" y="132" class="label" font-weight="600">主干学会用表</text><text x="268" y="158" class="small muted">相同写法在早期checkpoint可能无效</text><text x="268" y="181" class="small muted">关表loss变化不等知识归属比例</text><path d="M208 149H246" class="line"/><rect x="24" y="229" width="180" height="97" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="241" width="3" height="73" fill="#a7b5ee"/><text x="42" y="259" class="label" font-weight="600">② 可写</text><text x="42" y="285" class="small muted">地址协调</text><rect x="250" y="229" width="626" height="97" rx="8" fill="#182230" stroke="#344355"/><rect x="250" y="241" width="3" height="73" fill="#a7b5ee"/><text x="268" y="259" class="label" font-weight="600">共享地址更新能匹配目标</text><text x="268" y="285" class="small muted">joint协调行；改写覆盖更多触发</text><text x="268" y="308" class="small muted">高频行少改，检查原对变错</text><path d="M208 276H246" class="line"/><rect x="24" y="356" width="180" height="97" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="368" width="3" height="73" fill="#e6bf88"/><text x="42" y="386" class="label" font-weight="600">③ 可组合</text><text x="42" y="412" class="small muted">多跳答案</text><rect x="250" y="356" width="626" height="97" rx="8" fill="#182230" stroke="#344355"/><rect x="250" y="368" width="3" height="73" fill="#e6bf88"/><text x="268" y="386" class="label" font-weight="600">未直接写入的关系推理</text><text x="268" y="412" class="small muted">单跳成功乘积不是组合能力证明</text><text x="268" y="435" class="small muted">多跳prompt / alias / 分母明确</text><path d="M208 403H246" class="line"/><rect x="24" y="483" width="180" height="97" rx="8" fill="#182230" stroke="#344355"/><rect x="24" y="495" width="3" height="73" fill="#7dc6b2"/><text x="42" y="513" class="label" font-weight="600">④ 可还原</text><text x="42" y="539" class="small muted">函数等价</text><rect x="250" y="483" width="626" height="97" rx="8" fill="#182230" stroke="#344355"/><rect x="250" y="495" width="3" height="73" fill="#7dc6b2"/><text x="268" y="513" class="label" font-weight="600">请求生命周期与函数恢复</text><text x="268" y="539" class="small muted">abort后表 / 历史 / cache身份恢复</text><text x="268" y="562" class="small muted">logits与业务输出回到原基线</text><path d="M208 530H246" class="line"/><text x="24" y="651" class="small muted">User / Adapter / Edit / Atoms / Forking实验不同；一项高分不能替代其余验证。</text></svg>